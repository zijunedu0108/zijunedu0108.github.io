<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Connect</title>
    <link rel="icon" type="image/png" href="zijunlogo.png">
    <link rel="apple-touch-icon" href="zijunlogo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }
        .mirror { transform: scaleX(-1); }

        @keyframes handWave {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            75% { transform: rotate(15deg) scale(1.1); }
        }
        .hand-anim {
            animation: handWave 1s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        .pulse-ring { animation: pulseRing 1.5s infinite; }

        @media (max-width: 767px) {
            #sidebar {
                position: fixed;
                top: 0; right: 0; bottom: 0;
                width: 85%; max-width: 340px;
                z-index: 40;
                transition: transform 0.3s ease-out;
            }
            #sidebar.sidebar-hidden { transform: translateX(100%); }
            #sidebarBackdrop {
                position: fixed; inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 35;
                transition: opacity 0.3s;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden antialiased">

    <header class="glass h-16 px-6 flex items-center justify-between z-20 shrink-0 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-900 flex items-center justify-center shadow-lg shadow-indigo-500/20 border border-slate-800">
                <img src="zijunlogo.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">P2P Connect</h1>
                <p class="text-xs text-slate-400">WebRTC Real-time Calling</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="roomBadge" class="hidden items-center gap-2 px-3 py-1.5 rounded-full text-xs font-mono bg-indigo-500/10 border border-indigo-500/30 text-indigo-300">
                <i class="fa-solid fa-door-open text-indigo-400"></i>
                <span>Room: <strong id="currentRoomId">--</strong></span>
                <button id="copyRoomBtn" title="Copy Room ID" class="ml-1 hover:text-white transition-colors">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 relative flex overflow-hidden">
        <!-- Lobby -->
        <div id="lobbyContainer" class="absolute inset-0 z-30 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
            <div class="max-w-md w-full glass p-8 rounded-2xl shadow-2xl space-y-6 border border-slate-800">
                <div class="text-center space-y-3">
                    <div class="w-16 h-16 mx-auto rounded-2xl overflow-hidden bg-slate-900 border border-slate-800">
                        <img src="zijunlogo.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <h2 class="text-2xl font-bold text-white">Start or Join Call</h2>
                    <p class="text-slate-400 text-sm">Peer-to-peer secure video room</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Your Name</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                            <input type="text" id="usernameInput" placeholder="Enter your name" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <button id="createRoomBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-plus"></i> Create New Room
                    </button>

                    <div class="relative flex py-1 items-center">
                        <div class="flex-grow border-t border-slate-800"></div>
                        <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase tracking-widest">Or Join</span>
                        <div class="flex-grow border-t border-slate-800"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Room Code</label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                            <input type="text" id="joinRoomInput" placeholder="e.g. ab12cd" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 font-mono lowercase">
                        </div>
                    </div>

                    <button id="joinRoomBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-right-to-bracket"></i> Join Room
                    </button>
                </div>
            </div>
        </div>

        <!-- Call view -->
        <div class="flex-1 flex flex-col p-4 relative overflow-hidden">
            <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 h-full min-h-0">
                <!-- Local -->
                <div class="relative bg-slate-900/90 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
                    <video id="localVideo" class="w-full h-full object-cover mirror" autoplay muted playsinline></video>
                    <div class="absolute bottom-3 left-3 bg-slate-950/70 backdrop-blur-md px-3 py-1 rounded-lg text-xs text-slate-200 border border-slate-800/60">
                        <span id="localNameTag">You</span>
                    </div>
                </div>

                <!-- Remote -->
                <div class="relative bg-slate-900/90 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
                    <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline></video>
                    <div id="remotePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 gap-3 text-slate-500">
                        <div class="w-16 h-16 rounded-full bg-slate-800/80 flex items-center justify-center border border-slate-700">
                            <i class="fa-solid fa-user-clock text-2xl"></i>
                        </div>
                        <p id="remoteStatusText" class="text-sm font-medium">Waiting for participant...</p>
                    </div>
                    <div id="remoteBadge" class="hidden absolute bottom-3 left-3 bg-slate-950/70 backdrop-blur-md px-3 py-1 rounded-lg text-xs text-slate-200 border border-slate-800/60">
                        <span id="remoteNameTag">Peer</span>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="h-20 flex items-center justify-center mt-4">
                <div class="glass px-6 py-3 rounded-2xl flex items-center gap-4 shadow-2xl border border-slate-800">
                    <button id="toggleMicBtn" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all" title="Toggle Mic">
                        <i class="fa-solid fa-microphone text-lg"></i>
                    </button>
                    <button id="toggleCamBtn" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all" title="Toggle Camera">
                        <i class="fa-solid fa-video text-lg"></i>
                    </button>
                    <div class="w-px h-6 bg-slate-800"></div>
                    <button id="hangupBtn" class="w-12 h-12 rounded-xl bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center transition-all" title="Leave Call">
                        <i class="fa-solid fa-phone-slash text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
    (function() {
        // ==================== 状态 ====================
        const state = {
            ws: null,
            myPeerId: null,
            roomCode: null,
            isHost: false,
            pc: null,
            localStream: null,
            remotePeerId: null,
            connected: false,
            username: 'User_' + Math.floor(Math.random() * 1000),
            heartbeatTimer: null,
            pendingCandidates: [],
            hasRemoteDesc: false,
        };

        // ==================== 常量 ====================
        const ROOM_PREFIX = 'room-';
        const PEER_HOST = '0.peerjs.com';
        const PEER_KEY = 'peerjs';
        const PEER_VERSION = '1.5.2';

        const ICE_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]
        };

        // ==================== DOM ====================
        const el = {
            lobbyContainer: document.getElementById('lobbyContainer'),
            usernameInput: document.getElementById('usernameInput'),
            createRoomBtn: document.getElementById('createRoomBtn'),
            joinRoomInput: document.getElementById('joinRoomInput'),
            joinRoomBtn: document.getElementById('joinRoomBtn'),
            roomBadge: document.getElementById('roomBadge'),
            currentRoomId: document.getElementById('currentRoomId'),
            copyRoomBtn: document.getElementById('copyRoomBtn'),
            localVideo: document.getElementById('localVideo'),
            remoteVideo: document.getElementById('remoteVideo'),
            remotePlaceholder: document.getElementById('remotePlaceholder'),
            remoteStatusText: document.getElementById('remoteStatusText'),
            remoteBadge: document.getElementById('remoteBadge'),
            localNameTag: document.getElementById('localNameTag'),
            remoteNameTag: document.getElementById('remoteNameTag'),
            toggleMicBtn: document.getElementById('toggleMicBtn'),
            toggleCamBtn: document.getElementById('toggleCamBtn'),
            hangupBtn: document.getElementById('hangupBtn'),
        };

        // ==================== 工具 ====================
        function log(msg) {
            console.log('[P2P]', msg);
        }

        function generateId(len = 16) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let s = '';
            for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
            return s;
        }

        function generateRoomCode() {
            return generateId(6);
        }

        // ==================== 本地媒体 ====================
        async function initLocalStream() {
            try {
                state.localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                el.localVideo.srcObject = state.localStream;
                log('Local stream ready');
            } catch (e) {
                log('getUserMedia error: ' + e.message);
                alert('无法获取摄像头/麦克风权限');
            }
        }

        // ==================== WebSocket 连接 ====================
        function connectPeerJS(id, onOpen) {
            const token = generateId(16);
            const query = `key=${PEER_KEY}&id=${id}&token=${token}&version=${PEER_VERSION}`;
            const url = `wss://${PEER_HOST}/peerjs?${query}`;
            log('Connecting to ' + url);

            const ws = new WebSocket(url);
            state.ws = ws;

            ws.onopen = () => {
                log('WebSocket connected');
                // 心跳
                state.heartbeatTimer = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'HEARTBEAT' }));
                    }
                }, 5000);

                // 3 秒兜底：如果没收到 ID 消息，用我们传的 id
                setTimeout(() => {
                    if (!state.connected) {
                        state.myPeerId = id;
                        state.connected = true;
                        log('Using provided id: ' + id);
                        if (onOpen) onOpen(id);
                    }
                }, 1500);
            };

            ws.onmessage = (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    handleSignalMessage(msg);
                } catch (e) {
                    log('Parse error: ' + e.message);
                }
            };

            ws.onerror = (e) => log('WebSocket error');
            ws.onclose = () => {
                log('WebSocket closed');
                if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
            };
        }

        // ==================== 信令消息处理 ====================
        async function handleSignalMessage(msg) {
            const type = msg.type;
            log('recv: ' + type);

            switch (type) {
                case 'OPEN':
                    break;

                case 'ID':
                    state.myPeerId = msg.id;
                    state.connected = true;
                    log('Got ID: ' + msg.id);
                    break;

                case 'OFFER':
                    await handleOffer(msg);
                    break;

                case 'ANSWER':
                    await handleAnswer(msg);
                    break;

                case 'CANDIDATE':
                    await handleCandidate(msg);
                    break;

                case 'LEAVE':
                    if (msg.src) closeConnection();
                    break;

                case 'ERROR':
                    log('Server error: ' + JSON.stringify(msg.payload));
                    break;
            }
        }

        function sendSignal(msg) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify(msg));
            }
        }

        // ==================== 创建 PeerConnection ====================
        async function createPeerConnection(peerId) {
            const pc = new RTCPeerConnection(ICE_CONFIG);
            state.pc = pc;
            state.remotePeerId = peerId;

            // 添加本地流（用 addTrack，Unified Plan）
            if (state.localStream) {
                for (const track of state.localStream.getTracks()) {
                    pc.addTrack(track, state.localStream);
                }
            }

            // 收集 ICE candidate
            pc.onicecandidate = (event) => {
                if (!event.candidate) return;
                sendSignal({
                    type: 'CANDIDATE',
                    payload: {
                        candidate: event.candidate.candidate,
                        sdpMid: event.candidate.sdpMid,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        connectionId: peerId
                    },
                    dst: peerId
                });
            };

            // 接收远端流
            pc.ontrack = (event) => {
                log('Remote track: ' + event.track.kind);
                if (event.streams && event.streams[0]) {
                    el.remoteVideo.srcObject = event.streams[0];
                    el.remotePlaceholder.classList.add('hidden');
                    el.remoteBadge.classList.remove('hidden');
                }
            };

            pc.oniceconnectionstatechange = () => {
                log('ICE state: ' + pc.iceConnectionState);
                if (pc.iceConnectionState === 'connected' ||
                    pc.iceConnectionState === 'completed') {
                    el.remoteStatusText.textContent = '已连接';
                } else if (pc.iceConnectionState === 'disconnected' ||
                           pc.iceConnectionState === 'failed' ||
                           pc.iceConnectionState === 'closed') {
                    closeConnection();
                }
            };

            return pc;
        }

        // ==================== 发起呼叫（App 作为 host 时） ====================
        async function startCall(peerId) {
            log('Starting call to ' + peerId);
            const pc = await createPeerConnection(peerId);

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            sendSignal({
                type: 'OFFER',
                payload: {
                    sdp: offer.sdp,
                    type: offer.type,
                    connectionId: peerId,
                    connectionType: 'media'
                },
                dst: peerId
            });
        }

        // ==================== 收到 Offer ====================
        async function handleOffer(msg) {
            const src = msg.src;
            const payload = msg.payload;
            if (!src || !payload || !payload.sdp) return;

            log('Offer from ' + src);

            const pc = await createPeerConnection(src);
            await pc.setRemoteDescription({ type: payload.type, sdp: payload.sdp });
            state.hasRemoteDesc = true;

            // 处理暂存的 candidates
            for (const c of state.pendingCandidates) {
                try { await pc.addIceCandidate(c); } catch (e) {}
            }
            state.pendingCandidates = [];

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            sendSignal({
                type: 'ANSWER',
                payload: {
                    sdp: answer.sdp,
                    type: answer.type,
                    connectionId: src
                },
                dst: src
            });
        }

        // ==================== 收到 Answer ====================
        async function handleAnswer(msg) {
            const payload = msg.payload;
            if (!payload || !payload.sdp || !state.pc) return;

            log('Answer from ' + msg.src);
            await state.pc.setRemoteDescription({ type: payload.type, sdp: payload.sdp });
            state.hasRemoteDesc = true;

            for (const c of state.pendingCandidates) {
                try { await state.pc.addIceCandidate(c); } catch (e) {}
            }
            state.pendingCandidates = [];
        }

        // ==================== 收到 Candidate ====================
        async function handleCandidate(msg) {
            const payload = msg.payload;
            if (!payload) return;

            const candidate = {
                candidate: payload.candidate,
                sdpMid: payload.sdpMid,
                sdpMLineIndex: payload.sdpMLineIndex
            };

            if (state.pc && state.hasRemoteDesc) {
                try { await state.pc.addIceCandidate(candidate); } catch (e) {}
            } else {
                state.pendingCandidates.push(candidate);
            }
        }

        // ==================== 房间操作 ====================
        async function handleCreateRoom() {
            state.username = el.usernameInput.value.trim() || state.username;
            el.localNameTag.textContent = state.username + ' (你)';

            const code = generateRoomCode();
            state.roomCode = code;
            state.isHost = true;

            const fullId = ROOM_PREFIX + code;

            connectPeerJS(fullId, () => {
                el.currentRoomId.textContent = code;
                el.roomBadge.classList.remove('hidden');
                el.roomBadge.classList.add('flex');
                el.lobbyContainer.classList.add('hidden');
                el.remoteStatusText.textContent = '等待对方加入...';
                log('Room created: ' + code);
            });
        }

        async function handleJoinRoom() {
            let code = el.joinRoomInput.value.trim().toLowerCase();
            if (code.startsWith(ROOM_PREFIX)) code = code.substring(ROOM_PREFIX.length);
            if (!code) {
                alert('请输入房间码');
                return;
            }

            state.username = el.usernameInput.value.trim() || state.username;
            el.localNameTag.textContent = state.username;

            state.roomCode = code;
            state.isHost = false;

            const myId = generateId(16);
            const hostId = ROOM_PREFIX + code;

            connectPeerJS(myId, async () => {
                el.currentRoomId.textContent = code;
                el.roomBadge.classList.remove('hidden');
                el.roomBadge.classList.add('flex');
                el.lobbyContainer.classList.add('hidden');
                el.remoteStatusText.textContent = '正在连接对方...';

                // 等 1 秒让 WebSocket 稳定，然后呼叫
                setTimeout(() => startCall(hostId), 500);
            });
        }

        // ==================== 挂断 ====================
        function closeConnection() {
            if (state.pc) {
                try { state.pc.close(); } catch (e) {}
                state.pc = null;
            }
            el.remoteVideo.srcObject = null;
            el.remotePlaceholder.classList.remove('hidden');
            el.remoteBadge.classList.add('hidden');
            el.remoteStatusText.textContent = '对方已离开';
        }

        function handleHangup() {
            if (state.remotePeerId) {
                sendSignal({ type: 'LEAVE', dst: state.remotePeerId });
            }
            closeConnection();

            if (state.ws) {
                try { state.ws.close(); } catch (e) {}
                state.ws = null;
            }
            if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);

            // 回大厅
            el.lobbyContainer.classList.remove('hidden');
            el.roomBadge.classList.add('hidden');
            el.roomBadge.classList.remove('flex');
            state.roomCode = null;
            state.isHost = false;
            state.remotePeerId = null;
            state.connected = false;
        }

        // ==================== 麦克风 / 摄像头 ====================
        function toggleMic() {
            if (!state.localStream) return;
            const audioTracks = state.localStream.getAudioTracks();
            if (audioTracks.length === 0) return;
            audioTracks[0].enabled = !audioTracks[0].enabled;
            el.toggleMicBtn.classList.toggle('bg-rose-600', !audioTracks[0].enabled);
            el.toggleMicBtn.classList.toggle('bg-slate-800', audioTracks[0].enabled);
        }

        async function toggleCam() {
            if (!state.localStream) return;
            const videoTracks = state.localStream.getVideoTracks();
            if (videoTracks.length === 0) return;
            const enabled = !videoTracks[0].enabled;
            videoTracks[0].enabled = enabled;
            el.toggleCamBtn.classList.toggle('bg-rose-600', !enabled);
            el.toggleCamBtn.classList.toggle('bg-slate-800', enabled);
        }

        // ==================== 事件绑定 ====================
        function setupEvents() {
            el.usernameInput.value = state.username;
            el.createRoomBtn.addEventListener('click', handleCreateRoom);
            el.joinRoomBtn.addEventListener('click', handleJoinRoom);
            el.hangupBtn.addEventListener('click', handleHangup);
            el.toggleMicBtn.addEventListener('click', toggleMic);
            el.toggleCamBtn.addEventListener('click', toggleCam);

            el.copyRoomBtn.addEventListener('click', () => {
                if (!state.roomCode) return;
                const url = `${location.origin}${location.pathname}?room=${state.roomCode}`;
                navigator.clipboard.writeText(url).then(() => alert('邀请链接已复制:\n' + url));
            });

            el.joinRoomInput.addEventListener('input', (e) => {
                let v = e.target.value.toLowerCase();
                if (v.startsWith(ROOM_PREFIX)) e.target.value = v.substring(ROOM_PREFIX.length);
            });
        }

        // ==================== 初始化 ====================
        window.addEventListener('DOMContentLoaded', async () => {
            setupEvents();

            // 从 URL 读房间码
            const params = new URLSearchParams(location.search);
            const room = params.get('room');
            if (room) {
                let code = room.toLowerCase();
                if (code.startsWith(ROOM_PREFIX)) code = code.substring(ROOM_PREFIX.length);
                el.joinRoomInput.value = code;
            }

            await initLocalStream();
        });
    })();
    </script>
</body>
</html>
