<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多人连线 · 房间对战</title>
<link rel="icon" type="image/png" href="zijunlogo.png">
<link rel="apple-touch-icon" href="zijunlogo.png">
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #1a1f35, #080b14);
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center;
    padding: 16px; color: #cdd9f0;
    overflow: hidden;
  }
  .app {
    background: rgba(18, 24, 40, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 40px;
    padding: 28px 32px;
    box-shadow: 0 30px 60px -10px rgba(0,0,0,0.8), inset 0 1px 2px rgba(120,160,255,0.15);
    border: 1px solid rgba(90, 130, 220, 0.2);
    width: fit-content;
    max-height: 98vh;
    overflow-y: auto;
  }
  body:fullscreen .app, body:-webkit-full-screen .app {
    border-radius: 0; width: 100vw; height: 100vh; padding: 20px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: rgba(10, 14, 26, 0.98);
  }

  h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 600; color: #a8c4ff; }
  .subtitle { font-size: 0.85rem; color: #6b7fa0; margin-bottom: 22px; }

  #lobby { display: flex; flex-direction: column; gap: 16px; min-width: 440px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 0.85rem; color: #8fa4cc; font-weight: 500; }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1; background: #0d1220; border: 1px solid #2a3650;
    border-radius: 14px; padding: 14px 18px; color: #e0eaff;
    font-size: 1rem; font-family: 'Consolas', monospace; letter-spacing: 1px;
    outline: none; transition: 0.2s;
  }
  input:focus { border-color: #4d7dff; box-shadow: 0 0 0 3px rgba(77,125,255,0.15); }
  input::placeholder { color: #4a5a78; letter-spacing: 0.5px; }

  button {
    border: none; cursor: pointer; font-family: inherit; font-weight: 600;
    border-radius: 14px; padding: 14px 26px; font-size: 1rem;
    transition: all 0.15s; letter-spacing: 0.3px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3d6bff, #5a4dff);
    color: white; box-shadow: 0 6px 0 #1e2a5e, 0 8px 20px rgba(61,107,255,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #1e2a5e, 0 12px 24px rgba(61,107,255,0.45); }
  .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e2a5e; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #1e2a5e; }
  .btn-secondary {
    background: #1a2235; color: #a8c4ff;
    border: 1px solid #2e3d5e; box-shadow: 0 4px 0 #0d1220;
  }
  .btn-secondary:hover { background: #222d47; transform: translateY(-2px); box-shadow: 0 6px 0 #0d1220; }
  .btn-secondary:active { transform: translateY(2px); box-shadow: 0 2px 0 #0d1220; }

  .divider { display: flex; align-items: center; gap: 12px; color: #3d4d6e; font-size: 0.8rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #253049; }

  .room-code-display {
    background: #0a0f1c; border: 1px dashed #3d6bff; border-radius: 14px;
    padding: 16px; text-align: center;
  }
  .room-code-display .code {
    font-family: 'Consolas', monospace; font-size: 2rem; font-weight: 700;
    color: #7da2ff; letter-spacing: 6px; text-shadow: 0 0 20px rgba(125,162,255,0.5);
  }
  .room-code-display .hint { font-size: 0.78rem; color: #5d7099; margin-top: 6px; }

  .status-line {
    display: flex; align-items: center; gap: 10px; font-size: 0.88rem;
    background: #0a0f1c; padding: 12px 18px; border-radius: 14px;
    border: 1px solid #1e2a44;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #ffb84d;
    box-shadow: 0 0 10px #ffb84d; flex-shrink: 0;
  }
  .dot.ok { background: #4eff8b; box-shadow: 0 0 10px #4eff8b; }
  .dot.err { background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; }

  .mode-picker { display: flex; gap: 10px; }
  .mode-card {
    flex: 1; background: #0d1220; border: 2px solid #2a3650;
    border-radius: 16px; padding: 14px; cursor: pointer;
    transition: all 0.2s; text-align: center;
  }
  .mode-card:hover { border-color: #4d7dff; background: #131a2c; }
  .mode-card.selected {
    border-color: #4d7dff;
    background: linear-gradient(135deg, #1a2a5e, #1d2450);
    box-shadow: 0 0 20px rgba(77,125,255,0.3);
  }
  .mode-card .icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
  .mode-card .name { font-weight: 700; color: #cdd9f0; font-size: 0.95rem; }
  .mode-card .desc { font-size: 0.72rem; color: #6b7fa0; margin-top: 4px; }

  #game { display: none; flex-direction: column; align-items: center; }
  .game-header {
    display: flex; justify-content: space-between; align-items: center;
    width: 900px; margin-bottom: 12px; gap: 10px;
  }
  .badge {
    display: flex; align-items: center; gap: 10px;
    background: #0d1424; padding: 10px 18px; border-radius: 30px;
    border: 1px solid #253253; font-size: 0.88rem; white-space: nowrap;
  }
  .badge .role-red { color: #ff6b8a; font-weight: 700; }
  .badge .role-blue { color: #6bb8ff; font-weight: 700; }

  .scoreboard {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #0f1524, #161d2f);
    padding: 8px 20px; border-radius: 30px;
    border: 1px solid #253253;
    font-size: 0.9rem;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
  }
  .score-item { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 20px; transition: all 0.3s; }
  .score-item.winner { background: rgba(78, 255, 139, 0.12); box-shadow: 0 0 12px rgba(78,255,139,0.2); }
  .score-swatch { width: 12px; height: 12px; border-radius: 4px; }
  .score-red { background: #ff4d6d; box-shadow: 0 0 8px #ff4d6d; }
  .score-blue { background: #4da6ff; box-shadow: 0 0 8px #4da6ff; }
  .score-num { font-family: 'Consolas', monospace; font-weight: 700; font-size: 1.15rem; color: #e0eaff; min-width: 22px; text-align: center; }
  .score-label { font-size: 0.75rem; color: #6b7fa0; }

  canvas { border-radius: 32px; background: #0a0e1a; box-shadow: 0 0 0 2px #1a2338, 0 30px 50px -20px black; display: block; }
  .game-footer {
    display: flex; justify-content: space-between; align-items: center;
    width: 900px; margin-top: 12px; font-size: 0.85rem; color: #6b7fa0; gap: 12px;
  }
  kbd {
    background: #1a2238; border-radius: 7px; padding: 3px 10px; color: #b8ceff;
    font-weight: 600; border: 1px solid #33436b; box-shadow: 0 2px 0 #0a0e16; font-family: inherit;
  }

  .footer-btn {
    background: #1a2235; color: #a8c4ff; border: 1px solid #2e3d5e;
    padding: 8px 16px; font-size: 0.82rem; border-radius: 12px;
    box-shadow: 0 3px 0 #0d1220; cursor: pointer; transition: 0.15s;
  }
  .footer-btn:hover { background: #222d47; transform: translateY(-1px); }
  .footer-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0d1220; }

  .leave-btn {
    background: #2a1a24; color: #ff8aa3; border: 1px solid #5e2e40;
    padding: 8px 20px; font-size: 0.85rem; border-radius: 12px; box-shadow: 0 3px 0 #150a10;
  }
  .leave-btn:hover { background: #3a2430; }
  .leave-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #150a10; }

  .hidden { display: none !important; }
  .error-msg { color: #ff6b8a; font-size: 0.82rem; min-height: 1.2em; }

  .sound-toggle {
    display: flex; align-items: center; gap: 8px;
    background: #0a0f1c; padding: 8px 16px; border-radius: 30px;
    border: 1px solid #1e2a44; font-size: 0.82rem; color: #8fa4cc;
    cursor: pointer; transition: 0.2s;
  }
  .sound-toggle:hover { background: #131a2c; border-color: #2e3d5e; }
  .sound-toggle .icon { font-size: 1rem; }

  /* 排行榜 */
  .leaderboard {
    background: #0a0f1c; border: 1px solid #1e2a44; border-radius: 14px;
    padding: 12px 16px; max-height: 140px; overflow-y: auto;
  }
  .leaderboard h3 {
    margin: 0 0 8px; font-size: 0.82rem; color: #7da2ff;
    font-weight: 600; letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .leaderboard .clear-btn {
    font-size: 0.7rem; color: #5d7099; cursor: pointer;
    background: none; border: none; padding: 2px 6px;
    border-radius: 6px; transition: 0.2s;
  }
  .leaderboard .clear-btn:hover { color: #ff6b8a; background: #1a0f15; }
  .lb-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; font-size: 0.82rem; color: #8fa4cc;
    border-bottom: 1px solid #141a2a;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { color: #5d7099; font-family: 'Consolas', monospace; width: 20px; }
  .lb-name { flex: 1; margin-left: 8px; color: #cdd9f0; font-weight: 500; }
  .lb-score { font-family: 'Consolas', monospace; font-weight: 700; color: #ffd24d; }
  .lb-empty { color: #3d4d6e; font-size: 0.78rem; text-align: center; padding: 6px 0; }

  /* 技能 HUD */
  .skill-bar {
    display: flex; gap: 10px;
    background: #0a0f1c; padding: 8px 12px; border-radius: 16px;
    border: 1px solid #1e2a44;
  }
  .skill-slot {
    width: 54px; height: 54px;
    background: #131a2c; border-radius: 12px;
    border: 2px solid #2a3650;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 0.6rem; color: #6b7fa0;
    position: relative; overflow: hidden;
    transition: all 0.15s;
  }
  .skill-slot .sk-icon { font-size: 1.3rem; }
  .skill-slot .sk-key {
    position: absolute; top: 2px; right: 4px;
    font-size: 0.6rem; color: #7da2ff; font-family: 'Consolas', monospace;
  }
  .skill-slot.ready { border-color: #4d7dff; box-shadow: 0 0 12px rgba(77,125,255,0.3); }
  .skill-slot.ready .sk-icon { filter: brightness(1.3); }
  .skill-slot.cooling { opacity: 0.5; }
  .skill-slot .cd-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.6);
    height: 0%;
    transition: height 0.1s linear;
  }
  .skill-slot .cd-text {
    position: absolute; bottom: 2px;
    font-size: 0.7rem; color: #b8ceff; font-weight: 700;
    font-family: 'Consolas', monospace;
  }

  /* 武器显示 */
  .weapon-badge {
    display: flex; align-items: center; gap: 6px;
    background: #0a0f1c; padding: 8px 14px; border-radius: 30px;
    border: 1px solid #1e2a44; font-size: 0.82rem; color: #b8ceff;
  }
  .weapon-badge .w-icon { font-size: 1.1rem; }
  .weapon-badge .w-ammo { color: #ffd24d; font-family: 'Consolas', monospace; font-weight: 700; }

  /* 道具计时 */
  .buff-timer {
    display: flex; gap: 6px;
    font-size: 0.75rem;
  }
  .buff-pill {
    padding: 3px 10px; border-radius: 12px;
    background: #1a2a5e; color: #a8c4ff;
    font-family: 'Consolas', monospace;
    font-weight: 700;
  }
  .buff-pill.speed { background: #0e2a3e; color: #4dd4ff; }
  .buff-pill.invisible { background: #2a0e3e; color: #d44dff; }
  .buff-pill.double { background: #3e2a0e; color: #ffd24d; }
</style>
</head>
<body>
<div class="app">
  <!-- ============ 大厅 ============ -->
  <div id="lobby">
    <div>
      <h1>⚔️ 房间对战</h1>
      <div class="subtitle">创建或加入房间，与好友实时连线</div>
    </div>

    <div class="field">
      <label>你的昵称</label>
      <input id="nickname" placeholder="玩家" maxlength="10" value="">
    </div>

    <div class="field">
      <label>选择游戏模式</label>
      <div class="mode-picker" id="modePicker">
        <div class="mode-card selected" data-mode="pvp">
          <span class="icon">⚔️</span>
          <div class="name">1v1 竞技</div>
          <div class="desc">红蓝对决</div>
        </div>
        <div class="mode-card" data-mode="zombie">
          <span class="icon">🧟</span>
          <div class="name">合作打僵尸</div>
          <div class="desc">两人组队生存</div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>创建房间</label>
      <button class="btn-primary" id="createRoomBtn">🏠 创建新房间</button>
    </div>

    <div class="divider">或</div>

    <div class="field">
      <label>加入房间</label>
      <div class="row">
        <input id="joinCode" placeholder="输入 6 位房间号" maxlength="6" autocomplete="off" style="text-transform:uppercase">
        <button class="btn-secondary" id="joinRoomBtn">加入</button>
      </div>
    </div>

    <div class="error-msg" id="lobbyError"></div>

    <div class="status-line" id="statusLine">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">正在初始化网络…</span>
    </div>

    <!-- 排行榜 -->
    <div class="leaderboard">
      <h3>
        🏆 历史战绩排行
        <button class="clear-btn" id="clearLeaderboard">清空</button>
      </h3>
      <div id="leaderboardList">
        <div class="lb-empty">暂无记录，快去战斗吧！</div>
      </div>
    </div>
  </div>

  <!-- ============ 等待对手 ============ -->
  <div id="waiting" class="hidden" style="text-align:center; min-width:440px;">
    <h1 style="margin-bottom:20px;">等待对手加入…</h1>
    <div class="room-code-display">
      <div style="font-size:0.8rem; color:#6b7fa0; margin-bottom:6px;">把房间号发给好友</div>
      <div class="code" id="displayRoomCode">------</div>
      <div class="hint" id="waitingModeHint">模式：1v1 竞技</div>
    </div>
    <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
      <button class="btn-secondary" id="copyCodeBtn">📋 复制房间号</button>
      <button class="btn-secondary" id="cancelWaitBtn">取消</button>
    </div>
  </div>

  <!-- ============ 游戏界面 ============ -->
  <div id="game">
    <div class="game-header">
      <div class="badge">
        <span class="dot ok" id="gameConnDot"></span>
        <span>房间 <b id="gameRoomCode" style="color:#7da2ff; font-family:Consolas;">------</b></span>
      </div>

      <div class="scoreboard" id="pvpScoreboard">
        <div class="score-item" id="scoreRedItem">
          <span class="score-swatch score-red"></span>
          <span class="score-label" id="redNameLabel">红</span>
          <span class="score-num" id="scoreRed">0</span>
        </div>
        <span style="color:#3d4d6e; font-weight:700;">:</span>
        <div class="score-item" id="scoreBlueItem">
          <span class="score-num" id="scoreBlue">0</span>
          <span class="score-label" id="blueNameLabel">蓝</span>
          <span class="score-swatch score-blue"></span>
        </div>
      </div>

      <div class="scoreboard hidden" id="zombieScoreboard">
        <div class="score-item">
          <span style="font-size:1.1rem;">🧟</span>
          <span class="score-label">击杀</span>
          <span class="score-num" id="zombieKills">0</span>
        </div>
        <span style="color:#3d4d6e; font-weight:700;">|</span>
        <div class="score-item">
          <span style="font-size:1.1rem;">🌊</span>
          <span class="score-label">波次</span>
          <span class="score-num" id="zombieWave">1</span>
        </div>
      </div>

      <div class="badge">
        你是 <span id="myRoleLabel" class="role-red">红方</span>
      </div>

      <div class="sound-toggle" id="soundToggle">
        <span class="icon" id="soundIcon">🔊</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="900" height="550"></canvas>

    <!-- 技能 + 武器 HUD -->
    <div style="display:flex; gap:16px; align-items:center; margin-top:12px; width:900px; justify-content:space-between;">
      <div style="display:flex; gap:16px; align-items:center;">
        <!-- 技能槽 -->
        <div class="skill-bar">
          <div class="skill-slot" id="skillDash" title="冲刺">
            <span class="sk-key">Q</span>
            <span class="sk-icon">💨</span>
            <div class="cd-overlay"></div>
            <div class="cd-text"></div>
          </div>
          <div class="skill-slot" id="skillShield" title="护盾">
            <span class="sk-key">E</span>
            <span class="sk-icon">🛡️</span>
            <div class="cd-overlay"></div>
            <div class="cd-text"></div>
          </div>
          <div class="skill-slot" id="skillUltimate" title="大招">
            <span class="sk-key">R</span>
            <span class="sk-icon">💥</span>
            <div class="cd-overlay"></div>
            <div class="cd-text"></div>
          </div>
        </div>

        <!-- 武器显示 -->
        <div class="weapon-badge">
          <span class="w-icon" id="weaponIcon">🔫</span>
          <span id="weaponName">手枪</span>
          <span class="w-ammo" id="weaponAmmo">∞</span>
        </div>

        <!-- 道具计时 -->
        <div class="buff-timer" id="buffTimer"></div>
      </div>

      <div style="display:flex; gap:8px;">
        <button class="footer-btn" id="fullscreenBtn">⛶ 全屏</button>
        <button class="leave-btn" id="leaveBtn">离开房间</button>
      </div>
    </div>

    <div class="game-footer">
      <div style="display:flex; gap:14px; align-items:center;">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
        <span><kbd>空格</kbd> 射击</span>
        <span><kbd>Q</kbd> 冲刺</span>
        <span><kbd>E</kbd> 护盾</span>
        <span><kbd>R</kbd> 大招</span>
        <span><kbd>1</kbd>~<kbd>4</kbd> 换枪</span>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
/* ============================================================
   房间对战 v5
   - 技能系统（冲刺/护盾/大招）
   - 排行榜（localStorage）
   - 武器系统（手枪/散弹/狙击/机枪）
   - 血包掉落（僵尸模式）
   - 道具（加速/隐身/双倍伤害）
   - 显示玩家昵称
   ============================================================ */

'use strict';

/* ========== DOM 引用 ========== */
const lobbyEl = document.getElementById('lobby');
const waitingEl = document.getElementById('waiting');
const gameEl = document.getElementById('game');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const lobbyError = document.getElementById('lobbyError');
const displayRoomCode = document.getElementById('displayRoomCode');
const gameRoomCode = document.getElementById('gameRoomCode');
const myRoleLabel = document.getElementById('myRoleLabel');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const soundToggleEl = document.getElementById('soundToggle');
const soundIcon = document.getElementById('soundIcon');
const scoreRedEl = document.getElementById('scoreRed');
const scoreBlueEl = document.getElementById('scoreBlue');
const scoreRedItem = document.getElementById('scoreRedItem');
const scoreBlueItem = document.getElementById('scoreBlueItem');
const redNameLabel = document.getElementById('redNameLabel');
const blueNameLabel = document.getElementById('blueNameLabel');
const pvpScoreboardEl = document.getElementById('pvpScoreboard');
const zombieScoreboardEl = document.getElementById('zombieScoreboard');
const zombieKillsEl = document.getElementById('zombieKills');
const zombieWaveEl = document.getElementById('zombieWave');
const waitingModeHintEl = document.getElementById('waitingModeHint');
const leaderboardListEl = document.getElementById('leaderboardList');
const weaponIconEl = document.getElementById('weaponIcon');
const weaponNameEl = document.getElementById('weaponName');
const weaponAmmoEl = document.getElementById('weaponAmmo');
const buffTimerEl = document.getElementById('buffTimer');

/* ========== 全局状态 ========== */
let peer = null;
let conn = null;
let isHost = false;
let roomCode = '';
let myRole = 'red';
let gameRunning = false;
let myNickname = '玩家';
let opponentNickname = '对手';
let gameMode = 'pvp';
let frameCount = 0;

// 玩家对象（带技能/武器/道具状态）
function createPlayer(role) {
  const isRed = role === 'red';
  return {
    role,
    name: isRed ? myNickname : opponentNickname,
    x: isRed ? 120 : 780,
    y: 275,
    hp: 100,
    maxHp: 100,
    cooldown: 0,
    facing: isRed ? 0 : Math.PI,
    // 技能冷却（帧）

const keysDown = new Set();

function clearKey(code) {
  keysDown.delete(code);
  if (keyTimers.has(code)) { clearTimeout(keyTimers.get(code)); keyTimers.delete(code); }
}
function clearAllKeys() {
  keysDown.clear();
  for (const t of keyTimers.values()) clearTimeout(t);
  keyTimers.clear();
}
function isKeyDown(code) { return keysDown.has(code); }
function keyDown(logical) {
  switch (logical) {
    case 'w': return isKeyDown('KeyW') || isKeyDown('ArrowUp');
    case 'a': return isKeyDown('KeyA') || isKeyDown('ArrowLeft');
    case 's': return isKeyDown('KeyS') || isKeyDown('ArrowDown');
    case 'd': return isKeyDown('KeyD') || isKeyDown('ArrowRight');
    case 'space': return isKeyDown('Space');
    case 'q': return isKeyDown('KeyQ');
    case 'e': return isKeyDown('KeyE');
    case 'r': return isKeyDown('KeyR');
    default: return false;
  }
}

// 技能/换枪 触发（边缘检测）
const justPressed = new Set();
function consumePress(code) {
  if (justPressed.has(code)) { justPressed.delete(code); return true; }
  return false;
}

window.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  if (!GAME_KEYS.includes(e.code)) return;
  e.preventDefault();
  if (e.repeat) return;
  keysDown.add(e.code);
  justPressed.add(e.code);
  if (keyTimers.has(e.code)) clearTimeout(keyTimers.get(e.code));
  keyTimers.set(e.code, setTimeout(() => clearKey(e.code), 3000));
});
window.addEventListener('keyup', (e) => {
  if (!GAME_KEYS.includes(e.code)) return;
  e.preventDefault();

});

let audioCtx = null;
let soundEnabled = true;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playTone(type, freq, freqEnd, duration, vol = 0.15, delay = 0) {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (freqEnd && freqEnd !== freq) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + duration);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration);
}
function playNoise(duration, vol = 0.1, delay = 0) {
  if (!soundEnabled || !audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const size = audioCtx.sampleRate * duration;
  const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < size; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / size);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 1200;
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(t); src.stop(t + duration);
}

/* ========== 伤害飘字 ========== */
function spawnDamageText(x, y, amount, color, text = null, big = false) {
  damageTexts.push({
    x: x + (Math.random() * 20 - 10),
    y: y - 10,
    text: text || ('-' + amount),
    color,
    life: big ? 80 : 60, maxLife: big ? 80 : 60,
    vy: big ? -2.2 : -1.6,
    vx: (Math.random() * 0.8 - 0.4),
    size: big ? 28 : 18
  });
}
function updateDamageTexts() {
  for (let i = damageTexts.length - 1; i >= 0; i--) {
    const dt = damageTexts[i];
    dt.x += dt.vx; dt.y += dt.vy;
    dt.vy *= 0.96; dt.life--;
    if (dt.life <= 0) damageTexts.splice(i, 1);
  }
}
function drawDamageTexts() {
  for (const dt of damageTexts) {
    const alpha = Math.min(1, dt.life / (dt.maxLife * 0.5));
    const scale = 0.9 + 0.3 * (1 - dt.life / dt.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.round(dt.size * scale)}px "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = dt.color;
    ctx.shadowColor = dt.color;
    ctx.shadowBlur = 12;
    ctx.fillText(dt.text, dt.x, dt.y);
    ctx.restore();
  }
}

/* ========== 障碍物 ========== */
function generateObstacles() {
  const newObstacles = [];
  const count = 5 + Math.floor(Math.random() * 4);
  let attempts = 0;
  const maxAttempts = count * 20;
  while (newObstacles.length < count && attempts < maxAttempts) {
    attempts++;
    const w = 40 + Math.random() * 80;
    const h = 40 + Math.random() * 80;
    const x = 100 + Math.random() * (W - 200 - w);
    const y = 60 + Math.random() * (H - 120 - h);
    const rect = { x, y, w, h };
    let overlaps = false;
    for (const o of newObstacles) {
      if (rect.x < o.x + o.w + 30 && rect.x + rect.w + 30 > o.x &&
          rect.y < o.y + o.h + 30 && rect.y + rect.h + 30 > o.y) { overlaps = true; break; }
    }
    if (overlaps) continue;
    const safeR = [{ x: RED_START.x - 80, y: RED_START.y - 80, w: 160, h: 160 },
                   { x: BLUE_START.x - 80, y: BLUE_START.y - 80, w: 160, h: 160 }];
    let covers = false;
    for (const s of safeR) {
      if (rect.x < s.x + s.w && rect.x + rect.w > s.x &&
          rect.y < s.y + s.h && rect.y + rect.h > s.y) { covers = true; break; }
    }
    if (covers) continue;
    newObstacles.push(rect);
  }
  return newObstacles;
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function playerHitsObstacle(px, py, obs) {
  const half = PLAYER_SIZE / 2;
  const pRect = { x: px - half, y: py - half, w: PLAYER_SIZE, h: PLAYER_SIZE };
  for (const o of obs) if (rectsOverlap(pRect, o)) return true;
  return false;
}
function bulletHitsObstacle(bullet, obs) {
  const r = BULLET_SIZE / 2;
  const bRect = { x: bullet.x - r, y: bullet.y - r, w: BULLET_SIZE, h: BULLET_SIZE };
  for (const o of obs) if (rectsOverlap(bRect, o)) return true;
  return false;
}

function initPeer(peerId) {

  try {
    const myId = 'join-' + Math.random().toString(36).substr(2, 9);
    await initPeer(myId);
    const targetConn = peer.connect(peerId, { reliable: true });
    const connectTimeout = setTimeout(() => {

      setStatus('连接超时', 'err');

      try { peer.destroy(); } catch(e) {}

      setStatus('已连接，等待开始…', 'ok');
    });
    targetConn.on('error', (err) => {
      clearTimeout(connectTimeout);
      showError('无法连接到房间');
      setStatus('连接失败', 'err');
      joinRoomBtn.disabled = false;
    });
  } catch (err) {
    showError('加入失败：' + (err.message || '未知错误'));
    setStatus('加入失败', 'err');
  }
  joinRoomBtn.disabled = false;
});

function setupConnection() {
  if (!isHost && conn) {
    conn.on('data', (data) => handleMessage(data));
    conn.on('close', () => {
      if (gameRunning) { alert('对手已断开连接'); cleanupAndReturnToLobby(); }
    });
  }
}

/* ========== 消息处理 ========== */
function handleMessage(data) {
  if (!data || !data.type) return;
  switch (data.type) {
    case 'assignRole':
      myRole = data.role;
      gameMode = data.mode || 'pvp';
      opponentNickname = data.hostName || '房主';
      myRoleLabel.textContent = myRole === 'red' ? '红方' : '蓝方';
      myRoleLabel.className = myRole === 'red' ? 'role-red' : 'role-blue';
      updateScoreboardVisibility();
      safeSend({ type: 'playerReady', nickname: myNickname });
      break;

    case 'playerReady':
      opponentNickname = data.nickname || '对手';
      if (isHost) startGame();
      break;

    case 'startGame':
      startGame();
      break;

    case 'playerUpdate':
      if (data.role === 'red' && myRole !== 'red') {
        redPlayer.x = data.x; redPlayer.y = data.y;
        if (data.hp !== undefined) redPlayer.hp = data.hp;
        if (data.facing !== undefined) redPlayer.facing = data.facing;
        if (data.shieldActive !== undefined) redPlayer.shieldActive = data.shieldActive;
        if (data.invisible !== undefined) redPlayer.invisibleTimer = data.invisible ? 30 : 0;
        if (data.name) redPlayer.name = data.name;
      } else if (data.role === 'blue' && myRole !== 'blue') {
        bluePlayer.x = data.x; bluePlayer.y = data.y;
        if (data.hp !== undefined) bluePlayer.hp = data.hp;
        if (data.facing !== undefined) bluePlayer.facing = data.facing;
        if (data.shieldActive !== undefined) bluePlayer.shieldActive = data.shieldActive;
        if (data.invisible !== undefined) bluePlayer.invisibleTimer = data.invisible ? 30 : 0;
        if (data.name) bluePlayer.name = data.name;
      }
      break;

    case 'bulletSpawn':
      if (data.bullet && data.bullet.owner !== myRole) bullets.push(data.bullet);
      break;

    case 'hit':
      if (data.targetRole === myRole && gameMode === 'pvp') {
        const me = myRole === 'red' ? redPlayer : bluePlayer;
        if (me.shieldActive > 0) {
          // 护盾抵挡
          spawnDamageText(data.hitX, data.hitY, 0, '#4dd4ff', '🛡');
          break;
        }
        me.hp = Math.max(0, me.hp - data.damage);
        SFX.hurt();
        spawnDamageText(data.hitX, data.hitY, data.damage, '#ff4d4d');
        const idx = bullets.findIndex(b => b.id === data.bulletId);
        if (idx !== -1) bullets.splice(idx, 1);
        safeSend({ type: 'hpUpdate', role: myRole, hp: me.hp });
        if (me.hp <= 0) me.dead = true;
      }
      break;

    case 'hpUpdate':
      if (data.role === 'red' && myRole !== 'red') redPlayer.hp = data.hp;
      else if (data.role === 'blue' && myRole !== 'blue') bluePlayer.hp = data.hp;
      break;

    case 'pickupSpawn':
      pickups.push(data.pickup);
      break;

    case 'pickupCollected':
      pickups = pickups.filter(p => p.id !== data.pickupId);
      break;

    case 'roundEnd':
      handleRoundEnd(data.winner, data.scoreRed, data.scoreBlue);
      break;

    case 'nextRound':
      obstacles = data.obstacles || [];
      startRoundLocally(data.role, false);
      break;

    // 僵尸
    case 'zombieState':
      if (myRole === 'blue') {
        zombies = data.zombies || [];
        zombieKills = data.kills || 0;
        zombieWave = data.wave || 1;
        updateScoreboard();
      }
      break;
    case 'zombieHit':
      if (isHost) {
        const z = zombies.find(zz => zz.id === data.zombieId);
        if (z && z.hp > 0) {
          z.hp -= data.damage;
          if (z.hp <= 0) {
            zombies = zombies.filter(zz => zz.id !== z.id);
            zombieKills++;
            updateScoreboard();
            safeSend({ type: 'zombieDied', zombieId: z.id, x: z.x, y: z.y });
            SFX.zombieDie();
            spawnDamageText(z.x, z.y, 0, '#ffaa4d', '💀');
            // 掉落血包
            if (Math.random() < 0.25) spawnPickup(z.x, z.y, 'health');
          } else {
            safeSend({ type: 'zombieDamaged', zombieId: z.id, x: z.x, y: z.y, damage: data.damage });
          }
        }
      }
      break;
    case 'zombieDamaged':
      if (myRole !== 'red') { spawnDamageText(data.x, data.y, data.damage, '#ffaa4d'); SFX.zombieHit(); }
      break;
    case 'zombieDied':
      if (myRole !== 'red') {
        zombies = zombies.filter(zz => zz.id !== data.zombieId);
        spawnDamageText(data.x, data.y, 0, '#ffaa4d', '💀');
        SFX.zombieDie();
      }
      break;
    case 'zombieAttack':
      if (myRole === data.role) { SFX.hurt(); spawnDamageText(data.x, data.y, data.damage, '#ff4d4d'); }
      break;
    case 'gameOver':
      gameRunning = false;
      SFX.lose();
      addLeaderboardEntry(myNickname + ' & ' + opponentNickname, zombieKills, 'zombie');
      setTimeout(() => {
        alert('💀 被僵尸击败！\n击杀数：' + data.kills + '  波次：' + data.wave);
        cleanupAndReturnToLobby();
      }, 200);
      break;

    case 'leave':
      if (gameRunning) { alert('对手离开了房间'); cleanupAndReturnToLobby(); }
      break;
  }
}

/* ========== 掉落物 ========== */
function spawnPickup(x, y, type) {
  const pickup = {
    id: 'p-' + (pickupIdCounter++),
    x, y, type,
    life: PICKUP_LIFETIME,
    bob: Math.random() * Math.PI * 2
  };
  pickups.push(pickup);
  safeSend({ type: 'pickupSpawn', pickup });
}
function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life--;
    p.bob += 0.1;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }

    // 拾取检测
    const me = myRole === 'red' ? redPlayer : bluePlayer;
    if (!me || me.dead) continue;
    if (Math.hypot(me.x - p.x, me.y - p.y) < PLAYER_SIZE/2 + PICKUP_SIZE/2) {
      applyPickup(me, p.type);
      pickups.splice(i, 1);
      safeSend({ type: 'pickupCollected', pickupId: p.id });
      SFX.pickup();
    }
  }
}
function applyPickup(player, type) {
  switch (type) {
    case 'health':
      player.hp = Math.min(player.maxHp, player.hp + 30);
      spawnDamageText(player.x, player.y, 0, '#4dff8b', '+30', true);
      break;
    case 'speed': player.speedTimer = BUFF_DURATION; break;
    case 'invisible': player.invisibleTimer = BUFF_DURATION; break;
    case 'double': player.doubleTimer = BUFF_DURATION; break;
  }
}

/* ========== 武器 ========== */
function switchWeapon(idx) {
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  if (!me) return;
  const key = WEAPON_ORDER[idx - 1];
  if (!key) return;
  if (me.weapon === key) return;
  me.weapon = key;
  me.ammo = WEAPONS[key].ammo;
  me.reloadTimer = 0;
  SFX.reload();
  updateWeaponHUD();
}

function reloadWeapon() {
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  const w = WEAPONS[me.weapon];
  if (w.ammo === Infinity) return;
  me.ammo = w.ammo;
  SFX.reload();
  updateWeaponHUD();
}

/* ========== 技能 ========== */
function useDash() {
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  if (me.skillCD.dash > 0 || me.dashFrames > 0) return;
  const opponent = myRole === 'red' ? bluePlayer : redPlayer;
  const dx = opponent.x - me.x, dy = opponent.y - me.y;
  const d = Math.hypot(dx, dy) || 1;
  me.dashVx = (dx / d) * DASH_SPEED;
  me.dashVy = (dy / d) * DASH_SPEED;
  me.dashFrames = DASH_DURATION;
  me.skillCD.dash = SKILL_COOLDOWN.dash;
  SFX.dash();
  spawnDamageText(me.x, me.y - 20, 0, '#4dd4ff', '💨');
  safeSend({ type: 'skillUsed', skill: 'dash' });
}

function useShield() {
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  if (me.skillCD.shield > 0) return;
  me.shieldActive = SHIELD_DURATION;
  me.skillCD.shield = SKILL_COOLDOWN.shield;
  SFX.shield();
  spawnDamageText(me.x, me.y - 20, 0, '#4dd4ff', '🛡', true);
}

function useUltimate() {
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  if (me.skillCD.ultimate > 0) return;
  me.skillCD.ultimate = SKILL_COOLDOWN.ultimate;
  SFX.ultimate();
  // 大招：向四面八方发射 16 发子弹
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    const bullet = {
      id: Date.now() + '-' + i + '-' + Math.random().toString(36).substr(2, 4),
      x: me.x, y: me.y,
      vx: Math.cos(angle) * BULLET_SPEED * 1.2,
      vy: Math.sin(angle) * BULLET_SPEED * 1.2,
      owner: myRole,
      size: BULLET_SIZE,
      life: 180,
      damage: 20,
      color: '#ff4dff'
    };
    bullets.push(bullet);
    safeSend({ type: 'bulletSpawn', bullet });
  }
  spawnDamageText(me.x, me.y - 20, 0, '#ff4dff', '💥', true);
}

/* ========== 开始游戏 ========== */
function startGame() {
  if (gameRunning) return;
  const newObstacles = generateObstacles();
  safeSend({ type: 'nextRound', obstacles: newObstacles, role: 'blue' });
  obstacles = newObstacles;
  if (gameMode === 'pvp') startRoundLocally('red', true);
  else startZombieModeLocally('red');
}

function resetPlayerState(player, role) {
  player.hp = player.maxHp;
  player.cooldown = 0;
  player.weapon = 'pistol';
  player.ammo = Infinity;
  player.reloadTimer = 0;
  player.skillCD = { dash: 0, shield: 0, ultimate: 0 };
  player.shieldActive = 0;
  player.dashFrames = 0;
  player.dashVx = 0; player.dashVy = 0;
  player.speedTimer = 0;
  player.invisibleTimer = 0;
  player.doubleTimer = 0;
  player.dead = false;
  player.kills = 0;
  player.x = role === 'red' ? RED_START.x : BLUE_START.x;
  player.y = H / 2;
  player.facing = role === 'red' ? 0 : Math.PI;
}

function startRoundLocally(role, isFirst = true) {
  myRole = role;
  gameRunning = true;

  const p1 = createPlayer('red');
  const p2 = createPlayer('blue');
  p1.name = role === 'red' ? myNickname : opponentNickname;
  p2.name = role === 'blue' ? myNickname : opponentNickname;
  // 红方总是房主，蓝方是加入者
  p1.name = isHost ? myNickname : opponentNickname;
  p2.name = isHost ? opponentNickname : myNickname;
  redPlayer = p1;
  bluePlayer = p2;

  bullets = [];
  damageTexts = [];
  pickups = [];

  gameRoomCode.textContent = roomCode;
  myRoleLabel.textContent = myRole === 'red' ? '红方' : '蓝方';
  myRoleLabel.className = myRole === 'red' ? 'role-red' : 'role-blue';
  updateScoreboardVisibility();
  switchView('game');
  setStatus('对战中', 'ok');
  updateScoreboard();
  updateWeaponHUD();
  clearAllKeys();

  SFX.start();
  broadcastPlayerState();
  if (!window._gameLoopRunning) { window._gameLoopRunning = true; gameLoop(); }
}

function startZombieModeLocally(role) {
  myRole = role;
  gameRunning = true;

  redPlayer = createPlayer('red');
  bluePlayer = createPlayer('blue');
  redPlayer.name = isHost ? myNickname : opponentNickname;
  bluePlayer.name = isHost ? opponentNickname : myNickname;

  bullets = [];
  damageTexts = [];
  zombies = [];
  pickups = [];
  zombieKills = 0;
  zombieWave = 1;
  waveTimer = 0;
  spawnTimer = 0;
  zombieIdCounter = 0;

  gameRoomCode.textContent = roomCode;
  myRoleLabel.textContent = myRole === 'red' ? '红方' : '蓝方';
  myRoleLabel.className = myRole === 'red' ? 'role-red' : 'role-blue';
  updateScoreboardVisibility();
  switchView('game');
  setStatus('僵尸模式', 'ok');
  updateScoreboard();
  updateWeaponHUD();
  clearAllKeys();

  SFX.start();
  broadcastPlayerState();
  if (!window._gameLoopRunning) { window._gameLoopRunning = true; gameLoop(); }
}

/* ========== 回合结束 ========== */
function handleRoundEnd(winner, sRed, sBlue) {
  gameRunning = false;
  scoreRed = sRed;
  scoreBlue = sBlue;
  updateScoreboard();
  if (winner === myRole) SFX.win(); else SFX.lose();
  if (isHost && gameMode === 'pvp') setTimeout(() => startNextRound(), 2000);
}

function startNextRound() {
  if (!isHost || gameMode !== 'pvp') return;
  const newObstacles = generateObstacles();
  safeSend({ type: 'nextRound', obstacles: newObstacles, role: 'blue' });
  obstacles = newObstacles;
  startRoundLocally('red', false);
}

function handleLocalWin(deadRole) {
  gameRunning = false;
  if (deadRole === 'red') scoreBlue++;
  else scoreRed++;
  updateScoreboard();
  safeSend({ type: 'roundEnd', winner: myRole, scoreRed: scoreRed, scoreBlue: scoreBlue });
  SFX.win();
  if (isHost) setTimeout(() => startNextRound(), 2000);
}

/* ========== 广播 ========== */
function broadcastPlayerState() {
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  if (!me) return;
  safeSend({
    type: 'playerUpdate',
    role: myRole,
    x: me.x, y: me.y,
    hp: me.hp,
    facing: me.facing,
    shieldActive: me.shieldActive,
    invisible: me.invisibleTimer > 0,
    name: myNickname
  });
}
function broadcastBullet(bullet) { safeSend({ type: 'bulletSpawn', bullet }); }

/* ========== 僵尸 AI ========== */
function spawnZombie() {
  if (zombies.length >= ZOMBIE_MAX_COUNT) return;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  switch (side) {
    case 0: x = -20; y = Math.random() * H; break;
    case 1: x = W + 20; y = Math.random() * H; break;
    case 2: x = Math.random() * W; y = -20; break;
    default: x = Math.random() * W; y = H + 20; break;
  }
  const speedBonus = Math.min(1.5, zombieWave * 0.1);
  const hp = ZOMBIE_HP + Math.floor(zombieWave / 3);
  zombies.push({
    id: 'z-' + (zombieIdCounter++),
    x, y, hp, maxHp: hp,
    speed: (ZOMBIE_SPEED_BASE + speedBonus) * (0.8 + Math.random() * 0.4),
    lastTouch: { red: 0, blue: 0 },
    angle: 0,
    wobble: Math.random() * Math.PI * 2
  });
}
function updateZombies() {
  if (!isHost || gameMode !== 'zombie') return;
  waveTimer++;
  if (waveTimer >= 1200) {
    waveTimer = 0; zombieWave++;
    updateScoreboard();
    spawnDamageText(W/2, H/2 - 60, 0, '#ffaa4d', '🌊 第 ' + zombieWave + ' 波', true);
  }
  spawnTimer++;
  const spawnInterval = Math.max(20, 90 - zombieWave * 6);
  if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnZombie(); }

  const players = [redPlayer, bluePlayer];
  for (const z of zombies) {
    let target = null, minD = Infinity;
    for (const p of players) {
      if (p.hp <= 0) continue;
      const d = Math.hypot(p.x - z.x, p.y - z.y);
      if (d < minD) { minD = d; target = p; }
    }
    if (!target) continue;
    const dx = target.x - z.x, dy = target.y - z.y;
    const dist = Math.hypot(dx, dy) || 1;
    z.x += (dx / dist) * z.speed;
    z.y += (dy / dist) * z.speed;
    z.angle = Math.atan2(dy, dx);
    z.wobble += 0.15;

    const zHalf = ZOMBIE_SIZE / 2;
    const zRect = { x: z.x - zHalf, y: z.y - zHalf, w: ZOMBIE_SIZE, h: ZOMBIE_SIZE };
    for (const o of obstacles) {
      if (rectsOverlap(zRect, o)) {
        const oL = (zRect.x + zRect.w) - o.x, oR = (o.x + o.w) - zRect.x;
        const oT = (zRect.y + zRect.h) - o.y, oB = (o.y + o.h) - zRect.y;
        const min = Math.min(oL, oR, oT, oB);
        if (min === oL) z.x -= oL; else if (min === oR) z.x += oR;
        else if (min === oT) z.y -= oT; else z.y += oB;
      }
    }

    for (const p of players) {
      if (p.hp <= 0) continue;
      const zr = ZOMBIE_SIZE / 2 + PLAYER_SIZE / 2;
      if (Math.hypot(p.x - z.x, p.y - z.y) < zr) {
        const key = p === redPlayer ? 'red' : 'blue';
        if (frameCount - z.lastTouch[key] > ZOMBIE_TOUCH_COOLDOWN) {
          z.lastTouch[key] = frameCount;
          if (p.shieldActive > 0) {
            // 护盾抵挡
            if (myRole === key) spawnDamageText(p.x, p.y, 0, '#4dd4ff', '🛡');
          } else {
            p.hp = Math.max(0, p.hp - ZOMBIE_DAMAGE);
            safeSend({ type: 'hpUpdate', role: key, hp: p.hp });
            safeSend({ type: 'zombieAttack', role: key, damage: ZOMBIE_DAMAGE, x: p.x, y: p.y });
            if (myRole === key) { SFX.hurt(); spawnDamageText(p.x, p.y, ZOMBIE_DAMAGE, '#ff4d4d'); }
          }
        }
      }
    }
  }
  if (redPlayer.hp <= 0 && bluePlayer.hp <= 0) {
    safeSend({ type: 'gameOver', kills: zombieKills, wave: zombieWave });
    gameRunning = false;
    SFX.lose();
    addLeaderboardEntry(myNickname + ' & ' + opponentNickname, zombieKills, 'zombie');
    setTimeout(() => {
      alert('💀 被僵尸击败！\n击杀数：' + zombieKills + '  波次：' + zombieWave);
      cleanupAndReturnToLobby();
    }, 200);
  }
}

/* ========== 更新 ========== */
function update() {
  if (!gameRunning) return;
  frameCount++;
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  const opponent = myRole === 'red' ? bluePlayer : redPlayer;
  if (!me || !opponent) return;

  // 技能冷却
  for (const k of ['dash', 'shield', 'ultimate']) {
    if (me.skillCD[k] > 0) me.skillCD[k]--;
  }
  if (me.shieldActive > 0) me.shieldActive--;
  if (me.speedTimer > 0) me.speedTimer--;
  if (me.invisibleTimer > 0) me.invisibleTimer--;
  if (me.doubleTimer > 0) me.doubleTimer--;

  // 技能按键
  if (consumePress('KeyQ')) useDash();
  if (consumePress('KeyE')) useShield();
  if (consumePress('KeyR')) useUltimate();
  if (consumePress('Digit1')) switchWeapon(1);
  if (consumePress('Digit2')) switchWeapon(2);
  if (consumePress('Digit3')) switchWeapon(3);
  if (consumePress('Digit4')) switchWeapon(4);

  // 移动
  if (me.dashFrames > 0) {
    // 冲刺中
    const tryX = me.x + me.dashVx;
    const tryY = me.y + me.dashVy;
    const cx = Math.min(Math.max(tryX, PLAYER_SIZE/2 + 4), W - PLAYER_SIZE/2 - 4);
    if (!playerHitsObstacle(cx, me.y, obstacles)) me.x = cx;
    const cy = Math.min(Math.max(tryY, PLAYER_SIZE/2 + 4), H - PLAYER_SIZE/2 - 4);
    if (!playerHitsObstacle(me.x, cy, obstacles)) me.y = cy;
    me.dashFrames--;
    broadcastPlayerState();
  } else {
    let dx = 0, dy = 0;
    if (keyDown('w')) dy -= 1;
    if (keyDown('s')) dy += 1;
    if (keyDown('a')) dx -= 1;
    if (keyDown('d')) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const speed = PLAYER_SPEED * (me.speedTimer > 0 ? BUFF_SPEED_MULT : 1);
      const len = Math.hypot(dx, dy);
      dx = dx / len * speed;
      dy = dy / len * speed;
      const tryX = me.x + dx, tryY = me.y + dy;
      const cx = Math.min(Math.max(tryX, PLAYER_SIZE/2 + 4), W - PLAYER_SIZE/2 - 4);
      if (!playerHitsObstacle(cx, me.y, obstacles)) me.x = cx;
      const cy = Math.min(Math.max(tryY, PLAYER_SIZE/2 + 4), H - PLAYER_SIZE/2 - 4);
      if (!playerHitsObstacle(me.x, cy, obstacles)) me.y = cy;
      broadcastPlayerState();
    }
  }

  // 朝向
  me.facing = Math.atan2(opponent.y - me.y, opponent.x - me.x);

  // 射击
  const w = WEAPONS[me.weapon];
  if (me.cooldown > 0) me.cooldown--;
  if (keyDown('space') && me.cooldown <= 0 && me.hp > 0) {
    if (me.ammo !== Infinity && me.ammo <= 0) {
      // 需要换弹
      if (me.reloadTimer <= 0) {
        me.reloadTimer = 60;
      }
    } else {
      // 发射
      for (let i = 0; i < w.bulletsPerShot; i++) {
        const spread = (Math.random() - 0.5) * w.spread * 2;
        const angle = me.facing + spread;
        const dmg = w.damage * (me.doubleTimer > 0 ? BUFF_DOUBLE_MULT : 1);
        const bullet = {
          id: Date.now() + '-' + i + '-' + Math.random().toString(36).substr(2, 4),
          x: me.x, y: me.y,
          vx: Math.cos(angle) * w.bulletSpeed,
          vy: Math.sin(angle) * w.bulletSpeed,
          owner: myRole,
          size: BULLET_SIZE,
          life: 150,
          damage: dmg,
          color: w.color
        };
        bullets.push(bullet);
        broadcastBullet(bullet);
      }
      if (me.ammo !== Infinity) me.ammo--;
      me.cooldown = w.cooldown;
      // 音效
      if (me.weapon === 'shotgun') SFX.shotgun();
      else if (me.weapon === 'sniper') SFX.sniper();
      else if (me.weapon === 'machine') SFX.machine();
      else SFX.shoot();
    }
  }
  // 换弹
  if (me.reloadTimer > 0) {
    me.reloadTimer--;
    if (me.reloadTimer === 0) reloadWeapon();
  }

  // 僵尸更新（房主）
  if (gameMode === 'zombie' && isHost) {
    updateZombies();
    if (frameCount % 3 === 0) {
      safeSend({
        type: 'zombieState',
        zombies: zombies.map(z => ({ id: z.id, x: z.x, y: z.y, hp: z.hp, maxHp: z.maxHp, angle: z.angle, wobble: z.wobble })),
        kills: zombieKills, wave: zombieWave
      });
    }
  }

  // 子弹
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const prevX = b.x, prevY = b.y;
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30 || b.life <= 0) {
      bullets.splice(i, 1); continue;
    }
    if (bulletHitsObstacle(b, obstacles)) {
      spawnDamageText(b.x, b.y, 0, '#8899bb', '✕');
      SFX.obstacle();
      bullets.splice(i, 1); continue;
    }
    if (b.owner === myRole) {
      if (gameMode === 'pvp') {
        const targetRole = myRole === 'red' ? 'blue' : 'red';
        const target = targetRole === 'red' ? redPlayer : bluePlayer;
        if (segmentHitsPlayer(prevX, prevY, b.x, b.y, target)) {
          if (target.shieldActive > 0) {
            spawnDamageText(b.x, b.y, 0, '#4dd4ff', '🛡');
            bullets.splice(i, 1);
            safeSend({ type: 'hit', bulletId: b.id, targetRole, damage: 0, hitX: b.x, hitY: b.y });
            continue;
          }
          safeSend({ type: 'hit', bulletId: b.id, targetRole, damage: b.damage || DAMAGE_AMOUNT, hitX: b.x, hitY: b.y });
          SFX.hit();
          const dmg = b.damage || DAMAGE_AMOUNT;
          spawnDamageText(b.x, b.y, dmg, targetRole === 'red' ? '#ff6b8a' : '#6bb8ff', null, dmg > 20);
          target.hp = Math.max(0, target.hp - dmg);
          bullets.splice(i, 1);
          if (target.hp <= 0) {
            handleLocalWin(targetRole);
          }
        }
      } else {
        let hitZombie = null;
        for (const z of zombies) {
          if (segmentHitsZombie(prevX, prevY, b.x, b.y, z)) { hitZombie = z; break; }
        }
        if (hitZombie) {
          const dmg = b.damage || 1;
          if (isHost) {
            hitZombie.hp -= dmg;
            if (hitZombie.hp <= 0) {
              zombies = zombies.filter(zz => zz.id !== hitZombie.id);
              zombieKills++;
              updateScoreboard();
              SFX.zombieDie();
              spawnDamageText(hitZombie.x, hitZombie.y, 0, '#ffaa4d', '💀');
              safeSend({ type: 'zombieDied', zombieId: hitZombie.id, x: hitZombie.x, y: hitZombie.y });
              // 掉落血包
              if (Math.random() < 0.25) spawnPickup(hitZombie.x, hitZombie.y, 'health');
              // 其他道具
              if (Math.random() < 0.08) spawnPickup(hitZombie.x, hitZombie.y, 'speed');
              if (Math.random() < 0.08) spawnPickup(hitZombie.x, hitZombie.y, 'invisible');
              if (Math.random() < 0.08) spawnPickup(hitZombie.x, hitZombie.y, 'double');
            } else {
              SFX.zombieHit();
              spawnDamageText(hitZombie.x, hitZombie.y, dmg, '#ffaa4d');
              safeSend({ type: 'zombieDamaged', zombieId: hitZombie.id, x: hitZombie.x, y: hitZombie.y, damage: dmg });
            }
          } else {
            safeSend({ type: 'zombieHit', zombieId: hitZombie.id, damage: dmg });
            SFX.zombieHit();
            spawnDamageText(hitZombie.x, hitZombie.y, dmg, '#ffaa4d');
          }
          bullets.splice(i, 1);
        }
      }
    }
  }

  updateDamageTexts();
  updatePickups();

  // 检查死亡（僵尸模式）
  if (me.hp <= 0) me.dead = true;
}

function segmentHitsPlayer(x1, y1, x2, y2, player) {
  const half = PLAYER_SIZE / 2, r = BULLET_SIZE / 2;
  const rect = { x1: player.x - half - r, x2: player.x + half + r, y1: player.y - half - r, y2: player.y + half + r };
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(2, Math.ceil(dist / 3));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
    if (px > rect.x1 && px < rect.x2 && py > rect.y1 && py < rect.y2) return true;
  }
  return false;
}
function segmentHitsZombie(x1, y1, x2, y2, z) {
  const half = ZOMBIE_SIZE / 2, r = BULLET_SIZE / 2;
  const rect = { x1: z.x - half - r, x2: z.x + half + r, y1: z.y - half - r, y2: z.y + half + r };
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(2, Math.ceil(dist / 3));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
    if (px > rect.x1 && px < rect.x2 && py > rect.y1 && py < rect.y2) return true;
  }
  return false;
}

/* ========== 绘制 ========== */
function draw() {
  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 700);
  if (gameMode === 'zombie') { grad.addColorStop(0, '#1a1420'); grad.addColorStop(1, '#0a0710'); }
  else { grad.addColorStop(0, '#0e1424'); grad.addColorStop(1, '#080b16'); }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 网格
  if (gameMode === 'zombie' && gridCanvasZombie) ctx.drawImage(gridCanvasZombie, 0, 0);
  else if (gridCanvasPvP) ctx.drawImage(gridCanvasPvP, 0, 0);

  // 障碍物
  for (const o of obstacles) {
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    ctx.fillStyle = gameMode === 'zombie' ? '#2a1e3a' : '#1e2a44';
    ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 8); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = gameMode === 'zombie' ? '#4d3670' : '#3a4d75';
    ctx.lineWidth = 2; ctx.stroke();
  }

  // 掉落物
  for (const p of pickups) {
    const bob = Math.sin(p.bob) * 3;
    const alpha = p.life < 120 ? (0.4 + 0.6 * Math.abs(Math.sin(p.life * 0.3))) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (p.type === 'health') {
      ctx.fillStyle = '#4dff8b';
      ctx.shadowColor = '#4dff8b'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(p.x, p.y + bob, PICKUP_SIZE/2, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // 十字
      ctx.fillStyle = '#0a1a10';
      ctx.fillRect(p.x - 2, p.y + bob - 7, 4, 14);
      ctx.fillRect(p.x - 7, p.y + bob - 2, 14, 4);
    } else if (p.type === 'speed') {
      ctx.fillStyle = '#4dd4ff';
      ctx.shadowColor = '#4dd4ff'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(p.x, p.y + bob, PICKUP_SIZE/2, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#0a1a24';
      ctx.fillText('💨', p.x, p.y + bob);
    } else if (p.type === 'invisible') {
      ctx.fillStyle = '#d44dff';
      ctx.shadowColor = '#d44dff'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(p.x, p.y + bob, PICKUP_SIZE/2, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a0a24';
      ctx.fillText('👻', p.x, p.y + bob);
    } else if (p.type === 'double') {
      ctx.fillStyle = '#ffd24d';
      ctx.shadowColor = '#ffd24d'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(p.x, p.y + bob, PICKUP_SIZE/2, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#241a0a';
      ctx.fillText('⚡', p.x, p.y + bob);
    }
    ctx.restore();
  }

  // 僵尸
  if (gameMode === 'zombie') for (const z of zombies) drawZombie(z);

  // 子弹
  for (const b of bullets) {
    const c = b.color || (b.owner === 'red' ? '#ff4d6d' : '#4da6ff');
    ctx.beginPath();
    ctx.arc(b.x, b.y, BULLET_SIZE * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.shadowColor = c; ctx.shadowBlur = 16; ctx.fill(); ctx.shadowBlur = 0;
  }

  // 玩家
  if (redPlayer) drawPlayer(redPlayer);
  if (bluePlayer) drawPlayer(bluePlayer);

  drawDamageTexts();

  // HUD
  ctx.font = '14px "Segoe UI"';
  ctx.fillStyle = '#6b7fa0';
  const me = myRole === 'red' ? redPlayer : bluePlayer;
  if (me) {
    ctx.fillText(`你是: ${me.name} (${myRole === 'red' ? '红' : '蓝'})`, 30, 40);
    if (gameMode === 'pvp') {
      ctx.fillText(`比分 ${redPlayer.name} ${scoreRed} : ${scoreBlue} ${bluePlayer.name}`, 30, 62);
    } else {
      ctx.fillText(`🧟 击杀 ${zombieKills}   波次 ${zombieWave}`, 30, 62);
    }
  }

  if (gameMode === 'pvp' && redPlayer && bluePlayer) {
    if (redPlayer.hp <= 0) {
      ctx.font = 'bold 42px "Segoe UI"'; ctx.fillStyle = '#ff4d6daa';
      ctx.fillText(redPlayer.name + ' DOWN', W/2-180, H/2);
    }
    if (bluePlayer.hp <= 0) {
      ctx.font = 'bold 42px "Segoe UI"'; ctx.fillStyle = '#4da6ffaa';
      ctx.fillText(bluePlayer.name + ' DOWN', W/2-180, H/2 + 50);
    }
  }
}

function drawPlayer(p) {
  if (!p) return;
  const isRed = p.role === 'red';
  const color = isRed ? '#ff4d6d' : '#4da6ff';
  const bgColor = isRed ? '#2e1a1f' : '#1a2a3a';

  // 隐身
  let alpha = 1;
  if (p.invisibleTimer > 0 && p.role !== myRole) alpha = 0.35;
  if (p.invisibleTimer > 0 && p.role === myRole) alpha = 0.6;
  if (p.hp <= 0) alpha = 0.4;

  ctx.globalAlpha = alpha;

  // 冲刺拖尾
  if (p.dashFrames > 0) {
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = alpha * (0.3 / i);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(p.x - PLAYER_SIZE/2 - p.dashVx * i * 1.5, p.y - PLAYER_SIZE/2 - p.dashVy * i * 1.5, PLAYER_SIZE, PLAYER_SIZE, 8);
      ctx.fill();
    }
    ctx.globalAlpha = alpha;
  }

  ctx.shadowColor = color;
  ctx.shadowBlur = 28;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(p.x - PLAYER_SIZE/2, p.y - PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE, 8);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 护盾
  if (p.shieldActive > 0) {
    ctx.strokeStyle = '#4dd4ff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#4dd4ff'; ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PLAYER_SIZE * 0.85, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // 血条
  ctx.fillStyle = bgColor;
  ctx.fillRect(p.x - 28, p.y - PLAYER_SIZE/2 - 20, 56, 8);
  ctx.fillStyle = color;
  ctx.fillRect(p.x - 28, p.y - PLAYER_SIZE/2 - 20, 56 * (p.hp / p.maxHp), 8);

  // 名字
  ctx.font = 'bold 12px "Segoe UI"';
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(p.name, p.x, p.y - PLAYER_SIZE/2 - 26);

  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawZombie(z) {
  const half = ZOMBIE_SIZE / 2;
  const wob = Math.sin(z.wobble) * 2;
  ctx.shadowColor = 'rgba(140, 60, 60, 0.6)'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#5a8a3a';
  ctx.beginPath();
  ctx.roundRect(z.x - half + wob, z.y - half, ZOMBIE_SIZE, ZOMBIE_SIZE, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#8ac05a'; ctx.lineWidth = 2; ctx.stroke();
  const eyeOffX = Math.cos(z.angle) * 5, eyeOffY = Math.sin(z.angle) * 5;
  ctx.fillStyle = '#ff2020';
  ctx.beginPath(); ctx.arc(z.x - 5 + wob + eyeOffX, z.y - 4 + eyeOffY, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 5 + wob + eyeOffX, z.y - 4 + eyeOffY, 2.5, 0, Math.PI*2); ctx.fill();
  if (z.hp < z.maxHp) {
    const barW = ZOMBIE_SIZE;
    ctx.fillStyle = '#2e1a1f';
    ctx.fillRect(z.x - barW/2, z.y - half - 10, barW, 4);
    ctx.fillStyle = '#8ac05a';
    ctx.fillRect(z.x - barW/2, z.y - half - 10, barW * (z.hp / z.maxHp), 4);
  }
}

function gameLoop() {
  if (gameRunning) { update(); draw(); updateSkillHUD(); updateWeaponHUD(); updateBuffTimer(); }
  else { draw(); }
  requestAnimationFrame(gameLoop);
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    return this;
  };
}

/* ========== 离开/全屏 ========== */
function cleanupAndReturnToLobby() {
  gameRunning = false;
  clearAllKeys();
  if (conn && conn.open) {
    safeSend({ type: 'leave' });
    try { conn.close(); } catch(e) {}
  }
  conn = null;
  if (peer && !peer.destroyed) { try { peer.destroy(); } catch(e) {} }
  peer = null;
  bullets = []; damageTexts = []; obstacles = []; zombies = []; pickups = [];
  redPlayer = null; bluePlayer = null;
  isHost = false;
  roomCode = '';
  switchView('lobby');
  setStatus('已返回大厅', '');
  createRoomBtn.disabled = false;
  joinRoomBtn.disabled = false;
  clearError();
}

document.getElementById('leaveBtn').addEventListener('click', cleanupAndReturnToLobby);
document.getElementById('cancelWaitBtn').addEventListener('click', cleanupAndReturnToLobby);
document.getElementById('copyCodeBtn').addEventListener('click', () => {
  const doCopy = () => {
    document.getElementById('copyCodeBtn').textContent = '✅ 已复制';
    setTimeout(() => { document.getElementById('copyCodeBtn').textContent = '📋 复制房间号'; }, 1500);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(roomCode).then(doCopy).catch(doCopy);
  } else { doCopy(); }
});
const fullscreenBtn = document.getElementById('fullscreenBtn');
fullscreenBtn.addEventListener('click', () => {
  const docEl = document.documentElement;
  if (!document.fullscreenElement) {
    if (docEl.requestFullscreen) docEl.requestFullscreen();
    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
    fullscreenBtn.textContent = '⛶ 退出全屏';
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    fullscreenBtn.textContent = '⛶ 全屏';
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '⛶ 退出全屏' : '⛶ 全屏';
});

/* ========== 启动 ========== */
initGridCanvases();
setStatus('准备就绪，创建或加入房间', '');
updateScoreboard();
updateScoreboardVisibility();
renderLeaderboard();
</script>
