<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUET Prep Station Pro</title>
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text: #1c1c1e;
      --secondary-text: #8e8e93;
      --border: rgba(60, 60, 67, 0.12);
      --danger: #ff3b30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 75px; min-height: 100vh; }

    /* Sticky Header */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky; top: 0; left: 0; right: 0;
      padding: 14px 20px; text-align: center;
      border-bottom: 1px solid var(--border);
      z-index: 100;
      font-size: 17px; font-weight: 600;
    }

    /* Page Views */
    .view { display: none; padding: 16px; animation: fadeIn 0.2s ease-in-out; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Card Component */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
    }
    .card h3 { font-size: 16px; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* Inputs & Buttons */
    .search-box, select, textarea, input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: #ffffff;
      font-size: 15px; margin-bottom: 12px; outline: none;
    }
    textarea { height: 160px; resize: vertical; line-height: 1.5; font-size: 14px; }

    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1; padding: 12px; border-radius: 10px; border: none;
      background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s; text-align: center;
    }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #e5e5ea; color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* Dict Display */
    .dict-result { margin-top: 12px; line-height: 1.6; }
    .dict-word { font-size: 24px; font-weight: bold; color: var(--primary); }
    .dict-phonetic { font-size: 14px; color: var(--secondary-text); margin-bottom: 8px; }
    .dict-meaning { font-size: 14px; background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; }

    /* Timer Display */
    .timer-display { font-size: 48px; font-weight: 700; text-align: center; margin: 15px 0; color: var(--primary); font-family: monospace; }
    .timer-status { text-align: center; font-size: 13px; color: var(--secondary-text); margin-bottom: 10px; }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 62px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 1000;
    }
    .nav-item {
      border: none; background: none; color: var(--secondary-text);
      font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex: 1;
    }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-item.active { color: var(--primary); font-weight: 600; }

    .ai-result { background: #f8f9fa; border-left: 4px solid var(--primary); padding: 12px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; margin-top: 12px; line-height: 1.6; }
  </style>
</head>
<body>

  <header id="header-title">Online Dictionary</header>

  <!-- 1. 实时网络 API 词典模块 -->
  <div id="view-vocab" class="view active">
    <div class="card">
      <h3>🌐 Real-time Online Dictionary</h3>
      <div style="display:flex; gap:8px;">
        <input type="text" id="dict-input" class="search-box" style="margin-bottom:0;" placeholder="输入英文单词 (例: plummet)...">
        <button class="btn" style="width: auto; padding: 0 20px;" onclick="searchDictionary()">查询</button>
      </div>
      <div id="dict-output" class="dict-result">
        <div style="text-align: center; color: var(--secondary-text); padding: 20px 0;">输入单词后点击“查询”，通过网络 API 实时抓取释义</div>
      </div>
    </div>
  </div>

  <!-- 2. AI 写作与实时 Grammar 批改模块 -->
  <div id="view-writing" class="view">
    <div class="card">
      <h3>⚙️ AI Settings</h3>
      <input type="password" id="api-key" class="search-box" placeholder="输入 API Key (如 OpenAI / Compatible)" onchange="saveApiKey()">
      <input type="text" id="api-url" class="search-box" placeholder="API EndPoint URL" value="https://api.openai.com/v1/chat/completions">
    </div>

    <div class="card">
      <h3>✍️ MUET Essay Assessor</h3>
      <select id="essay-type">
        <option value="Task 1: Guided Writing (Report/Letter)">Task 1: Guided Writing (Report/Email/Letter)</option>
        <option value="Task 2: Extended Writing (Essay)">Task 2: Extended Writing (Discursive/Argumentative)</option>
      </select>
      <textarea id="essay-input" placeholder="在此粘贴或输入你的 MUET 作文..."></textarea>
      <button class="btn" onclick="analyzeEssay()">🤖 开始 AI 语法校验与 Band 评估</button>
      <div id="ai-output" class="ai-result" style="display:none;"></div>
    </div>
  </div>

  <!-- 3. 口语倒计时实战模块 (完全修复) -->
  <div id="view-speaking" class="view">
    <div class="card">
      <h3>🗣️ Part 1: Individual Presentation</h3>
      <div class="timer-status" id="status-p1">准备阶段: 2 分钟 | 演讲阶段: 2 分钟</div>
      <div class="timer-display" id="timer-p1">02:00</div>
      <div class="btn-group">
        <button class="btn" onclick="startTimer('p1', 120, 'Part 1: 准备时间')">开始准备 (2 min)</button>
        <button class="btn btn-secondary" onclick="startTimer('p1', 120, 'Part 1: 演讲时间')">开始演讲 (2 min)</button>
        <button class="btn btn-danger" style="flex:0.5;" onclick="stopTimer('p1', '02:00')">重置</button>
      </div>
    </div>

    <div class="card">
      <h3>👥 Part 2: Group Discussion</h3>
      <div class="timer-status" id="status-p2">准备阶段: 3 分钟 | 讨论阶段: 8-12 分钟</div>
      <div class="timer-display" id="timer-p2">03:00</div>
      <div class="btn-group">
        <button class="btn" onclick="startTimer('p2', 180, 'Part 2: 准备时间')">开始准备 (3 min)</button>
        <button class="btn btn-secondary" onclick="startTimer('p2', 720, 'Part 2: 讨论时间')">开始讨论 (12 min)</button>
        <button class="btn btn-danger" style="flex:0.5;" onclick="stopTimer('p2', '03:00')">重置</button>
      </div>
    </div>
  </div>

  <!-- 底部固定导航栏 -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('vocab', 'Online Dictionary', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2l-10 4.5v11l10 4.5 10-4.5v-11l-10-4.5zm0 2.3l7.8 3.5-7.8 3.5-7.8-3.5 7.8-3.5zm-8 6l7 3.1v7.6l-7-3.1v-7.6zm16 7.6l-7 3.1v-7.6l7-3.1v7.6z"/></svg>
      网络词典
    </button>
    <button class="nav-item" onclick="switchTab('writing', 'AI Essay Checker', this)">
      <svg viewBox="0 0 24 24"><path d="M3 17.25v3.75h3.75l11.06-11.06-3.75-3.75l-11.06 11.06zm17.71-10.21c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      作文批改
    </button>
    <button class="nav-item" onclick="switchTab('speaking', 'Speaking Timer', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61l-1.43 4.33 4.49-1.35c1.1.48 2.33.74 3.6.74 4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-1.16 0-2.27-.29-3.26-.81l-.23-.13-2.4 0.72 0.77-2.33-.16-.25c-.65-1.02-1.01-2.21-1.01-3.46 0-3.69 3.01-6.7 6.7-6.7s6.7 3.01 6.7 6.7-3.01 6.7-6.7 6.7z"/></svg>
      口语计时
    </button>
  </nav>

  <script>
    /* ==========================================
       1. 网络词典 API 查询逻辑 (Free Dictionary API)
       ========================================== */
    async function searchDictionary() {
      const word = document.getElementById('dict-input').value.trim();
      const output = document.getElementById('dict-output');
      if (!word) {
        alert("请输入要查询的单词！");
        return;
      }

      output.innerHTML = `<div style="text-align:center; padding:20px 0;">🔍 正在检索网络词典数据...</div>`;

      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (!res.ok) throw new Error("未找到该单词的释义");
        const data = await res.json();
        const entry = data[0];

        let html = `
          <div class="dict-word">${entry.word}</div>
          <div class="dict-phonetic">${entry.phonetic || (entry.phonetics[0] ? entry.phonetics[0].text : '')}</div>
        `;

        entry.meanings.forEach(m => {
          html += `<div class="dict-meaning">
            <strong style="color:var(--primary);">${m.partOfSpeech}</strong>
            <ol style="padding-left:18px; margin-top:6px;">
              ${m.definitions.slice(0, 3).map(d => `
                <li style="margin-bottom:6px;">
                  ${d.definition}
                  ${d.example ? `<br><small style="color:var(--secondary-text);"><em>Ex: "${d.example}"</em></small>` : ''}
                </li>
              `).join('')}
            </ol>
          </div>`;
        });

        output.innerHTML = html;
      } catch (err) {
        output.innerHTML = `<div style="color:var(--danger); text-align:center; padding:20px 0;">❌ 查询失败: ${err.message}</div>`;
      }
    }

    /* ==========================================
       2. AI 写作批改逻辑
       ========================================== */
    function saveApiKey() {
      localStorage.setItem('muet_api_key', document.getElementById('api-key').value);
    }

    async function analyzeEssay() {
      const apiKey = document.getElementById('api-key').value || localStorage.getItem('muet_api_key');
      const apiUrl = document.getElementById('api-url').value;
      const essay = document.getElementById('essay-input').value;
      const type = document.getElementById('essay-type').value;
      const output = document.getElementById('ai-output');

      if (!apiKey) {
        alert("请先设置 API Key！");
        return;
      }
      if (!essay.trim()) {
        alert("请输入作文内容！");
        return;
      }

      output.style.display = 'block';
      output.innerText = "⏳ AI 正在实时评估 Grammar 与 MUET Band...";

      const prompt = `You are a MUET examiner. Assess this ${type}.
1. Estimated MUET Band (Band 1.0 - Band 5.0+).
2. Grammar & Spelling Mistakes (with corrections).
3. Vocabulary & Sentence Structure Enhancements.
4. Summary Feedback.

Essay:
"${essay}"`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: prompt }],
            temperature: 0.3
          })
        });

        const data = await response.json();
        if (data.choices && data.choices[0]) {
          output.innerText = data.choices[0].message.content;
        } else {
          output.innerText = "❌ 评估失败，请检查配置。\n" + JSON.stringify(data);
        }
      } catch (err) {
        output.innerText = "❌ 请求出错: " + err.message;
      }
    }

    /* ==========================================
       3. 口语倒计时逻辑 (多实例完全修复)
       ========================================== */
    const timers = {
      p1: { interval: null, remaining: 0 },
      p2: { interval: null, remaining: 0 }
    };

    function startTimer(key, seconds, labelText) {
      // 停止当前正在运行的计时
      if (timers[key].interval) clearInterval(timers[key].interval);

      timers[key].remaining = seconds;
      const display = document.getElementById(`timer-${key}`);
      const status = document.getElementById(`status-${key}`);
      
      status.innerText = `⏱️ 正在进行: ${labelText}`;
      status.style.color = 'var(--primary)';

      const updateDisplay = () => {
        const m = Math.floor(timers[key].remaining / 60).toString().padStart(2, '0');
        const s = (timers[key].remaining % 60).toString().padStart(2, '0');
        display.innerText = `${m}:${s}`;
      };

      updateDisplay();

      timers[key].interval = setInterval(() => {
        timers[key].remaining--;
        if (timers[key].remaining < 0) {
          clearInterval(timers[key].interval);
          timers[key].interval = null;
          display.innerText = "00:00";
          status.innerText = "⏰ 时间到!";
          status.style.color = 'var(--danger)';

          // 触发震动提示（移动端设备支持时）
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          alert(`${labelText} 倒计时已结束！`);
        } else {
          updateDisplay();
        }
      }, 1000);
    }

    function stopTimer(key, defaultTime) {
      if (timers[key].interval) {
        clearInterval(timers[key].interval);
        timers[key].interval = null;
      }
      document.getElementById(`timer-${key}`).innerText = defaultTime;
      const status = document.getElementById(`status-${key}`);
      status.innerText = "已重置";
      status.style.color = 'var(--secondary-text)';
    }

    /* ==========================================
       4. 页面切换逻辑
       ========================================== */
    function switchTab(viewId, title, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      
      document.getElementById(`view-${viewId}`).classList.add('active');
      btn.classList.add('active');
      document.getElementById('header-title').innerText = title;
    }

    window.onload = () => {
      if (localStorage.getItem('muet_api_key')) {
        document.getElementById('api-key').value = localStorage.getItem('muet_api_key');
      }
    };
  </script>
</body>
</html>
