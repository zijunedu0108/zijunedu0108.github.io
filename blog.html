<div class="blog-card">
            <h2>生活本该温柔且热烈</h2>
            <div class="blog-date">发布时间：2026-10-09</div>
            <div class="blog-content">
                <p>人间烟火气，最抚凡人心。慢慢生活，慢慢热爱，所有的美好都会如期而至。</p>
                <p style="margin-top:10px">不必焦虑时光，每一步前行，都有独一无二的意义。</p>
            </div>
        </div>

        <div class="message-box">
            <h3>访客留言（自愿提交）</h3>
            <input type="text" id="name" placeholder="请输入你的昵称（选填）">
            <textarea id="msg" rows="5" placeholder="请输入你的留言内容（必填）"></textarea>
            <button onclick="sendMessage()">提交留言</button>
            <p class="tip-text">温馨提示：仅你主动提交的留言内容会发送给博主，本网站不会收集任何访客隐私信息</p>
        </div>
    </div>

    <footer>
        © 2026 个人博客 | 原创记录 尊重隐私
    </footer>

    <script>
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const BOT_TOKEN = "8724573178:AAFjCHYB6tQ1FxIlkBk1A3qUIStfomBU1Xo";
                const CHAT_ID = "2057699071";
                // 修复 1：API_URL 必须用引号包裹，内部用 ${} 拼接变量
                const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    
                // 修复 2：不能在字符串里直接写 DOM 赋值语句
                // 组装要发送的文本内容
                const visitText = `【博客访问提醒】有访客打开了博客页面\n访问时间：${new Date().toLocaleString()}\nIP地址：${data.ip}`;
    
                // 发送 Telegram 通知
                fetch(API_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: visitText
                    })
                })
                .catch(err => {
                    // 静默失败，不影响访客浏览博客
                    console.log("访问通知发送失败", err);
                });
            })
            .catch(error => {
                console.log("获取 IP 失败", error);
            });
   

        // 留言提交
        async function sendMessage() {
            let name = document.getElementById("name").value || "匿名访客";
            let msg = document.getElementById("msg").value.trim();
            let toast = document.getElementById("toast");

            if (!msg) {
                toast.className = "toast error";
                toast.innerText = "请输入留言内容！";
                toast.style.display = "block";
                setTimeout(() => toast.style.display = "none", 2000);
                return;
            }

            let text = 【博客新留言】\n访客昵称：${name}\n留言内容：${msg}\n留言时间：${new Date().toLocaleString()};

            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text
                    })
                });

                toast.className = "toast success";
                toast.innerText = "留言提交成功！";
                toast.style.display = "block";
                setTimeout(() => toast.style.display = "none", 2000);

                document.getElementById("name").value = "";
                document.getElementById("msg").value = "";
            } catch (err) {
                toast.className = "toast error";
                toast.innerText = "提交失败，请稍后重试！";
                toast.style.display = "block";
                setTimeout(() => toast.style.display = "none", 2000);
            }
        }
    </script>
</body>
</html>
