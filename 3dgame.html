<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 跑酷游戏 - Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .hud {
            position: absolute;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 12px 24px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        #scoreDisplay {
            top: 20px;
            left: 20px;
            font-size: 22px;
            color: #00ffcc;
            border-color: rgba(0,255,204,0.3);
            box-shadow: 0 0 20px rgba(0,255,204,0.2);
        }
        
        #distanceDisplay {
            top: 20px;
            right: 20px;
            font-size: 22px;
            color: #ffaa00;
            border-color: rgba(255,170,0,0.3);
            box-shadow: 0 0 20px rgba(255,170,0,0.2);
        }
        
        #speedDisplay {
            bottom: 20px;
            right: 20px;
            font-size: 18px;
            color: #ff66aa;
        }
        
        #controlsInfo {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            white-space: nowrap;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            display: none;
            pointer-events: auto;
        }
        
        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4444;
            text-shadow: 0 0 30px rgba(255,68,68,0.5);
        }
        
        #gameOver p {
            font-size: 20px;
            margin: 10px 0;
            color: #ccc;
        }
        
        #gameOver .finalScore {
            font-size: 36px;
            color: #00ffcc;
            font-weight: bold;
            margin: 20px 0;
        }
        
        #restartBtn {
            pointer-events: auto;
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00ffcc, #0088ff);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0,255,204,0.4);
        }
        
        #restartBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0,255,204,0.7);
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 200;
            pointer-events: auto;
        }
        
        #startScreen h1 {
            font-size: 64px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ffcc, #ff66aa, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            background-size: 200% 200%;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        #startScreen p {
            font-size: 18px;
            color: #aaa;
            margin: 10px 0;
        }
        
        #startBtn {
            margin-top: 40px;
            padding: 18px 70px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00ffcc, #0088ff);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 40px rgba(0,255,204,0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0,255,204,0.5); }
            50% { box-shadow: 0 0 80px rgba(0,255,204,0.9); }
        }
        
        #startBtn:hover {
            transform: scale(1.08);
        }
        
        #loadingText {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
        
        .key-hint {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(255,255,255,0.15);
            border-radius: 5px;
            margin: 0 3px;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <!-- 开始界面 -->
    <div id="startScreen">
        <h1>🏃 3D 跑酷</h1>
        <p>在无限延伸的赛道上奔跑，收集金币，躲避障碍！</p>
        <p style="margin-top: 30px;">
            <span class="key-hint">←</span> <span class="key-hint">→</span> 或 
            <span class="key-hint">A</span> <span class="key-hint">D</span> 左右移动
        </p>
        <p>
            <span class="key-hint">空格</span> 跳跃 &nbsp;&nbsp; 
            <span class="key-hint">Shift</span> 加速
        </p>
        <button id="startBtn">开始游戏</button>
        <p id="loadingText">正在加载角色模型...</p>
    </div>

    <!-- 游戏内 HUD -->
    <div id="gameUI">
        <div id="scoreDisplay" class="hud">💰 0</div>
        <div id="distanceDisplay" class="hud">📏 0m</div>
        <div id="speedDisplay" class="hud">⚡ 速度: 1.0x</div>
        <div id="controlsInfo" class="hud">
            <span class="key-hint">←</span> <span class="key-hint">→</span> 移动 &nbsp;
            <span class="key-hint">空格</span> 跳跃 &nbsp;
            <span class="key-hint">Shift</span> 加速
        </div>
    </div>

    <!-- 游戏结束界面 -->
    <div id="gameOver">
        <h1>💥 游戏结束</h1>
        <p>你跑了</p>
        <div class="finalScore" id="finalDistance">0m</div>
        <p>收集了 <span id="finalScore" style="color:#ffaa00;font-weight:bold;">0</span> 个金币</p>
        <button id="restartBtn">重新开始</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ==================== 游戏配置 ====================
        const CONFIG = {
            laneWidth: 3,              // 每条跑道宽度
            laneCount: 3,              // 跑道数量
            baseSpeed: 0.35,           // 基础前进速度
            boostMultiplier: 1.8,      // 加速倍率
            jumpForce: 0.42,           // 跳跃力度
            gravity: 0.018,            // 重力
            playerGroundY: 0.8,        // 玩家站立时的Y坐标
            spawnDistance: 120,        // 生成物体的距离
            despawnDistance: 30,       // 回收距离
            coinValue: 10,             // 每个金币的分数
        };

        // ==================== 全局变量 ====================
        let scene, camera, renderer;
        let player, playerModel;
        let mixer, walkAction, idleAction, jumpAction;
        let clock = new THREE.Clock();
        
        // 游戏状态
        let gameState = 'loading'; // loading, menu, playing, gameover
        let score = 0;
        let distance = 0;
        let currentSpeed = CONFIG.baseSpeed;
        let isBoosting = false;
        let isJumping = false;
        let jumpVelocity = 0;
        let currentLane = 1; // 0=左, 1=中, 2=右
        let targetX = 0;
        let playerY = CONFIG.playerGroundY;
        
        // 障碍物和金币池
        let obstacles = [];
        let coins = [];
        let environmentObjects = [];
        
        // 键盘状态
        const keys = { left: false, right: false, space: false, shift: false };
        
        // 模型是否加载完成
        let modelLoaded = false;
        let usingFallbackModel = false;
        
        // 赛道段管理
        let lastSpawnZ = 0;
        const SEGMENT_LENGTH = 15;
        let segments = [];

        // ==================== 初始化场景 ====================
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 40, 100);

            // 相机
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 2, -20);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 灯光
            setupLights();
            
            // 创建玩家（先用占位模型）
            createPlayer();
            
            // 创建赛道环境
            createEnvironment();
            
            // 尝试加载外部模型
            loadPlayerModel();
        }

        // ==================== 灯光设置 ====================
        function setupLights() {
            // 环境光
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            
            // 主光源 - 从前方照射
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 20, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.left = -30;
            mainLight.shadow.camera.right = 30;
            mainLight.shadow.camera.top = 30;
            mainLight.shadow.camera.bottom = -30;
            mainLight.shadow.camera.near = 1;
            mainLight.shadow.camera.far = 60;
            mainLight.shadow.bias = -0.0005;
            scene.add(mainLight);
            
            // 跟随玩家的光源
            const playerLight = new THREE.PointLight(0x00aaff, 0.8, 20);
            playerLight.position.set(0, 5, 0);
            scene.add(playerLight);
            
            // 赛道边缘的霓虹灯效果
            const neonLight1 = new THREE.PointLight(0x00ffcc, 0.5, 40);
            neonLight1.position.set(-8, 5, -20);
            scene.add(neonLight1);
            
            const neonLight2 = new THREE.PointLight(0xff66aa, 0.5, 40);
            neonLight2.position.set(8, 5, -40);
            scene.add(neonLight2);
        }

        // ==================== 创建玩家 ====================
        function createPlayer() {
            // 创建一个容器作为玩家
            player = new THREE.Group();
            player.position.set(0, CONFIG.playerGroundY, 0);
            scene.add(player);
            
            // 先用一个简单的胶囊体作为占位
            const bodyGeo = new THREE.CapsuleGeometry(0.35, 0.8, 8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0x00aaff, 
                emissive: 0x004466,
                roughness: 0.3,
                metalness: 0.6
            });
            const placeholder = new THREE.Mesh(bodyGeo, bodyMat);
            placeholder.castShadow = true;
            placeholder.receiveShadow = true;
            placeholder.position.y = 0.9;
            placeholder.name = 'placeholder';
            player.add(placeholder);
            
            // 添加一个光环
            const ringGeo = new THREE.TorusGeometry(0.7, 0.05, 16, 32);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.3;
            ring.name = 'ring';
            player.add(ring);
        }

        // ==================== 加载外部角色模型 ====================
        function loadPlayerModel() {
            const loader = new GLTFLoader();
            
            // 使用 Three.js 官方示例中的 Soldier 模型（免费、带骨骼动画）
            // 这是一个很好的跑酷角色，有走路、跑步、待机动画
            const modelUrl = 'https://threejs.org/examples/models/gltf/Soldier.glb';
            
            loader.load(
                modelUrl,
                (gltf) => {
                    console.log('✅ 角色模型加载成功');
                    modelLoaded = true;
                    
                    // 移除占位模型
                    const placeholder = player.getObjectByName('placeholder');
                    if (placeholder) player.remove(placeholder);
                    
                    // 添加实际模型
                    playerModel = gltf.scene;
                    playerModel.scale.set(0.9, 0.9, 0.9);
                    playerModel.position.y = 0;
                    playerModel.rotation.y = Math.PI; // 让角色面向前方
                    
                    // 开启阴影
                    playerModel.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    
                    player.add(playerModel);
                    
                    // 设置动画
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(playerModel);
                        
                        // 查找动画
                        const walkClip = THREE.AnimationClip.findByName(gltf.animations, 'Walk');
                        const runClip = THREE.AnimationClip.findByName(gltf.animations, 'Run');
                        const idleClip = THREE.AnimationClip.findByName(gltf.animations, 'Idle');
                        const jumpClip = THREE.AnimationClip.findByName(gltf.animations, 'Jump');
                        
                        if (idleClip) {
                            idleAction = mixer.clipAction(idleClip);
                            idleAction.play();
                        }
                        
                        if (runClip) {
                            walkAction = mixer.clipAction(runClip);
                            walkAction.play();
                            walkAction.paused = true; // 默认暂停，移动时播放
                        } else if (walkClip) {
                            walkAction = mixer.clipAction(walkClip);
                            walkAction.play();
                            walkAction.paused = true;
                        }
                        
                        if (jumpClip) {
                            jumpAction = mixer.clipAction(jumpClip);
                        }
                        
                        console.log('✅ 动画加载完成');
                    }
                    
                    // 更新加载提示
                    document.getElementById('loadingText').textContent = '✅ 角色模型加载完成！';
                    document.getElementById('loadingText').style.color = '#00ffcc';
                },
                (progress) => {
                    // 加载进度
                    if (progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        document.getElementById('loadingText').textContent = `正在加载角色模型... ${percent}%`;
                    }
                },
                (error) => {
                    console.warn('⚠️ 角色模型加载失败，使用默认模型:', error);
                    usingFallbackModel = true;
                    document.getElementById('loadingText').textContent = '⚠️ 外部模型加载失败，使用默认角色';
                    document.getElementById('loadingText').style.color = '#ffaa00';
                    
                    // 保持使用占位模型，让它更好看一些
                    enhanceFallbackModel();
                }
            );
        }

        // 增强默认模型
        function enhanceFallbackModel() {
            const placeholder = player.getObjectByName('placeholder');
            if (placeholder) {
                // 做成一个更酷的机器人样子
                player.remove(placeholder);
                
                const group = new THREE.Group();
                
                // 身体
                const bodyGeo = new THREE.CylinderGeometry(0.35, 0.4, 0.9, 8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, emissive: 0x004466, roughness: 0.3, metalness: 0.7 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.95;
                body.castShadow = true;
                group.add(body);
                
                // 头
                const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({ color: 0x00ddff, emissive: 0x0066aa, roughness: 0.2, metalness: 0.8 });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 1.55;
                head.castShadow = true;
                group.add(head);
                
                // 眼睛
                const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff });
                const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                eyeL.position.set(-0.12, 1.6, 0.25);
                group.add(eyeL);
                const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
                eyeR.position.set(0.12, 1.6, 0.25);
                group.add(eyeR);
                
                // 手臂
                const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.7, 8);
                const armMat = new THREE.MeshStandardMaterial({ color: 0x0088cc, emissive: 0x003366 });
                const armL = new THREE.Mesh(armGeo, armMat);
                armL.position.set(-0.5, 1.0, 0);
                armL.rotation.z = 0.3;
                armL.castShadow = true;
                group.add(armL);
                const armR = new THREE.Mesh(armGeo, armMat);
                armR.position.set(0.5, 1.0, 0);
                armR.rotation.z = -0.3;
                armR.castShadow = true;
                group.add(armR);
                
                // 腿
                const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.7, 8);
                const legMat = new THREE.MeshStandardMaterial({ color: 0x0066aa, emissive: 0x002244 });
                const legL = new THREE.Mesh(legGeo, legMat);
                legL.position.set(-0.15, 0.35, 0);
                legL.castShadow = true;
                group.add(legL);
                const legR = new THREE.Mesh(legGeo, legMat);
                legR.position.set(0.15, 0.35, 0);
                legR.castShadow = true;
                group.add(legR);
                
                group.name = 'placeholder';
                player.add(group);
            }
        }

        // ==================== 创建环境 ====================
        function createEnvironment() {
            // 地面 - 跑道
            const trackWidth = CONFIG.laneWidth * CONFIG.laneCount;
            
            // 主跑道
            const trackGeo = new THREE.PlaneGeometry(trackWidth + 2, 2000);
            const trackMat = new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2e,
                roughness: 0.8,
                metalness: 0.2,
                emissive: new THREE.Color(0x0a0a15)
            });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.z = -900;
            track.receiveShadow = true;
            scene.add(track);
            
            // 跑道分隔线
            for (let i = 0; i <= CONFIG.laneCount; i++) {
                const lineX = -trackWidth/2 + i * CONFIG.laneWidth;
                const lineGeo = new THREE.BoxGeometry(0.08, 0.02, 2000);
                const lineMat = new THREE.MeshStandardMaterial({ 
                    color: 0x00ffcc, 
                    emissive: 0x00ffcc, 
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.6
                });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(lineX, 0.02, -900);
                line.receiveShadow = false;
                scene.add(line);
            }
            
            // 两侧的边界墙
            const wallHeight = 1.5;
            const wallGeo = new THREE.BoxGeometry(0.3, wallHeight, 2000);
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a2a,
                emissive: 0x001133,
                roughness: 0.5,
                metalness: 0.5
            });
            
            const wallL = new THREE.Mesh(wallGeo, wallMat);
            wallL.position.set(-trackWidth/2 - 0.5, wallHeight/2, -900);
            wallL.castShadow = true;
            wallL.receiveShadow = true;
            scene.add(wallL);
            
            const wallR = new THREE.Mesh(wallGeo, wallMat);
            wallR.position.set(trackWidth/2 + 0.5, wallHeight/2, -900);
            wallR.castShadow = true;
            wallR.receiveShadow = true;
            scene.add(wallR);
            
            // 边界墙上的霓虹灯条
            const neonGeo = new THREE.BoxGeometry(0.15, 0.1, 2000);
            const neonMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1 });
            
            const neonL = new THREE.Mesh(neonGeo, neonMat);
            neonL.position.set(-trackWidth/2 - 0.5, wallHeight - 0.2, -900);
            scene.add(neonL);
            
            const neonR = new THREE.Mesh(neonGeo, neonMat);
            neonR.position.set(trackWidth/2 + 0.5, wallHeight - 0.2, -900);
            scene.add(neonR);
            
            // 两侧的装饰柱子
            for (let i = 0; i < 60; i++) {
                const z = -i * 30;
                const side = i % 2 === 0 ? -1 : 1;
                const pillarGeo = new THREE.BoxGeometry(0.5, 4, 0.5);
                const pillarMat = new THREE.MeshStandardMaterial({ 
                    color: 0x1a1a4a, 
                    emissive: side > 0 ? 0x220044 : 0x002244,
                    roughness: 0.3,
                    metalness: 0.7
                });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(side * (trackWidth/2 + 3), 2, z);
                pillar.castShadow = true;
                scene.add(pillar);
                
                // 柱子顶部的发光球
                const orbGeo = new THREE.SphereGeometry(0.3, 8, 8);
                const orbMat = new THREE.MeshStandardMaterial({ 
                    color: side > 0 ? 0xff66aa : 0x00ffcc, 
                    emissive: side > 0 ? 0xff66aa : 0x00ffcc,
                    emissiveIntensity: 1.5
                });
                const orb = new THREE.Mesh(orbGeo, orbMat);
                orb.position.set(side * (trackWidth/2 + 3), 4.5, z);
                scene.add(orb);
            }
        }

        // ==================== 生成赛道段 ====================
        function spawnSegment() {
            const trackWidth = CONFIG.laneWidth * CONFIG.laneCount;
            const segmentZ = lastSpawnZ - SEGMENT_LENGTH;
            
            // 随机生成障碍物或金币
            const rand = Math.random();
            
            if (rand < 0.4) {
                // 生成障碍物（红色方块，需要躲避）
                const lane = Math.floor(Math.random() * CONFIG.laneCount);
                const x = -trackWidth/2 + lane * CONFIG.laneWidth + CONFIG.laneWidth/2;
                
                const obsGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                const obsMat = new THREE.MeshStandardMaterial({ 
                    color: 0xff3344, 
                    emissive: 0x660011,
                    roughness: 0.3,
                    metalness: 0.5
                });
                const obstacle = new THREE.Mesh(obsGeo, obsMat);
                obstacle.position.set(x, 0.6, segmentZ);
                obstacle.castShadow = true;
                obstacle.receiveShadow = true;
                obstacle.userData = { type: 'obstacle', z: segmentZ };
                scene.add(obstacle);
                obstacles.push(obstacle);
                
                // 障碍物周围加个警告光环
                const warnGeo = new THREE.TorusGeometry(0.9, 0.05, 8, 16);
                const warnMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.8 });
                const warn = new THREE.Mesh(warnGeo, warnMat);
                warn.rotation.x = Math.PI / 2;
                warn.position.set(x, 0.1, segmentZ);
                warn.userData = { type: 'warn', z: segmentZ };
                scene.add(warn);
                obstacles.push(warn);
            } else if (rand < 0.8) {
                // 生成金币
                const lane = Math.floor(Math.random() * CONFIG.laneCount);
                const x = -trackWidth/2 + lane * CONFIG.laneWidth + CONFIG.laneWidth/2;
                
                createCoin(x, 0.8, segmentZ);
            } else {
                // 生成一排金币
                const lane = Math.floor(Math.random() * CONFIG.laneCount);
                const x = -trackWidth/2 + lane * CONFIG.laneWidth + CONFIG.laneWidth/2;
                for (let i = 0; i < 3; i++) {
                    createCoin(x, 0.8, segmentZ - i * 3);
                }
            }
            
            lastSpawnZ = segmentZ;
        }

        // ==================== 创建金币 ====================
        function createCoin(x, y, z) {
            const coinGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.08, 16);
            const coinMat = new THREE.MeshStandardMaterial({ 
                color: 0xffaa00, 
                emissive: 0xffaa00, 
                emissiveIntensity: 0.8,
                metalness: 0.9,
                roughness: 0.1
            });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(x, y, z);
            coin.castShadow = true;
            coin.userData = { type: 'coin', z: z, originalY: y, phase: Math.random() * Math.PI * 2 };
            scene.add(coin);
            coins.push(coin);
        }

        // ==================== 玩家控制 ====================
        function setupControls() {
            window.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'ArrowLeft':
                    case 'KeyA':
                        keys.left = true;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        keys.right = true;
                        e.preventDefault();
                        break;
                    case 'Space':
                        keys.space = true;
                        if (!isJumping && gameState === 'playing') {
                            jump();
                        }
                        e.preventDefault();
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        keys.shift = true;
                        e.preventDefault();
                        break;
                }
            });
            
            window.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'ArrowLeft':
                    case 'KeyA':
                        keys.left = false;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        keys.right = false;
                        e.preventDefault();
                        break;
                    case 'Space':
                        keys.space = false;
                        e.preventDefault();
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        keys.shift = false;
                        e.preventDefault();
                        break;
                }
            });
            
            // 按钮事件
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
        }

        // ==================== 跳跃 ====================
        function jump() {
            if (isJumping) return;
            isJumping = true;
            jumpVelocity = CONFIG.jumpForce;
            
            // 播放跳跃动画
            if (jumpAction) {
                jumpAction.reset();
                jumpAction.play();
                setTimeout(() => {
                    if (jumpAction) jumpAction.stop();
                    if (walkAction && gameState === 'playing') {
                        walkAction.paused = false;
                    }
                }, 500);
            }
            
            if (walkAction) walkAction.paused = true;
            if (idleAction) idleAction.paused = true;
        }

        // ==================== 游戏逻辑 ====================
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameState = 'playing';
            
            // 重置状态
            score = 0;
            distance = 0;
            currentSpeed = CONFIG.baseSpeed;
            currentLane = 1;
            targetX = 0;
            playerY = CONFIG.playerGroundY;
            isJumping = false;
            jumpVelocity = 0;
            isBoosting = false;
            
            // 重置玩家位置
            player.position.set(0, CONFIG.playerGroundY, 0);
            
            // 清除所有物体
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];
            
            // 重置生成位置
            lastSpawnZ = -30;
            
            // 生成初始赛道
            for (let i = 0; i < 20; i++) {
                spawnSegment();
            }
            
            // 更新UI
            updateHUD();
            
            // 播放动画
            if (walkAction) {
                walkAction.paused = false;
                walkAction.setEffectiveTimeScale(1);
            }
            if (idleAction) idleAction.paused = true;
            
            document.getElementById('gameOver').style.display = 'none';
        }

        function restartGame() {
            startGame();
        }

        function gameOver() {
            gameState = 'gameover';
            
            // 播放待机动画
            if (walkAction) walkAction.paused = true;
            if (idleAction) {
                idleAction.paused = false;
                idleAction.play();
            }
            
            // 显示结束界面
            document.getElementById('finalDistance').textContent = `${Math.floor(distance)}m`;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // ==================== 更新 HUD ====================
        function updateHUD() {
            document.getElementById('scoreDisplay').textContent = `💰 ${score}`;
            document.getElementById('distanceDisplay').textContent = `📏 ${Math.floor(distance)}m`;
            const speedMult = (currentSpeed / CONFIG.baseSpeed).toFixed(1);
            document.getElementById('speedDisplay').textContent = `⚡ 速度: ${speedMult}x`;
        }

        // ==================== 游戏更新循环 ====================
        function updateGame(delta) {
            if (gameState !== 'playing') return;
            
            // 加速
            isBoosting = keys.shift;
            const targetSpeed = isBoosting ? CONFIG.baseSpeed * CONFIG.boostMultiplier : CONFIG.baseSpeed;
            currentSpeed += (targetSpeed - currentSpeed) * 0.1;
            
            // 距离
            distance += currentSpeed;
            
            // 玩家左右移动
            if (keys.left && currentLane > 0) {
                currentLane--;
                keys.left = false;
            }
            if (keys.right && currentLane < CONFIG.laneCount - 1) {
                currentLane++;
                keys.right = false;
            }
            
            // 目标X坐标
            targetX = -CONFIG.laneWidth + currentLane * CONFIG.laneWidth;
            
            // 平滑移动
            player.position.x += (targetX - player.position.x) * 0.15;
            
            // 跳跃物理
            if (isJumping) {
                jumpVelocity -= CONFIG.gravity;
                playerY += jumpVelocity;
                
                if (playerY <= CONFIG.playerGroundY) {
                    playerY = CONFIG.playerGroundY;
                    isJumping = false;
                    jumpVelocity = 0;
                    
                    // 落地恢复跑步动画
                    if (walkAction && gameState === 'playing') {
                        walkAction.paused = false;
                    }
                }
            }
            
            player.position.y = playerY;
            
            // 玩家向前移动（实际上世界向后移动，但这里我们移动玩家前方的物体）
            // 移动所有物体
            const moveZ = currentSpeed;
            
            // 移动障碍物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += moveZ;
                
                // 碰撞检测（只检测障碍物，不检测警告光环）
                if (obs.userData.type === 'obstacle') {
                    const dx = Math.abs(player.position.x - obs.position.x);
                    const dz = Math.abs(player.position.z - obs.position.z);
                    const dy = Math.abs(player.position.y - obs.position.y);
                    
                    if (dx < 1.0 && dz < 1.0 && dy < 1.2) {
                        // 撞到障碍物！
                        gameOver();
                        return;
                    }
                }
                
                // 回收
                if (obs.position.z > CONFIG.despawnDistance) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }
            
            // 移动金币
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += moveZ;
                coin.rotation.z += 0.05;
                
                // 上下浮动
                coin.position.y = coin.userData.originalY + Math.sin(performance.now() * 0.003 + coin.userData.phase) * 0.15;
                
                // 收集检测
                const dx = Math.abs(player.position.x - coin.position.x);
                const dz = Math.abs(player.position.z - coin.position.z);
                const dy = Math.abs(player.position.y - coin.position.y);
                
                if (dx < 1.0 && dz < 1.0 && dy < 1.5) {
                    // 收集金币
                    score += CONFIG.coinValue;
                    scene.remove(coin);
                    coins.splice(i, 1);
                    updateHUD();
                    continue;
                }
                
                // 回收
                if (coin.position.z > CONFIG.despawnDistance) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }
            
            // 生成新赛道段
            while (lastSpawnZ > -CONFIG.spawnDistance) {
                spawnSegment();
            }
            
            // 更新 HUD
            updateHUD();
            
            // 更新动画
            if (mixer) {
                mixer.update(delta);
            }
            
            // 更新相机位置（跟随玩家）
            const camTargetX = player.position.x * 0.3;
            camera.position.x += (camTargetX - camera.position.x) * 0.05;
            camera.position.y = 5 + player.position.y * 0.3;
            camera.lookAt(player.position.x * 0.5, 2, -15);
            
            // 光环动画
            const ring = player.getObjectByName('ring');
            if (ring) {
                ring.rotation.z += 0.02;
                ring.position.y = 0.3 + Math.sin(performance.now() * 0.005) * 0.1;
            }
        }

        // ==================== 动画循环 ====================
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            
            updateGame(delta);
            
            renderer.render(scene, camera);
        }

        // ==================== 窗口自适应 ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== 启动游戏 ====================
        initScene();
        setupControls();
        animate();

        // 如果5秒后模型还没加载完成，也允许开始游戏
        setTimeout(() => {
            if (!modelLoaded && !usingFallbackModel) {
                document.getElementById('loadingText').textContent = '模型加载较慢，可以先开始游戏';
                document.getElementById('loadingText').style.color = '#ffaa00';
            }
        }, 5000);

        console.log('🎮 3D跑酷游戏已启动！');
        console.log('💡 提示：可以替换 loadPlayerModel() 中的模型URL来导入你自己的角色模型');
    </script>
</body>
</html>
