<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>情侣储蓄 · 个人资料</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #f5e8ee;
            background-image: radial-gradient(circle at 20% 30%, #fce8ef 0%, #f5dce6 100%);
            padding: 12px 12px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 248, 250, 0.88);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 24px 20px 30px;
            box-shadow: 0 8px 40px rgba(200, 80, 120, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        /* ===== 头像 ===== */
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 4px solid #f0b0c8;
            box-shadow: 0 4px 20px rgba(200, 80, 120, 0.15);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff5f9;
        }

        .profile-avatar-large img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
        }

        /* ===== 名字 & 角色 ===== */
        .profile-display-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: #7a3a54;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .profile-display-role {
            font-size: 0.95rem;
            font-weight: 500;
            color: #b35d7e;
            background: #fceef4;
            padding: 2px 24px;
            border-radius: 10px;
            display: inline-block;
            border: 1.5px solid #f0b0c8;
            margin-top: 4px;
            margin-bottom: 20px;
        }

        /* ===== 分割线 ===== */
        .divider {
            width: 60px;
            height: 2px;
            background: #f0c8d8;
            margin: 0 auto 20px;
            border-radius: 4px;
        }

        /* ===== 统计卡片 ===== */
        .stats-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-card {
            flex: 1;
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 8px;
            border: 1px solid #f5d0dd;
            box-shadow: 0 2px 8px rgba(200, 80, 120, 0.04);
        }

        .stat-card .stat-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #7a3a54;
        }

        .stat-card .stat-label {
            font-size: 0.6rem;
            font-weight: 500;
            color: #b88b9c;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        /* ===== 按钮组 ===== */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }

        .action-btn {
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 0.95rem;
            background: #ffffff;
            border: 1.5px solid #f0b0c8;
            box-shadow: 0 2px 8px rgba(200, 80, 120, 0.06);
            transition: 0.08s linear;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #4e283b;
            touch-action: manipulation;
            width: 100%;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn .btn-icon {
            font-size: 1.2rem;
        }

        .action-btn.refresh-btn {
            background: #fcf2f6;
            border-color: #f0c8d8;
        }

        .action-btn.refresh-btn:active {
            background: #f5e0e8;
        }

        .action-btn.logout-btn {
            background: #fce8ef;
            border-color: #f0a0b8;
        }

        .action-btn.logout-btn:active {
            background: #f5d0dd;
        }

        .action-btn.danger-btn {
            color: #b35d7e;
        }

        /* ===== Toast ===== */
        .toast-message {
            background: #7a3a54;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 16px;
            display: none;
            border: 1px solid #f0b0c8;
        }

        .toast-message.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 248, 250, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(200, 80, 120, 0.12);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            max-width: 420px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            border-radius: 20px 20px 0 0;
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 20px;
            border-radius: 12px;
            transition: all 0.15s ease;
            touch-action: manipulation;
            min-width: 50px;
            border: none;
            background: transparent;
            cursor: pointer;
            position: relative;
        }

        .nav-item .nav-icon {
            font-size: 1.3rem;
            font-weight: 400;
            color: #b88b9c;
            transition: color 0.15s ease;
            line-height: 1.4;
        }

        .nav-item .nav-label {
            font-size: 0.55rem;
            font-weight: 600;
            color: #b88b9c;
            letter-spacing: 0.3px;
            transition: color 0.15s ease;
        }

        .nav-item.active .nav-icon {
            color: #c96d8b;
        }

        .nav-item.active .nav-label {
            color: #c96d8b;
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: #c96d8b;
            border-radius: 0 0 4px 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ===== 头像 ===== -->
    <div class="profile-avatar-large">
        <img id="profileAvatarImg" src="/gento.png" alt="头像" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23f7b8d0%22/%3E%3Ctext x=%2230%22 y=%2265%22 font-size=%2240%22 fill=%22%23333%22 font-family=%22Arial%22%3E🐻%3C/text%3E%3C/svg%3E'">
    </div>

    <!-- ===== 名字 & 角色 ===== -->
    <div class="profile-display-name" id="profileDisplayName">GENTO</div>
    <div class="profile-display-role" id="profileDisplayRole">男朋友</div>

    <div class="divider"></div>

    <!-- ===== 统计卡片 ===== -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="statRecords">0</div>
            <div class="stat-label">总记录</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statIncome">RM 0</div>
            <div class="stat-label">总进账</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statExpense">RM 0</div>
            <div class="stat-label">总开销</div>
        </div>
    </div>

    <!-- ===== 操作按钮 ===== -->
    <div class="action-group">
        <button class="action-btn refresh-btn" id="refreshBtn">
            <span class="btn-icon">⟳</span> 刷新资料
        </button>
        <button class="action-btn logout-btn danger-btn" id="logoutBtn">
            <span class="btn-icon">✕</span> 退出登录
        </button>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast-message" id="toastMsg">✨ 已刷新</div>
</div>

<!-- ===== 底部导航 ===== -->
<div class="bottom-nav">
    <a href="cmain.html" class="nav-item" id="navHome">
        <span class="nav-icon">⌂</span>
        <span class="nav-label">主页</span>
    </a>
    <a href="crecord.html" class="nav-item" id="navRecord">
        <span class="nav-icon">☰</span>
        <span class="nav-label">记录</span>
    </a>
    <a href="cprofile.html" class="nav-item active" id="navProfile">
        <span class="nav-icon">◌</span>
        <span class="nav-label">我的</span>
    </a>
</div>

<!-- ===== Firebase Import Map ===== -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js"
    }
}
</script>

<!-- ===== Main Script ===== -->
<script type="module">
    import { initializeApp } from 'firebase/app';
    import { getFirestore, collection, query, onSnapshot } from 'firebase/firestore';

    const firebaseConfig = {
        apiKey: "AIzaSyD_aW8osSZupLNTmaFXrPjAOcroX_2D7YQ",
        authDomain: "dailylife-5ad94.firebaseapp.com",
        projectId: "dailylife-5ad94",
        storageBucket: "dailylife-5ad94.firebasestorage.app",
        messagingSenderId: "783888781810",
        appId: "1:783888781810:web:d9dc08ab862b9935f29b6b",
        measurementId: "G-3T4P3CY0JH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ROLE_KEY = 'couple_role';
    const NAME_KEY = 'couple_name';
    const ICON_KEY = 'couple_icon';

    // ===== 获取用户信息 =====
    function getUserInfo() {
        const role = localStorage.getItem(ROLE_KEY) || 'boy';
        const name = localStorage.getItem(NAME_KEY) || (role === 'boy' ? 'GENTO' : 'MANTO');
        const icon = localStorage.getItem(ICON_KEY) || (role === 'boy' ? '/gento.png' : '/manto.png');
        const roleChinese = role === 'boy' ? '男朋友' : '女朋友';
        return { role, name, icon, roleChinese };
    }

    function updateProfileUI() {
        const info = getUserInfo();
        document.getElementById('profileAvatarImg').src = info.icon;
        document.getElementById('profileDisplayName').textContent = info.name;
        document.getElementById('profileDisplayRole').textContent = info.roleChinese;
    }

    updateProfileUI();

    // ===== 更新统计数据 =====
    function updateStats(records) {
        let total = 0;
        let income = 0;
        let expense = 0;

        records.forEach(r => {
            const amt = parseFloat(r.amount) || 0;
            total++;
            if (r.type === '进账') income += amt;
            else if (r.type === '开销') expense += amt;
        });

        document.getElementById('statRecords').textContent = total;
        document.getElementById('statIncome').textContent = 'RM ' + income.toFixed(2);
        document.getElementById('statExpense').textContent = 'RM ' + expense.toFixed(2);
    }

    // ===== 监听 Firestore =====
    const recordsRef = collection(db, 'records');
    const q = query(recordsRef);

    onSnapshot(q, (snapshot) => {
        const records = [];
        snapshot.forEach((doc) => {
            records.push({ id: doc.id, ...doc.data() });
        });
        updateStats(records);
    }, (error) => {
        console.error('监听失败:', error);
    });

    // ===== Toast =====
    const toast = document.getElementById('toastMsg');
    let toastTimer = null;

    function showToast(message) {
        toast.textContent = message || '✨ 操作完成';
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // ===== 刷新按钮 =====
    document.getElementById('refreshBtn').addEventListener('click', function() {
        updateProfileUI();
        showToast('🔄 已刷新资料');
        window.dispatchEvent(new StorageEvent('storage', {
            key: ROLE_KEY,
            newValue: localStorage.getItem(ROLE_KEY),
            storageArea: localStorage
        }));
    });

    // ===== 退出登录 =====
    document.getElementById('logoutBtn').addEventListener('click', function() {
        const keysToRemove = [ROLE_KEY, NAME_KEY, ICON_KEY];
        keysToRemove.forEach(key => {
            localStorage.removeItem(key);
        });

        showToast('👋 已退出，即将跳转...');
        setTimeout(() => {
            window.location.href = 'cindex.html';
        }, 800);
    });

    // ===== 导航高亮 =====
    document.getElementById('navProfile').classList.add('active');
    document.getElementById('navHome').classList.remove('active');
    document.getElementById('navRecord').classList.remove('active');

    // ===== 监听存储变化 =====
    window.addEventListener('storage', function(e) {
        if (e.key === ROLE_KEY || e.key === NAME_KEY || e.key === ICON_KEY) {
            updateProfileUI();
        }
    });

    window.addEventListener('focus', function() {
        updateProfileUI();
    });

    console.log('🔥 cprofile 已连接 Firestore');
</script>

</body>
</html>
