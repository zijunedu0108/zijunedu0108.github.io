<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>文档扫描 · 自动锐化裁剪PDF</title>
  <!-- 使用 jsPDF 和 PDF 相关库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- 用于图像处理 (锐化/裁剪) 使用 canvas 原生 API, 无需额外库 -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #1a1a1a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    .app {
      width: 100%;
      max-width: 400px;
      background: #2c2c2c;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* 相机预览区域 */
    .camera-container {
      position: relative;
      background: #000;
      aspect-ratio: 3 / 4;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.1s;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      font-size: 0.9rem;
      background: rgba(0,0,0,0.2);
    }
    .focus-indicator {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.3);
    }
    .focus-indicator.active {
      opacity: 1;
    }
    /* 控制栏 */
    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #3a3a3a;
    }
    .btn {
      background: #3a3a3a;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      min-width: 70px;
    }
    .btn:active {
      background: #555;
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .btn-primary {
      background: #0a84ff;
      color: white;
      font-weight: 600;
    }
    .btn-primary:active {
      background: #0070e0;
    }
    .btn-danger {
      background: #ff453a;
    }
    .btn-danger:active {
      background: #d9362e;
    }
    .btn-icon {
      font-size: 18px;
      line-height: 1;
    }
    /* 缩略图列表 */
    .thumbnail-strip {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      background: #252525;
      border-bottom: 1px solid #3a3a3a;
      min-height: 80px;
      align-items: center;
      scrollbar-width: thin;
      scrollbar-color: #555 #252525;
    }
    .thumbnail-strip::-webkit-scrollbar {
      height: 4px;
    }
    .thumbnail-strip::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }
    .thumbnail-item {
      position: relative;
      flex: 0 0 auto;
      width: 60px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      border: 1px solid #444;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .thumbnail-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumbnail-item .page-num {
      position: absolute;
      bottom: 2px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 20px;
      font-weight: 600;
    }
    .empty-thumbnail {
      color: #888;
      font-size: 14px;
      margin: 0 auto;
      font-style: italic;
      width: 100%;
      text-align: center;
    }
    /* 底部区域 */
    .bottom-panel {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .filename-input {
      background: #2c2c2c;
      border: 1px solid #3f3f3f;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      color: white;
      outline: none;
      transition: border 0.2s;
    }
    .filename-input:focus {
      border-color: #0a84ff;
    }
    .filename-input::placeholder {
      color: #7a7a7a;
    }
    .export-btn {
      width: 100%;
      padding: 18px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 700;
      background: #0a84ff;
      color: white;
      border: none;
      box-shadow: 0 8px 20px rgba(10, 132, 255, 0.3);
      transition: background 0.15s, transform 0.1s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .export-btn:active {
      background: #0066cc;
      transform: scale(0.98);
    }
    .export-btn:disabled {
      opacity: 0.5;
      background: #3a3a3a;
      box-shadow: none;
      pointer-events: none;
    }
    .status-msg {
      font-size: 13px;
      color: #ffaa33;
      text-align: center;
      min-height: 20px;
      padding: 4px 0;
    }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0a84ff;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- 相机预览区 -->
  <div class="camera-container" id="cameraContainer">
    <video id="video" playsinline autoplay muted></video>
    <div class="overlay" id="overlay">
      <div class="focus-indicator" id="focusIndicator"></div>
      <div id="hintText" style="position: absolute; bottom: 20px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 20px;">点击画面对焦</div>
    </div>
  </div>

  <!-- 拍摄控制栏 -->
  <div class="control-bar">
    <button class="btn" id="switchCameraBtn" title="切换摄像头">
      <span class="btn-icon">🔄</span> 切换
    </button>
    <button class="btn btn-primary" id="captureBtn" style="padding: 12px 28px; font-size: 16px;">
      <span class="btn-icon">📸</span> 拍照
    </button>
    <button class="btn" id="clearAllBtn" style="background: #3a3a3a;">
      <span class="btn-icon">🗑️</span> 清空
    </button>
  </div>

  <!-- 缩略图预览条 -->
  <div class="thumbnail-strip" id="thumbnailStrip">
    <div class="empty-thumbnail">还没有扫描任何文档</div>
  </div>

  <!-- 底部面板 -->
  <div class="bottom-panel">
    <input type="text" class="filename-input" id="filenameInput" placeholder="输入文档名称" value="扫描文档">
    <button class="export-btn" id="exportPdfBtn" disabled>
      <span>📄</span> 下载导出 PDF
    </button>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">提示</div>

<script>
  (function() {
    // -------------------- 全局变量 --------------------
    let stream = null;
    let video = document.getElementById('video');
    let currentFacingMode = 'environment'; // 默认后置
    let capturedImages = []; // 存储 { dataUrl, width, height }

    // DOM 元素
    const cameraContainer = document.getElementById('cameraContainer');
    const focusIndicator = document.getElementById('focusIndicator');
    const hintText = document.getElementById('hintText');
    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const thumbnailStrip = document.getElementById('thumbnailStrip');
    const filenameInput = document.getElementById('filenameInput');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const statusMsg = document.getElementById('statusMsg');
    const toastEl = document.getElementById('toast');

    // 用于拍照的 canvas
    const captureCanvas = document.createElement('canvas');
    const captureCtx = captureCanvas.getContext('2d');

    // 图像处理参数
    const TARGET_WIDTH = 1000;        // 裁剪后图片宽度基准 (保持清晰且不过大)
    const JPEG_QUALITY = 0.92;        // 导出质量

    // -------------------- 工具函数 --------------------
    function showToast(message, duration = 2000) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    function setStatus(msg, isError = false) {
      statusMsg.textContent = msg;
      statusMsg.style.color = isError ? '#ff453a' : '#ffaa33';
    }

    function updateExportButtonState() {
      exportPdfBtn.disabled = capturedImages.length === 0;
    }

    // -------------------- 初始化相机 --------------------
    async function startCamera(facingMode) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      try {
        const constraints = {
          video: {
            facingMode: facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        // 更新提示
        hintText.textContent = '点击画面对焦';
      } catch (err) {
        console.error('相机启动失败:', err);
        showToast('无法访问相机，请检查权限');
        setStatus('相机启动失败', true);
      }
    }

    // 切换摄像头
    async function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      await startCamera(currentFacingMode);
    }

    // -------------------- 对焦逻辑 (点击画面) --------------------
    function handleFocusTap(e) {
      e.preventDefault();
      const rect = cameraContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 显示对焦指示器
      focusIndicator.style.left = (x - 40) + 'px';
      focusIndicator.style.top = (y - 40) + 'px';
      focusIndicator.classList.add('active');

      // 尝试对焦 (部分设备支持)
      if (stream) {
        const track = stream.getVideoTracks()[0];
        if (track && track.getCapabilities && track.getCapabilities().focusMode) {
          const capabilities = track.getCapabilities();
          if (capabilities.focusMode && capabilities.focusMode.includes('manual')) {
            // 计算对焦区域（从点击位置映射到0-1）
            const focusX = x / rect.width;
            const focusY = y / rect.height;
            // 这里简单触发一次自动对焦，更复杂的点对焦需要 advanced constraints
            // 为了兼容性，我们只触发自动对焦
          }
        }
        // 大多数移动端浏览器在点击时自动对焦，我们只需要触发一下
        // 通过应用高级约束来请求对焦
        try {
          const constraints = { advanced: [{ focusMode: 'continuous' }] };
          track.applyConstraints(constraints).catch(() => {});
        } catch (err) {}
      }

      // 2秒后隐藏对焦框
      clearTimeout(window._focusTimer);
      window._focusTimer = setTimeout(() => {
        focusIndicator.classList.remove('active');
      }, 1500);
    }

    // -------------------- 图像处理：自动裁剪成文档比例 + 锐化 --------------------
    async function processCapturedImage(sourceCanvas) {
      // 1. 获取源图像数据
      const srcWidth = sourceCanvas.width;
      const srcHeight = sourceCanvas.height;
      const srcCtx = sourceCanvas.getContext('2d');
      const srcImageData = srcCtx.getImageData(0, 0, srcWidth, srcHeight);
      const srcData = srcImageData.data;

      // 2. 自动裁剪：检测文档边界（简化版：使用边缘检测和投影，保持核心区域）
      //   对于演示，采用智能裁剪：去除黑边，假设文档占据中心区域，并保持宽高比接近A4 (1:1.414)
      //   实际项目中可接入 opencv 或更复杂算法，这里实现一个相对稳健的裁剪：基于亮度投影去掉黑色边缘。

      // 转灰度并计算每行/列的亮度平均值（用于检测边缘）
      const gray = new Float32Array(srcWidth * srcHeight);
      for (let i = 0; i < srcData.length; i += 4) {
        const r = srcData[i];
        const g = srcData[i + 1];
        const b = srcData[i + 2];
        const idx = i / 4;
        gray[idx] = 0.299 * r + 0.587 * g + 0.114 * b;
      }

      // 计算行和列的亮度均值
      const rowBrightness = new Float32Array(srcHeight);
      const colBrightness = new Float32Array(srcWidth);
      for (let y = 0; y < srcHeight; y++) {
        let sum = 0;
        for (let x = 0; x < srcWidth; x++) {
          sum += gray[y * srcWidth + x];
        }
        rowBrightness[y] = sum / srcWidth;
      }
      for (let x = 0; x < srcWidth; x++) {
        let sum = 0;
        for (let y = 0; y < srcHeight; y++) {
          sum += gray[y * srcWidth + x];
        }
        colBrightness[x] = sum / srcHeight;
      }

      // 使用阈值寻找文档区域 (亮度高于整体平均亮度一定比例)
      const avgBrightness = rowBrightness.reduce((a, b) => a + b, 0) / srcHeight;
      const threshold = Math.max(30, avgBrightness * 0.65); // 自适应阈值

      let top = 0, bottom = srcHeight - 1, left = 0, right = srcWidth - 1;

      // 从上往下找第一个亮度超过阈值的行
      while (top < srcHeight && rowBrightness[top] < threshold) top++;
      while (bottom > top && rowBrightness[bottom] < threshold) bottom--;
      while (left < srcWidth && colBrightness[left] < threshold) left++;
      while (right > left && colBrightness[right] < threshold) right--;

      // 如果检测到的区域太小，则回退到中央80%区域
      if (right - left < srcWidth * 0.3 || bottom - top < srcHeight * 0.3) {
        left = Math.floor(srcWidth * 0.1);
        right = Math.floor(srcWidth * 0.9);
        top = Math.floor(srcHeight * 0.1);
        bottom = Math.floor(srcHeight * 0.9);
      }

      // 稍微向内收缩，避免边缘噪声
      const margin = 0.02;
      const cropLeft = Math.max(0, left + Math.floor((right - left) * margin));
      const cropRight = Math.min(srcWidth, right - Math.floor((right - left) * margin));
      const cropTop = Math.max(0, top + Math.floor((bottom - top) * margin));
      const cropBottom = Math.min(srcHeight, bottom - Math.floor((bottom - top) * margin));

      const cropWidth = cropRight - cropLeft;
      const cropHeight = cropBottom - cropTop;

      // 保持文档比例 (A4 比例约 1:1.414)，如果比例偏差过大，则调整为标准A4比例
      // 但为了让用户体验更自然，我们保留原始比例但限制最大宽高比。
      // 更合理的：裁剪为固定比例 1:1.414 可能会裁掉内容，所以这里不强制，但稍微归一化。
      // 最终目标：生成一个宽度为 TARGET_WIDTH 的图像，高度按比例。
      
      // 3. 将裁剪区域绘制到临时 canvas
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = cropWidth;
      tempCanvas.height = cropHeight;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(sourceCanvas, cropLeft, cropTop, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

      // 4. 锐化处理 (卷积核: 0 -1 0; -1 5 -1; 0 -1 0)
      const sharpCanvas = document.createElement('canvas');
      sharpCanvas.width = cropWidth;
      sharpCanvas.height = cropHeight;
      const sharpCtx = sharpCanvas.getContext('2d');
      sharpCtx.drawImage(tempCanvas, 0, 0);

      const imageData = sharpCtx.getImageData(0, 0, cropWidth, cropHeight);
      const data = imageData.data;
      const w = cropWidth;
      const h = cropHeight;
      // 克隆一份原始数据用于计算 (避免修改影响)
      const original = new Uint8ClampedArray(data);

      // 锐化卷积 (忽略边缘像素)
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = (y * w + x) * 4;
          for (let c = 0; c < 3; c++) { // R,G,B
            const val = 5 * original[idx + c]
                      - original[((y - 1) * w + x) * 4 + c]
                      - original[((y + 1) * w + x) * 4 + c]
                      - original[(y * w + (x - 1)) * 4 + c]
                      - original[(y * w + (x + 1)) * 4 + c];
            data[idx + c] = Math.min(255, Math.max(0, val));
          }
          // Alpha 不变
        }
      }
      sharpCtx.putImageData(imageData, 0, 0);

      // 5. 调整尺寸到目标宽度，同时保持比例
      const aspectRatio = cropHeight / cropWidth;
      const targetWidth = Math.min(TARGET_WIDTH, cropWidth); // 如果原图小于目标宽度则不放大
      const targetHeight = Math.round(targetWidth * aspectRatio);

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = targetWidth;
      finalCanvas.height = targetHeight;
      const finalCtx = finalCanvas.getContext('2d');
      // 高质量下采样
      finalCtx.imageSmoothingEnabled = true;
      finalCtx.imageSmoothingQuality = 'high';
      finalCtx.drawImage(sharpCanvas, 0, 0, cropWidth, cropHeight, 0, 0, targetWidth, targetHeight);

      // 6. 转为 dataURL (jpeg)
      return finalCanvas.toDataURL('image/jpeg', JPEG_QUALITY);
    }

    // -------------------- 拍照并处理 --------------------
    async function captureAndProcess() {
      if (!video.videoWidth || !video.videoHeight) {
        showToast('相机未准备好');
        return;
      }

      // 拍摄原始帧到 canvas
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      captureCanvas.width = vw;
      captureCanvas.height = vh;
      captureCtx.drawImage(video, 0, 0, vw, vh);

      setStatus('处理中...');
      showToast('处理中...', 800);

      try {
        const processedDataUrl = await processCapturedImage(captureCanvas);
        
        // 获取图像尺寸用于显示（缩略图）
        const img = new Image();
        img.src = processedDataUrl;
        await new Promise((resolve) => { img.onload = resolve; });
        
        capturedImages.push({
          dataUrl: processedDataUrl,
          width: img.width,
          height: img.height
        });

        // 更新缩略图
        renderThumbnails();
        updateExportButtonState();
        setStatus(`已添加 ${capturedImages.length} 页`);
        showToast('已拍摄并优化');
      } catch (err) {
        console.error('图像处理错误:', err);
        setStatus('处理失败', true);
        showToast('处理失败，请重试');
      }
    }

    // -------------------- 渲染缩略图列表 --------------------
    function renderThumbnails() {
      if (capturedImages.length === 0) {
        thumbnailStrip.innerHTML = '<div class="empty-thumbnail">还没有扫描任何文档</div>';
        return;
      }
      let html = '';
      capturedImages.forEach((item, index) => {
        html += `
          <div class="thumbnail-item">
            <img src="${item.dataUrl}" alt="文档页 ${index + 1}">
            <span class="page-num">${index + 1}</span>
          </div>
        `;
      });
      thumbnailStrip.innerHTML = html;
      // 滚动到最右侧显示最新
      thumbnailStrip.scrollLeft = thumbnailStrip.scrollWidth;
    }

    // -------------------- 清空所有文档 --------------------
    function clearAllDocuments() {
      if (capturedImages.length === 0) return;
      if (confirm('确定要删除所有扫描的页面吗？')) {
        capturedImages = [];
        renderThumbnails();
        updateExportButtonState();
        setStatus('已清空');
        showToast('已清空');
      }
    }

    // -------------------- 导出PDF --------------------
    async function exportToPdf() {
      if (capturedImages.length === 0) {
        showToast('没有可导出的页面');
        return;
      }

      const fileName = filenameInput.value.trim() || '扫描文档';
      setStatus('正在生成PDF...');
      exportPdfBtn.disabled = true; // 防止重复点击

      try {
        const { jsPDF } = window.jspdf;
        // 使用第一张图片的宽高比来确定PDF页面方向
        const firstImg = capturedImages[0];
        const aspectRatio = firstImg.height / firstImg.width;
        // 默认使用 A4 尺寸，但根据图片方向调整 (portrait or landscape)
        // A4: 595.28 x 841.89 pt
        const a4Width = 595.28;
        const a4Height = 841.89;
        
        // 判断页面方向: 如果图片高>宽，则纵向；否则横向
        const isPortrait = aspectRatio >= 1;
        const pdfWidth = isPortrait ? a4Width : a4Height;
        const pdfHeight = isPortrait ? a4Height : a4Width;

        const pdf = new jsPDF({
          orientation: isPortrait ? 'portrait' : 'landscape',
          unit: 'pt',
          format: 'a4'
        });

        for (let i = 0; i < capturedImages.length; i++) {
          if (i > 0) pdf.addPage();
          
          const imgData = capturedImages[i].dataUrl;
          // 计算图片在PDF中的尺寸: 适应页面，保持比例，留白边
          const imgWidth = capturedImages[i].width;
          const imgHeight = capturedImages[i].height;
          const imgAspect = imgHeight / imgWidth;
          
          // 页面宽高比
          const pageAspect = pdfHeight / pdfWidth;
          
          let displayWidth, displayHeight;
          // 留出10%边距
          const margin = 0.1;
          const availWidth = pdfWidth * (1 - margin * 2);
          const availHeight = pdfHeight * (1 - margin * 2);
          
          if (imgAspect > availHeight / availWidth) {
            // 高度受限
            displayHeight = availHeight;
            displayWidth = displayHeight / imgAspect;
          } else {
            // 宽度受限
            displayWidth = availWidth;
            displayHeight = displayWidth * imgAspect;
          }
          
          const x = (pdfWidth - displayWidth) / 2;
          const y = (pdfHeight - displayHeight) / 2;
          
          pdf.addImage(imgData, 'JPEG', x, y, displayWidth, displayHeight);
        }

        // 下载PDF
        pdf.save(`${fileName}.pdf`);
        setStatus(`已导出: ${fileName}.pdf`);
        showToast('PDF已保存');
      } catch (err) {
        console.error('PDF导出失败:', err);
        setStatus('导出失败', true);
        showToast('导出失败，请重试');
      } finally {
        exportPdfBtn.disabled = false;
      }
    }

    // -------------------- 事件绑定 --------------------
    function bindEvents() {
      // 点击画面对焦
      cameraContainer.addEventListener('click', handleFocusTap);
      // 切换摄像头
      switchCameraBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCamera();
      });
      // 拍照
      captureBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        captureAndProcess();
      });
      // 清空
      clearAllBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        clearAllDocuments();
      });
      // 导出PDF
      exportPdfBtn.addEventListener('click', exportToPdf);
      // 输入框焦点时不上滑
      filenameInput.addEventListener('touchstart', (e) => e.stopPropagation());
    }

    // -------------------- 初始化 --------------------
    async function init() {
      // 请求相机权限并启动
      await startCamera(currentFacingMode);
      bindEvents();
      // 初始状态
      updateExportButtonState();
      setStatus('点击“拍照”开始扫描');
    }

    init().catch(err => {
      console.error('初始化失败:', err);
      showToast('初始化失败，请刷新重试');
    });

    // 清理资源 (页面关闭时)
    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

  })();
</script>
</body>
</html>
