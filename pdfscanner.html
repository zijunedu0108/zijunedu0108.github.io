<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>文档扫描 · 自动裁剪PDF</title>
  <!-- PWA 图标和基础配置 -->
  <link rel="icon" type="image/png" href="zijunlogo.png">
  <link rel="apple-touch-icon" href="zijunlogo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="扫描文档">
  <meta name="theme-color" content="#0a84ff">

  <!-- OpenCV.js -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #1a1a1a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 100vh;
      background: #1c1c1e;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* ========== 页面切换 ========== */
    .page {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      background: #1c1c1e;
      transition: transform 0.3s ease, opacity 0.3s ease;
      overflow: hidden;
    }
    .page.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }
    /* ========== 相机页面 ========== */
    .camera-container {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .focus-indicator {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.1);
    }
    .focus-indicator.active { opacity: 1; }
    .camera-hint {
      position: absolute;
      bottom: 16px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }
    .camera-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 5;
    }
    .page-count-badge {
      background: rgba(10,132,255,0.9);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    /* 相机底部控制 */
    .camera-bottom-bar {
      background: #1c1c1e;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .btn {
      background: #2c2c2e;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .btn:active { background: #3a3a3c; transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .btn-icon { font-size: 18px; line-height: 1; }
    .btn-primary { background: #0a84ff; color: white; font-weight: 600; }
    .btn-primary:active { background: #0070e0; }
    .capture-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: white;
      border: 5px solid #0a84ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(10,132,255,0.4);
    }
    .capture-btn:active { transform: scale(0.92); }
    .capture-btn-inner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: white;
      transition: background 0.1s;
    }
    .capture-btn:active .capture-btn-inner { background: #e0e0e0; }

    /* ========== 预览编辑页面 ========== */
    .preview-header {
      padding: calc(16px + env(safe-area-inset-top)) 16px 12px;
      text-align: center;
      color: white;
      font-size: 17px;
      font-weight: 600;
      background: #1c1c1e;
      flex-shrink: 0;
    }
    .preview-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #111;
      min-height: 0;
      overflow: hidden;
    }
    .preview-image-wrapper {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }
    #previewImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .crop-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(10,132,255,0.9);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .rotate-controls {
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 16px;
      background: #1c1c1e;
      flex-shrink: 0;
    }
    .rotate-btn {
      background: #2c2c2e;
      border: none;
      color: white;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .rotate-btn:active { background: #3a3a3c; transform: scale(0.96); }
    .rotate-btn .icon { font-size: 20px; }

    .preview-actions {
      display: flex;
      gap: 12px;
      padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
      background: #1c1c1e;
      flex-shrink: 0;
    }
    .preview-actions .btn {
      flex: 1;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 16px;
    }
    .btn-confirm { background: #0a84ff; color: white; }
    .btn-confirm:active { background: #0070e0; }
    .btn-cancel { background: #2c2c2e; color: #ff453a; }
    .btn-cancel:active { background: #3a3a3c; }

    /* ========== 多页管理页面 ========== */
    .manage-header {
      padding: calc(16px + env(safe-area-inset-top)) 20px 12px;
      background: #1c1c1e;
      color: white;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .manage-header .sub {
      font-size: 13px;
      color: #8e8e93;
      font-weight: 400;
      margin-top: 2px;
    }
    .manage-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      background: #1c1c1e;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    .manage-list::-webkit-scrollbar { width: 4px; }
    .manage-list::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; }
    .page-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #2c2c2e;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .page-card-img {
      width: 64px;
      height: 84px;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      flex-shrink: 0;
    }
    .page-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .page-card-info {
      flex: 1;
      min-width: 0;
    }
    .page-card-info .title {
      color: white;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .page-card-info .meta {
      color: #8e8e93;
      font-size: 12px;
    }
    .page-card-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3a3a3c;
      border: none;
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .icon-btn:active { background: #4a4a4c; }
    .icon-btn.delete { color: #ff453a; }
    .empty-state {
      text-align: center;
      color: #8e8e93;
      padding: 60px 20px;
      font-size: 15px;
    }
    .empty-state .big-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .manage-bottom {
      padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
      background: #1c1c1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      border-top: 1px solid #2c2c2e;
    }
    .filename-input {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      color: white;
      outline: none;
      transition: border 0.2s;
      width: 100%;
    }
    .filename-input:focus { border-color: #0a84ff; }
    .filename-input::placeholder { color: #7a7a7a; }
    .export-btn {
      width: 100%;
      padding: 18px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      background: #0a84ff;
      color: white;
      border: none;
      box-shadow: 0 6px 20px rgba(10, 132, 255, 0.35);
      transition: background 0.15s, transform 0.1s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .export-btn:active { background: #0066cc; transform: scale(0.98); }
    .export-btn:disabled { opacity: 0.4; background: #3a3a3c; box-shadow: none; pointer-events: none; }
    .add-more-btn {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      background: #2c2c2e;
      color: #0a84ff;
      border: 1.5px dashed #0a84ff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .add-more-btn:active { background: #3a3a3c; }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: #0a84ff;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #ff453a; }
    .toast.success { background: #30d158; }

    /* 加载遮罩 */
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      flex-direction: column;
      gap: 16px;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #0a84ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: white; font-size: 15px; font-weight: 500; }

    /* 安全区域兼容 */
    @supports(padding: max(0px)) {
      .camera-bottom-bar { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
      .preview-actions { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
      .manage-bottom { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <!-- ========== 页面1: 相机拍摄 ========== -->
  <div class="page" id="pageCamera">
    <div class="camera-container" id="cameraContainer">
      <video id="video" playsinline autoplay muted></video>
      <div class="overlay">
        <div class="focus-indicator" id="focusIndicator"></div>
        <div class="camera-hint" id="cameraHint">点击画面对焦</div>
      </div>
      <div class="camera-top-bar">
        <span class="page-count-badge" id="pageCountBadge">已拍 0 页</span>
      </div>
    </div>
    <div class="camera-bottom-bar">
      <button class="btn" id="switchCameraBtn" style="width:56px;height:56px;border-radius:50%;padding:0;">
        <span class="btn-icon" style="font-size:22px;">🔄</span>
      </button>
      <button class="capture-btn" id="captureBtn">
        <div class="capture-btn-inner"></div>
      </button>
      <button class="btn" id="goToManageBtn" style="width:56px;height:56px;border-radius:50%;padding:0;position:relative;">
        <span class="btn-icon" style="font-size:22px;">📁</span>
      </button>
    </div>
  </div>

  <!-- ========== 页面2: 预览编辑 ========== -->
  <div class="page hidden" id="pagePreview">
    <div class="preview-header">调整文档</div>
    <div class="preview-body">
      <div class="preview-image-wrapper" id="previewWrapper">
        <img id="previewImage" alt="预览">
        <div class="crop-badge">✨ 已自动裁剪</div>
      </div>
    </div>
    <div class="rotate-controls">
      <button class="rotate-btn" id="rotateLeftBtn">
        <span class="icon">↺</span> 左转
      </button>
      <button class="rotate-btn" id="rotateRightBtn">
        <span class="icon">↻</span> 右转
      </button>
    </div>
    <div class="preview-actions">
      <button class="btn btn-cancel" id="discardBtn">放弃重拍</button>
      <button class="btn btn-confirm" id="confirmBtn">确定使用</button>
    </div>
  </div>

  <!-- ========== 页面3: 多页管理/导出 ========== -->
  <div class="page hidden" id="pageManage">
    <div class="manage-header">
      <div>
        <div>我的扫描</div>
        <div class="sub" id="manageSubtitle">共 0 页</div>
      </div>
    </div>
    <div class="manage-list" id="manageList">
      <div class="empty-state">
        <div class="big-icon">📄</div>
        <div>还没有扫描任何文档</div>
      </div>
    </div>
    <div class="manage-bottom">
      <button class="add-more-btn" id="addMoreBtn">
        <span>📸</span> 继续拍摄下一张
      </button>
      <input type="text" class="filename-input" id="filenameInput" placeholder="输入文档名称" value="扫描文档">
      <button class="export-btn" id="exportPdfBtn" disabled>
        <span>📥</span> 下载导出 PDF
      </button>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast">提示</div>

<!-- Loading 遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">处理中...</div>
</div>

<script>
  // ==================== OpenCV 加载回调 ====================
  let cvReady = false;
  function onOpenCvReady() {
    cvReady = true;
    console.log('OpenCV.js 加载完成');
  }

  (function() {
    // ==================== 全局状态 ====================
    let stream = null;
    let currentFacingMode = 'environment';
    let documents = []; // { id, dataUrl, width, height }
    let currentPreview = null; // { dataUrl, width, height, rotation }
    let activePage = 'camera';

    const TARGET_WIDTH = 1000;
    const JPEG_QUALITY = 0.92;

    // ==================== DOM 引用 ====================
    const pageCamera = document.getElementById('pageCamera');
    const pagePreview = document.getElementById('pagePreview');
    const pageManage = document.getElementById('pageManage');

    const video = document.getElementById('video');
    const cameraContainer = document.getElementById('cameraContainer');
    const focusIndicator = document.getElementById('focusIndicator');
    const cameraHint = document.getElementById('cameraHint');
    const pageCountBadge = document.getElementById('pageCountBadge');

    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const goToManageBtn = document.getElementById('goToManageBtn');

    const previewImage = document.getElementById('previewImage');
    const previewWrapper = document.getElementById('previewWrapper');
    const rotateLeftBtn = document.getElementById('rotateLeftBtn');
    const rotateRightBtn = document.getElementById('rotateRightBtn');
    const discardBtn = document.getElementById('discardBtn');
    const confirmBtn = document.getElementById('confirmBtn');

    const manageList = document.getElementById('manageList');
    const manageSubtitle = document.getElementById('manageSubtitle');
    const addMoreBtn = document.getElementById('addMoreBtn');
    const filenameInput = document.getElementById('filenameInput');
    const exportPdfBtn = document.getElementById('exportPdfBtn');

    const toastEl = document.getElementById('toast');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    // 用于拍照的 canvas
    const captureCanvas = document.createElement('canvas');
    const captureCtx = captureCanvas.getContext('2d');

    // ==================== 工具函数 ====================
    function showToast(msg, type = 'default', duration = 2000) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show';
      if (type === 'error') toastEl.classList.add('error');
      else if (type === 'success') toastEl.classList.add('success');
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    function showLoading(text = '处理中...') {
      loadingText.textContent = text;
      loadingOverlay.classList.add('show');
    }
    function hideLoading() {
      loadingOverlay.classList.remove('show');
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function updatePageCount() {
      pageCountBadge.textContent = `已拍 ${documents.length} 页`;
      manageSubtitle.textContent = `共 ${documents.length} 页`;
    }

    function updateExportState() {
      exportPdfBtn.disabled = documents.length === 0;
    }

    function switchPage(pageName) {
      activePage = pageName;
      pageCamera.classList.toggle('hidden', pageName !== 'camera');
      pagePreview.classList.toggle('hidden', pageName !== 'preview');
      pageManage.classList.toggle('hidden', pageName !== 'manage');
    }

    // ==================== 相机 ====================
    async function startCamera(facingMode) {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      try {
        const constraints = {
          video: {
            facingMode: facingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        cameraHint.textContent = '点击画面对焦';
      } catch (err) {
        console.error('相机启动失败:', err);
        showToast('无法访问相机，请检查权限', 'error');
      }
    }

    async function toggleCamera() {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      await startCamera(currentFacingMode);
    }

    function handleFocusTap(e) {
      e.preventDefault();
      const rect = cameraContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      focusIndicator.style.left = (x - 40) + 'px';
      focusIndicator.style.top = (y - 40) + 'px';
      focusIndicator.classList.add('active');

      if (stream) {
        const track = stream.getVideoTracks()[0];
        if (track && track.getCapabilities) {
          try {
            const caps = track.getCapabilities();
            if (caps.focusMode && caps.focusMode.includes('continuous')) {
              track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            }
          } catch (_) {}
        }
      }
      clearTimeout(window._focusTimer);
      window._focusTimer = setTimeout(() => focusIndicator.classList.remove('active'), 1500);
    }

    // ==================== 图像处理辅助函数 ====================
    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function sortCorners(pts) {
      const sorted = [...pts];
      sorted.sort((a, b) => (a.x + a.y) - (b.x + b.y));
      const tl = sorted[0];
      const br = sorted[3];
      const remaining = [sorted[1], sorted[2]];
      remaining.sort((a, b) => (a.x - a.y) - (b.x - b.y));
      const bl = remaining[0];
      const tr = remaining[1];
      return [tl, tr, br, bl];
    }

    function fallbackCropCanvas(sourceCanvas) {
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(w * 0.8);
      canvas.height = Math.floor(h * 0.8);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(sourceCanvas,
        Math.floor(w * 0.1), Math.floor(h * 0.1),
        canvas.width, canvas.height,
        0, 0, canvas.width, canvas.height);
      return canvas;
    }

    function sharpenCanvas(canvas) {
      const w = canvas.width, h = canvas.height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const orig = new Uint8ClampedArray(d);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          for (let c = 0; c < 3; c++) {
            let v = 5 * orig[i + c]
                  - orig[((y - 1) * w + x) * 4 + c]
                  - orig[((y + 1) * w + x) * 4 + c]
                  - orig[(y * w + (x - 1)) * 4 + c]
                  - orig[(y * w + (x + 1)) * 4 + c];
            d[i + c] = Math.min(255, Math.max(0, v));
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    function finalResize(canvas) {
      const aspect = canvas.height / canvas.width;
      const tw = Math.min(TARGET_WIDTH, canvas.width);
      const th = Math.round(tw * aspect);
      const out = document.createElement('canvas');
      out.width = tw;
      out.height = th;
      const ctx = out.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tw, th);
      return out.toDataURL('image/jpeg', JPEG_QUALITY);
    }

    // ==================== OpenCV 自动裁剪 ====================
    async function processCapturedImage(sourceCanvas) {
      if (!cvReady) {
        console.warn('OpenCV 未就绪，使用备用裁剪');
        const fallback = fallbackCropCanvas(sourceCanvas);
        const sharpened = sharpenCanvas(fallback);
        return finalResize(sharpened);
      }

      const srcW = sourceCanvas.width;
      const srcH = sourceCanvas.height;

      let src = cv.imread(sourceCanvas);
      let gray = new cv.Mat();
      let blurred = new cv.Mat();
      let edges = new cv.Mat();
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      let bestQuad = null;

      try {
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
        cv.Canny(blurred, edges, 60, 180);

        let kernel = cv.Mat.ones(3, 3, cv.CV_8U);
        cv.dilate(edges, edges, kernel, new cv.Point(-1, -1), 1);
        kernel.delete();

        cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let maxArea = 0;
        const imgArea = srcW * srcH;

        for (let i = 0; i < contours.size(); i++) {
          let cnt = contours.get(i);
          let area = cv.contourArea(cnt);
          if (area < imgArea * 0.15) { cnt.delete(); continue; }

          let peri = cv.arcLength(cnt, true);
          let approx = new cv.Mat();
          cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

          if (approx.rows === 4 && area > maxArea) {
            if (bestQuad) bestQuad.delete();
            bestQuad = approx.clone();
            maxArea = area;
          }
          approx.delete();
          cnt.delete();
        }

        let outputCanvas = document.createElement('canvas');

        if (bestQuad && maxArea > imgArea * 0.2) {
          const pts = [];
          for (let i = 0; i < 4; i++) {
            pts.push({
              x: bestQuad.data32S[i * 2],
              y: bestQuad.data32S[i * 2 + 1]
            });
          }
          const sorted = sortCorners(pts);

          const widthTop = dist(sorted[0], sorted[1]);
          const widthBottom = dist(sorted[3], sorted[2]);
          const heightLeft = dist(sorted[0], sorted[3]);
          const heightRight = dist(sorted[1], sorted[2]);

          let outW = Math.round(Math.max(widthTop, widthBottom));
          let outH = Math.round(Math.max(heightLeft, heightRight));

          if (outW > TARGET_WIDTH) {
            const ratio = TARGET_WIDTH / outW;
            outW = TARGET_WIDTH;
            outH = Math.round(outH * ratio);
          }

          let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
            sorted[0].x, sorted[0].y,
            sorted[1].x, sorted[1].y,
            sorted[2].x, sorted[2].y,
            sorted[3].x, sorted[3].y
          ]);
          let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
            0, 0, outW, 0, outW, outH, 0, outH
          ]);

          let M = cv.getPerspectiveTransform(srcTri, dstTri);
          let warped = new cv.Mat();
          cv.warpPerspective(src, warped, M, new cv.Size(outW, outH),
            cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

          outputCanvas.width = outW;
          outputCanvas.height = outH;
          cv.imshow(outputCanvas, warped);

          srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
          bestQuad.delete();
        } else {
          outputCanvas = fallbackCropCanvas(sourceCanvas);
        }

        const sharpened = sharpenCanvas(outputCanvas);
        return finalResize(sharpened);

      } catch (err) {
        console.error('OpenCV 处理失败:', err);
        const fallback = fallbackCropCanvas(sourceCanvas);
        const sharpened = sharpenCanvas(fallback);
        return finalResize(sharpened);
      } finally {
        src.delete(); gray.delete(); blurred.delete();
        edges.delete(); contours.delete(); hierarchy.delete();
        if (bestQuad) bestQuad.delete();
      }
    }

    // ==================== 拍照 → 预览 ====================
    async function captureAndPreview() {
      if (!video.videoWidth || !video.videoHeight) {
        showToast('相机未准备好', 'error');
        return;
      }
      showLoading('正在自动裁剪...');
      try {
        captureCanvas.width = video.videoWidth;
        captureCanvas.height = video.videoHeight;
        captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

        await new Promise(r => setTimeout(r, 80));

        const processedDataUrl = await processCapturedImage(captureCanvas);
        const img = new Image();
        img.src = processedDataUrl;
        await new Promise(r => { img.onload = r; });

        currentPreview = {
          dataUrl: processedDataUrl,
          width: img.width,
          height: img.height,
          rotation: 0
        };

        previewImage.src = processedDataUrl;
        previewWrapper.style.transform = 'rotate(0deg)';
        switchPage('preview');
      } catch (err) {
        console.error('拍照处理失败:', err);
        showToast('处理失败，请重试', 'error');
      } finally {
        hideLoading();
      }
    }

    // ==================== 预览页操作 ====================
    function rotatePreview(deg) {
      if (!currentPreview) return;
      currentPreview.rotation = ((currentPreview.rotation + deg) % 360 + 360) % 360;
      previewWrapper.style.transform = `rotate(${currentPreview.rotation}deg)`;
    }

    async function confirmPreview() {
      if (!currentPreview) return;
      showLoading('正在保存...');
      try {
        let finalDataUrl = currentPreview.dataUrl;
        const rot = currentPreview.rotation;

        if (rot !== 0) {
          const img = new Image();
          img.src = currentPreview.dataUrl;
          await new Promise(r => { img.onload = r; });

          const rad = rot * Math.PI / 180;
          const isSwapped = rot === 90 || rot === 270;

          const canvas = document.createElement('canvas');
          canvas.width = isSwapped ? img.height : img.width;
          canvas.height = isSwapped ? img.width : img.height;
          const ctx = canvas.getContext('2d');
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate(rad);
          ctx.drawImage(img, -img.width / 2, -img.height / 2);

          finalDataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        }

        const img2 = new Image();
        img2.src = finalDataUrl;
        await new Promise(r => { img2.onload = r; });

        documents.push({
          id: uid(),
          dataUrl: finalDataUrl,
          width: img2.width,
          height: img2.height
        });

        updatePageCount();
        updateExportState();
        renderManageList();

        currentPreview = null;
        showToast('已添加第 ' + documents.length + ' 页', 'success');
        switchPage('manage');
      } catch (err) {
        console.error(err);
        showToast('保存失败', 'error');
      } finally {
        hideLoading();
      }
    }

    function discardPreview() {
      currentPreview = null;
      showToast('已放弃，请重新拍摄');
      switchPage('camera');
    }

    // ==================== 多页管理 ====================
    function renderManageList() {
      if (documents.length === 0) {
        manageList.innerHTML = `
          <div class="empty-state">
            <div class="big-icon">📄</div>
            <div>还没有扫描任何文档</div>
          </div>`;
        updateExportState();
        updatePageCount();
        return;
      }
      let html = '';
      documents.forEach((doc, i) => {
        html += `
          <div class="page-card" data-id="${doc.id}">
            <div class="page-card-img">
              <img src="${doc.dataUrl}" alt="第${i + 1}页">
            </div>
            <div class="page-card-info">
              <div class="title">第 ${i + 1} 页</div>
              <div class="meta">${doc.width} × ${doc.height}</div>
            </div>
            <div class="page-card-actions">
              <button class="icon-btn delete" data-action="delete" data-id="${doc.id}">🗑️</button>
            </div>
          </div>
        `;
      });
      manageList.innerHTML = html;

      manageList.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteDocument(btn.dataset.id);
        });
      });

      updateExportState();
      updatePageCount();
    }

    function deleteDocument(id) {
      const idx = documents.findIndex(d => d.id === id);
      if (idx === -1) return;
      documents.splice(idx, 1);
      renderManageList();
      showToast('已删除该页', 'default', 1200);
    }

    // ==================== 导出 PDF ====================
    async function exportPdf() {
      if (documents.length === 0) {
        showToast('没有可导出的页面', 'error');
        return;
      }
      const fileName = filenameInput.value.trim() || '扫描文档';
      showLoading('正在生成 PDF...');

      try {
        const { jsPDF } = window.jspdf;
        const first = documents[0];
        const isPortrait = first.height >= first.width;
        const pdf = new jsPDF({
          orientation: isPortrait ? 'portrait' : 'landscape',
          unit: 'pt',
          format: 'a4'
        });

        const a4W = isPortrait ? 595.28 : 841.89;
        const a4H = isPortrait ? 841.89 : 595.28;

        for (let i = 0; i < documents.length; i++) {
          if (i > 0) pdf.addPage();
          const doc = documents[i];
          const imgAspect = doc.height / doc.width;
          const margin = 0.08;
          const availW = a4W * (1 - margin * 2);
          const availH = a4H * (1 - margin * 2);

          let dw, dh;
          if (imgAspect > availH / availW) {
            dh = availH;
            dw = dh / imgAspect;
          } else {
            dw = availW;
            dh = dw * imgAspect;
          }
          const x = (a4W - dw) / 2;
          const y = (a4H - dh) / 2;
          pdf.addImage(doc.dataUrl, 'JPEG', x, y, dw, dh);
        }

        pdf.save(`${fileName}.pdf`);
        showToast('PDF 已保存', 'success');
      } catch (err) {
        console.error('导出失败:', err);
        showToast('导出失败，请重试', 'error');
      } finally {
        hideLoading();
      }
    }

    // ==================== 页面导航 ====================
    function goToManage() {
      renderManageList();
      switchPage('manage');
    }

    function goToCamera() {
      switchPage('camera');
    }

    // ==================== 事件绑定 ====================
    function bindEvents() {
      cameraContainer.addEventListener('click', handleFocusTap);
      switchCameraBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleCamera(); });
      captureBtn.addEventListener('click', (e) => { e.stopPropagation(); captureAndPreview(); });
      goToManageBtn.addEventListener('click', (e) => { e.stopPropagation(); goToManage(); });

      rotateLeftBtn.addEventListener('click', () => rotatePreview(-90));
      rotateRightBtn.addEventListener('click', () => rotatePreview(90));
      discardBtn.addEventListener('click', discardPreview);
      confirmBtn.addEventListener('click', confirmPreview);

      addMoreBtn.addEventListener('click', goToCamera);
      exportPdfBtn.addEventListener('click', exportPdf);
    }

    // ==================== 初始化 ====================
    async function init() {
      await startCamera(currentFacingMode);
      bindEvents();
      updatePageCount();
      updateExportState();
      renderManageList();
      switchPage('camera');
    }

    init().catch(err => {
      console.error('初始化失败:', err);
      showToast('初始化失败，请刷新页面', 'error');
    });

    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
    });

  })();
</script>
