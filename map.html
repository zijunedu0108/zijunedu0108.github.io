<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zijun 导航</title>
  <link rel="icon" href="zijunlogo.png" type="image/png">
  <link rel="apple-touch-icon" href="zijunlogo.png">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #e8ecf1;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* 顶部栏 */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #ffffff;
      border-bottom: 1px solid #eef2f6;
      z-index: 1000;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      background: #f0f4fa;
    }

    .logo-area h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a2639;
    }

    .logo-area h1 span {
      color: #2e7dff;
    }

    .header-btn {
      background: #f5f9ff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.1rem;
      color: #2e475d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 地图容器：占据剩余全部空间 */
    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
      z-index: 1;
    }

    /* 底部控制面板（悬浮在地图上） */
    .bottom-panel {
      flex-shrink: 0;
      background: #ffffff;
      border-top: 1px solid #eef2f6;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 1000;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #f2f6fc;
      border-radius: 24px;
      padding: 4px 4px 4px 16px;
      margin-bottom: 12px;
    }

    .search-box i {
      color: #7a8f9f;
      font-size: 0.95rem;
    }

    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 10px;
      font-size: 0.95rem;
      outline: none;
      color: #1a2639;
    }

    .search-box button {
      background: #2e7dff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      color: white;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .action-row::-webkit-scrollbar {
      display: none;
    }

    .action-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fbff;
      border: 1px solid #e3ecf5;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #2e4052;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-chip i {
      color: #2e7dff;
      font-size: 0.9rem;
    }

    .action-chip.active {
      background: #2e7dff;
      color: white;
      border-color: #2e7dff;
    }

    .action-chip.active i {
      color: white;
    }

    /* 路线信息面板（显示在底部面板上方） */
    .route-info-panel {
      position: fixed;
      bottom: calc(100% - 60px);
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      z-index: 999;
      display: none;
      font-size: 0.85rem;
    }

    .route-info-panel.show {
      display: block;
    }

    .route-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-time {
      font-weight: 700;
      font-size: 1.2rem;
      color: #1a2639;
    }

    .route-distance {
      color: #5a6f80;
      font-size: 0.8rem;
    }

    /* Leaflet 路由控件样式微调 */
    .leaflet-routing-container {
      display: none !important;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .logo-area h1 {
        font-size: 1rem;
      }
      .logo-area img {
        width: 32px;
        height: 32px;
      }
      .header {
        padding: 8px 12px;
      }
      .bottom-panel {
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 头部 -->
    <header class="header">
      <div class="logo-area">
        <img src="zijunlogo.png" alt="Zijun Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232e7dff%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-weight=%22bold%22%3EZ%3C/text%3E%3C/svg%3E'">
        <h1>Zijun <span>导航</span></h1>
      </div>
      <button class="header-btn" id="locateBtn" aria-label="定位">
        <i class="fas fa-location-arrow"></i>
      </button>
    </header>

    <!-- 真实地图容器 -->
    <div id="map"></div>

    <!-- 底部控制面板 -->
    <div class="bottom-panel">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="destInput" placeholder="输入目的地地址或地点名称">
        <button id="routeBtn">路线</button>
      </div>
      
      <div class="action-row">
        <div class="action-chip" data-action="gas">
          <i class="fas fa-gas-pump"></i> 加油站
        </div>
        <div class="action-chip" data-action="food">
          <i class="fas fa-utensils"></i> 餐厅
        </div>
        <div class="action-chip" data-action="clear">
          <i class="fas fa-times"></i> 清除路线
        </div>
      </div>
    </div>
  </div>

  <!-- Font Awesome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Routing Machine -->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>
    // ========== 初始化真实地图 ==========
    // 以用户位置为中心（如果无法获取则默认新加坡）
    const defaultCenter = [1.3521, 103.8198]; // 新加坡
    const map = L.map('map', {
      zoomControl: false,        // 隐藏默认缩放按钮，手机端更简洁
      attributionControl: false  // 隐藏版权信息（可选，但建议保留在关于页）
    }).setView(defaultCenter, 14);

    // 添加 OpenStreetMap 真实瓦片
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 添加缩放控件（手机端用 +/- 更易操作）
    L.control.zoom({
      position: 'bottomright'
    }).addTo(map);

    // ========== 路线引擎 ==========
    let routingControl = null;
    let currentRoute = null;

    // 清除现有路线
    function clearRoute() {
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
      if (currentRoute) {
        map.removeLayer(currentRoute);
        currentRoute = null;
      }
      document.querySelector('.route-info-panel')?.remove();
    }

    // 计算并显示路线（使用 OSRM 免费路由服务）
    function calculateRoute(startLatLng, endLatLng, endName) {
      clearRoute();

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(startLatLng),
          L.latLng(endLatLng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1'
        }),
        lineOptions: {
          styles: [{ color: '#2e7dff', weight: 6, opacity: 0.8 }]
        },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: true,
        show: false,  // 隐藏默认的详细指令面板（手机空间有限）
        createMarker: function(i, wp) {
          // 自定义标记：起点和终点
          const isStart = (i === 0);
          return L.marker(wp.latLng, {
            icon: L.divIcon({
              className: 'custom-marker',
              html: `<div style="
                background: ${isStart ? '#27ae60' : '#e74c3c'};
                width: 28px; height: 28px;
                border-radius: 50% 50% 50% 0;
                transform: rotate(-45deg);
                display: flex; align-items: center; justify-content: center;
                border: 3px solid white;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
              "><i class="fas ${isStart ? 'fa-circle' : 'fa-flag'}" style="
                transform: rotate(45deg);
                color: white;
                font-size: 12px;
              "></i></div>`,
              iconSize: [28, 28],
              iconAnchor: [14, 28]
            })
          });
        }
      }).addTo(map);

      // 监听路线计算完成，显示摘要信息
      routingControl.on('routesfound', function(e) {
        const route = e.routes[0];
        const distance = (route.summary.totalDistance / 1000).toFixed(1);
        const time = Math.round(route.summary.totalTime / 60);
        
        // 移除旧面板
        document.querySelector('.route-info-panel')?.remove();
        
        // 创建路线摘要面板
        const panel = document.createElement('div');
        panel.className = 'route-info-panel show';
        panel.innerHTML = `
          <div class="route-summary">
            <div>
              <span class="route-time">${time} 分钟</span>
              <span class="route-distance" style="margin-left:12px;">${distance} km</span>
            </div>
            <div style="font-size:0.75rem; color:#7b8f9f;">
              <i class="fas fa-route"></i> 推荐路线
            </div>
          </div>
          <div style="font-size:0.7rem; color:#95a9b9; margin-top:4px;">
            终点：${endName || '目的地'}
          </div>
        `;
        document.body.appendChild(panel);
      });

      routingControl.on('routingerror', function(e) {
        alert('路线规划失败，请检查网络或地址是否准确。');
      });
    }

    // ========== 地理编码（地址转坐标）==========
    async function geocodeAddress(address) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
      try {
        const res = await fetch(url, {
          headers: { 'User-Agent': 'ZijunNav/1.0' }
        });
        const data = await res.json();
        if (data && data.length > 0) {
          return {
            lat: parseFloat(data[0].lat),
            lng: parseFloat(data[0].lon),
            name: data[0].display_name
          };
        }
      } catch (e) {
        console.error('地理编码失败', e);
      }
      return null;
    }

    // ========== 用户定位 ==========
    let userLatLng = null;

    function locateUser() {
      if (!navigator.geolocation) {
        alert('您的浏览器不支持定位功能');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLatLng = [pos.coords.latitude, pos.coords.longitude];
          map.setView(userLatLng, 15);
          
          // 添加用户位置标记
          L.marker(userLatLng, {
            icon: L.divIcon({
              className: 'user-marker',
              html: `<div style="
                background: #2e7dff;
                width: 20px; height: 20px;
                border-radius: 50%;
                border: 4px solid white;
                box-shadow: 0 2px 10px rgba(46,125,255,0.5);
              "></div>`,
              iconSize: [20, 20],
              iconAnchor: [10, 10]
            })
          }).addTo(map);
        },
        (err) => {
          console.warn('定位失败', err);
          alert('无法获取当前位置，请检查定位权限。地图将显示默认位置。');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // ========== 周边搜索（加油站/餐厅）==========
    async function searchNearby(type) {
      if (!userLatLng) {
        alert('请先点击右上角定位按钮获取当前位置');
        return;
      }

      clearRoute();
      
      // Overpass API 查询
      const amenity = type === 'gas' ? 'fuel' : 'restaurant';
      const radius = 1500; // 1.5km
      const query = `
        [out:json];
        node(around:${radius},${userLatLng[0]},${userLatLng[1]})["amenity"="${amenity}"];
        out body;
      `;
      
      try {
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        const data = await res.json();
        
        if (data.elements && data.elements.length > 0) {
          // 在地图上标记结果
          data.elements.slice(0, 15).forEach(el => {
            const marker = L.marker([el.lat, el.lon], {
              icon: L.divIcon({
                className: 'poi-marker',
                html: `<div style="
                  background: ${type === 'gas' ? '#f39c12' : '#e74c3c'};
                  width: 32px; height: 32px;
                  border-radius: 50%;
                  display: flex; align-items: center; justify-content: center;
                  border: 3px solid white;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                "><i class="fas ${type === 'gas' ? 'fa-gas-pump' : 'fa-utensils'}" style="color:white; font-size:14px;"></i></div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 32]
              })
            }).addTo(map);
            
            if (el.tags && el.tags.name) {
              marker.bindPopup(`<b>${el.tags.name}</b><br>${type === 'gas' ? '加油站' : '餐厅'}`);
            }
          });
          
          // 调整视野以包含所有标记
          const bounds = L.latLngBounds(data.elements.map(el => [el.lat, el.lon]));
          map.fitBounds(bounds, { padding: [40, 40] });
          
          alert(`找到 ${data.elements.length} 个${type === 'gas' ? '加油站' : '餐厅'}，已在地图上标记。`);
        } else {
          alert('附近没有找到相关地点，请尝试扩大范围或检查网络。');
        }
      } catch (e) {
        console.error(e);
        alert('搜索失败，请稍后重试。Overpass API 可能有频率限制。');
      }
    }

    // ========== 事件绑定 ==========
    
    // 路线按钮
    document.getElementById('routeBtn').addEventListener('click', async () => {
      const input = document.getElementById('destInput');
      const address = input.value.trim();
      
      if (!address) {
        alert('请输入目的地地址');
        return;
      }
      
      if (!userLatLng) {
        // 如果没有用户位置，尝试先定位
        locateUser();
        // 给定位一点时间，然后再次尝试
        setTimeout(async () => {
          if (!userLatLng) {
            alert('无法获取当前位置，请先点击右上角定位按钮。');
            return;
          }
          await doRoute(address);
        }, 1500);
        return;
      }
      
      await doRoute(address);
    });

    async function doRoute(address) {
      const btn = document.getElementById('routeBtn');
      btn.textContent = '计算中...';
      btn.disabled = true;
      
      const dest = await geocodeAddress(address);
      if (dest) {
        calculateRoute(userLatLng, [dest.lat, dest.lng], dest.name);
        document.getElementById('destInput').blur(); // 收起键盘
      } else {
        alert('找不到该地址，请尝试更具体的描述。');
      }
      
      btn.textContent = '路线';
      btn.disabled = false;
    }

    // 定位按钮
    document.getElementById('locateBtn').addEventListener('click', locateUser);

    // 快捷操作按钮
    document.querySelectorAll('.action-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const action = this.dataset.action;
        
        // 切换激活状态
        document.querySelectorAll('.action-chip').forEach(c => c.classList.remove('active'));
        if (action !== 'clear') this.classList.add('active');
        
        if (action === 'gas') {
          searchNearby('gas');
        } else if (action === 'food') {
          searchNearby('food');
        } else if (action === 'clear') {
          clearRoute();
          // 清除 POI 标记（简单处理：重载地图，清除所有非路线标记太复杂，这里仅清路线）
          // 实际中可维护一个 marker 数组来管理
        }
      });
    });

    // 回车键触发路线
    document.getElementById('destInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('routeBtn').click();
      }
    });

    // ========== 启动时尝试定位 ==========
    // 延迟一点，让地图先加载
    setTimeout(locateUser, 500);

    // 监听窗口大小变化，确保地图正确重绘（手机旋转）
    window.addEventListener('resize', () => {
      map.invalidateSize();
    });

  </script>
</body>
</html>
