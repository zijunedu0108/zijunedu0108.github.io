<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>情侣储蓄 · 主页</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #f5e8ee;
            background-image: radial-gradient(circle at 20% 30%, #fce8ef 0%, #f5dce6 100%);
            padding: 12px 12px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 248, 250, 0.88);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 16px 16px 24px;
            box-shadow: 0 8px 40px rgba(200, 80, 120, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ===== Profile Card ===== */
        .profile-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 16px;
            box-shadow: 0 2px 12px rgba(200, 80, 120, 0.08);
            border: 1px solid #f5d0dd;
            margin-bottom: 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }

        .avatar-frame {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #f0b0c8;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff5f9;
            flex-shrink: 0;
        }

        .avatar-frame img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            display: block;
        }

        .profile-info {
            flex: 1;
            min-width: 80px;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #7a3a54;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .profile-role {
            font-size: 0.85rem;
            font-weight: 500;
            color: #b35d7e;
            background: #fceef4;
            padding: 2px 14px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #f0b0c8;
            margin-top: 1px;
        }

        /* ===== 资产卡片（可点击） ===== */
        .assets-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .asset-card {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid #f5d0dd;
            box-shadow: 0 2px 8px rgba(200, 80, 120, 0.05);
            text-align: center;
            min-width: 0;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            position: relative;
        }

        .asset-card:active {
            transform: scale(0.96);
            background: #fcf2f6;
        }

        .asset-card .asset-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #b88b9c;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .asset-card .asset-amount {
            font-size: 1.2rem;
            font-weight: 700;
            color: #6b2f47;
        }

        .asset-card .asset-amount small {
            font-size: 0.7rem;
            font-weight: 500;
            color: #ae6a84;
        }

        .asset-card .tap-hint {
            font-size: 0.55rem;
            color: #c99aae;
            margin-top: 2px;
            opacity: 0.7;
        }

        .asset-card.my-asset {
            border-left: 3px solid #f0a0b8;
        }

        .asset-card.shared-asset {
            border-left: 3px solid #c96d8b;
        }

        /* ===== Filter Bar ===== */
        .filter-bar {
            background: #fcf2f6;
            border-radius: 14px;
            padding: 8px 10px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            border: 1px solid #f0c8d8;
        }

        .filter-bar select,
        .filter-bar input {
            background: white;
            border: 1.5px solid #f0b0c8;
            border-radius: 10px;
            padding: 5px 10px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #5e3649;
            outline: none;
            flex: 1 0 auto;
            min-width: 60px;
            transition: 0.1s ease;
            touch-action: manipulation;
            appearance: auto;
            height: 34px;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #e08db0;
            box-shadow: 0 0 0 3px rgba(224, 141, 176, 0.15);
        }

        .filter-bar input[type="date"] {
            min-width: 100px;
        }

        .filter-bar .filter-btn {
            background: #f0a0b8;
            border: none;
            border-radius: 10px;
            padding: 5px 16px;
            font-weight: 600;
            color: #4e283b;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.08s linear;
            border: 1px solid #e890b0;
            height: 34px;
            touch-action: manipulation;
            flex: 0 0 auto;
        }

        .filter-bar .filter-btn:active {
            transform: scale(0.96);
        }

        /* ===== History ===== */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .history-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #77445c;
        }

        .history-count {
            font-size: 0.8rem;
            font-weight: 500;
            color: #b16f89;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .record-item {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 2px 6px rgba(200, 80, 120, 0.05);
            border: 1px solid #f5d0dd;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .record-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .record-category {
            font-weight: 600;
            font-size: 0.9rem;
            color: #3f2432;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .record-category .badge {
            background: #fce8ef;
            border-radius: 8px;
            padding: 0 10px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #8f4b68;
            border: 1px solid #f0b0c8;
        }

        .record-note {
            font-size: 0.82rem;
            color: #694c5b;
            font-weight: 400;
        }

        .record-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            font-size: 0.68rem;
            color: #956d7e;
            font-weight: 400;
            margin-top: 1px;
        }

        .record-amount {
            font-weight: 700;
            font-size: 1.15rem;
            color: #992f57;
            background: #fce8ef;
            padding: 4px 12px;
            border-radius: 10px;
            border: 1px solid #f0b0c8;
            white-space: nowrap;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .record-amount.negative {
            color: #c44f6a;
        }

        .empty-message {
            text-align: center;
            padding: 28px 16px;
            background: #fcf2f6;
            border-radius: 14px;
            color: #aa748b;
            font-weight: 500;
            border: 1px dashed #f0b0c8;
        }

        .loading-message {
            text-align: center;
            padding: 24px 16px;
            color: #aa748b;
            font-weight: 500;
        }

        /* ===== Modal 弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: #ffffff;
            border-radius: 24px;
            padding: 24px 20px 20px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid #f5d0dd;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #7a3a54;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #b88b9c;
            cursor: pointer;
            padding: 0 4px;
            touch-action: manipulation;
        }

        .modal-close:active {
            transform: scale(0.9);
        }

        .modal-total {
            text-align: center;
            padding: 8px 0 14px;
            border-bottom: 1px solid #f5e0e8;
            margin-bottom: 14px;
        }

        .modal-total .label {
            font-size: 0.75rem;
            color: #b88b9c;
            font-weight: 500;
        }

        .modal-total .amount {
            font-size: 1.6rem;
            font-weight: 700;
            color: #6b2f47;
        }

        .modal-total .amount small {
            font-size: 0.8rem;
            font-weight: 500;
            color: #ae6a84;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 4px;
            border-bottom: 1px solid #f5f0f2;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item .detail-label {
            font-size: 0.85rem;
            color: #5e3649;
            font-weight: 500;
        }

        .detail-item .detail-amount {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6b2f47;
        }

        .detail-item .detail-amount.positive {
            color: #6b8f6b;
        }

        .detail-item .detail-amount.negative {
            color: #c44f6a;
        }

        .modal-empty {
            text-align: center;
            padding: 20px 0;
            color: #b88b9c;
            font-size: 0.85rem;
        }

        /* ===== iOS-style Bottom Navigation ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 248, 250, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(200, 80, 120, 0.12);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            max-width: 420px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            border-radius: 20px 20px 0 0;
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 20px;
            border-radius: 12px;
            transition: all 0.15s ease;
            touch-action: manipulation;
            min-width: 50px;
            border: none;
            background: transparent;
            cursor: pointer;
            position: relative;
        }

        .nav-item .nav-icon {
            font-size: 1.3rem;
            font-weight: 400;
            color: #b88b9c;
            transition: color 0.15s ease;
            line-height: 1.4;
        }

        .nav-item .nav-label {
            font-size: 0.55rem;
            font-weight: 600;
            color: #b88b9c;
            letter-spacing: 0.3px;
            transition: color 0.15s ease;
        }

        .nav-item.active .nav-icon {
            color: #c96d8b;
        }

        .nav-item.active .nav-label {
            color: #c96d8b;
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: #c96d8b;
            border-radius: 0 0 4px 4px;
        }

        /* 滚动条美化 */
        .modal-content::-webkit-scrollbar {
            width: 3px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: #f5f0f2;
            border-radius: 10px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #f0b0c8;
            border-radius: 10px;
        }
    </style>
</head>

<!-- ===== Main Script ===== -->
<script type="module">
    import { initializeApp } from 'firebase/app';
    import { getFirestore, collection, query, orderBy, onSnapshot } from 'firebase/firestore';

    const firebaseConfig = {
        apiKey: "AIzaSyD_aW8osSZupLNTmaFXrPjAOcroX_2D7YQ",
        authDomain: "dailylife-5ad94.firebaseapp.com",
        projectId: "dailylife-5ad94",
        storageBucket: "dailylife-5ad94.firebasestorage.app",
        messagingSenderId: "783888781810",
        appId: "1:783888781810:web:d9dc08ab862b9935f29b6b",
        measurementId: "G-3T4P3CY0JH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ROLE_KEY = 'couple_role';
    const NAME_KEY = 'couple_name';
    const ICON_KEY = 'couple_icon';

    const role = localStorage.getItem(ROLE_KEY) || 'boy';
    const currentUser = localStorage.getItem(NAME_KEY) || (role === 'boy' ? 'GENTO' : 'MANTO');
    const iconPath = localStorage.getItem(ICON_KEY) || (role === 'boy' ? '/gento.png' : '/manto.png');

    document.getElementById('profileAvatar').src = iconPath;
    document.getElementById('profileName').textContent = currentUser;
    document.getElementById('profileRole').textContent = role === 'boy' ? '男朋友' : '女朋友';

    let allRecords = [];

    // ===== 资产计算方法 =====
    function calculateAssets() {
        let myTotal = 0;
        let sharedTotal = 0;
        const myDetails = {};
        const sharedDetails = {};

        allRecords.forEach(r => {
            const amt = parseFloat(r.amount) || 0;
            const isIncome = r.type === '进账';
            const sign = isIncome ? 1 : -1;
            const method = r.method || '其他';

            if (r.scope === '个人') {
                if (r.executor === currentUser) {
                    myTotal += sign * amt;
                    myDetails[method] = (myDetails[method] || 0) + sign * amt;
                }
            } else {
                sharedTotal += sign * amt;
                sharedDetails[method] = (sharedDetails[method] || 0) + sign * amt;
            }
        });

        // 兼容旧数据：没有 scope 的按共同处理
        const hasScope = allRecords.some(r => r.scope !== undefined);
        if (!hasScope) {
            let total = 0;
            const details = {};
            allRecords.forEach(r => {
                const amt = parseFloat(r.amount) || 0;
                const isIncome = r.type === '进账';
                const sign = isIncome ? 1 : -1;
                const method = r.method || '其他';
                total += sign * amt;
                details[method] = (details[method] || 0) + sign * amt;
            });
            return {
                myAsset: 0,
                sharedAsset: total,
                myDetails: {},
                sharedDetails: details
            };
        }

        return {
            myAsset: myTotal,
            sharedAsset: sharedTotal,
            myDetails: myDetails,
            sharedDetails: sharedDetails
        };
    }

    function updateAssets() {
        const { myAsset, sharedAsset, myDetails, sharedDetails } = calculateAssets();
        document.getElementById('myAssetDisplay').innerHTML = `<small>RM</small> ${myAsset.toFixed(2)}`;
        document.getElementById('sharedAssetDisplay').innerHTML = `<small>RM</small> ${sharedAsset.toFixed(2)}`;

        // 存储明细数据供弹窗使用
        window._assetData = { myAsset, sharedAsset, myDetails, sharedDetails };
    }

    // ===== 弹窗控制 =====
    const modal = document.getElementById('assetModal');
    const modalClose = document.getElementById('modalClose');

    function openModal(title, total, details) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalTotal').innerHTML = `<small>RM</small> ${total.toFixed(2)}`;

        const detailList = document.getElementById('modalDetailList');
        const entries = Object.entries(details).filter(([_, val]) => val !== 0);

        if (entries.length === 0) {
            detailList.innerHTML = `<div class="modal-empty">暂无明细记录</div>`;
        } else {
            let html = '';
            entries.forEach(([method, amount]) => {
                const cls = amount >= 0 ? 'positive' : 'negative';
                const sign = amount >= 0 ? '+' : '';
                html += `
                    <div class="detail-item">
                        <span class="detail-label">${method}</span>
                        <span class="detail-amount ${cls}">${sign} RM ${amount.toFixed(2)}</span>
                    </div>
                `;
            });
            detailList.innerHTML = html;
        }

        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // ===== 点击资产卡片 =====
    document.getElementById('myAssetCard').addEventListener('click', function() {
        const data = window._assetData || { myAsset: 0, myDetails: {} };
        openModal('👤 我的资产明细', data.myAsset, data.myDetails);
    });

    document.getElementById('sharedAssetCard').addEventListener('click', function() {
        const data = window._assetData || { sharedAsset: 0, sharedDetails: {} };
        openModal('💞 共同资产明细', data.sharedAsset, data.sharedDetails);
    });

    // ===== 渲染历史记录 =====
    function renderHistory(filterOptions = {}) {
        const { date, method, type, executor } = filterOptions;

        let filtered = allRecords.filter(r => {
            if (date && r.date !== date) return false;
            if (method && r.method !== method) return false;
            if (type && r.type !== type) return false;
            if (executor && r.executor !== executor) return false;
            return true;
        });

        filtered.sort((a, b) => (a.date < b.date ? 1 : -1));

        const container = document.getElementById('historyList');
        const countSpan = document.getElementById('recordCount');

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-message">🌸 还没有记录，添加一笔吧</div>`;
            countSpan.textContent = '(0)';
            return;
        }

        countSpan.textContent = `(${filtered.length})`;

        let html = '';
        filtered.forEach(r => {
            const isNegative = r.type === '开销';
            const amountClass = isNegative ? 'record-amount negative' : 'record-amount';
            const sign = isNegative ? '-' : '+';
            const icon = isNegative ? '💸' : '💰';
            const scopeTag = r.scope === '个人' ? '👤个人' : '💞共同';

            html += `
                <div class="record-item">
                    <div class="record-left">
                        <div class="record-category">
                            <span>${icon} ${r.type}</span>
                            <span class="badge">${r.method || '其他'}</span>
                            <span class="badge" style="background:#f0e0e8;">${scopeTag}</span>
                        </div>
                        <div class="record-note">${r.note || '无备注'}</div>
                        <div class="record-meta">
                            <span>📅 ${r.date || '未知日期'}</span>
                            <span>👤 ${r.executor || '未知'}</span>
                        </div>
                    </div>
                    <div class="${amountClass}">${sign} RM ${parseFloat(r.amount).toFixed(2)}</div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    // ===== 监听 Firestore =====
    function listenToRecords() {
        const recordsRef = collection(db, 'records');
        const q = query(recordsRef, orderBy('date', 'desc'));

        onSnapshot(q, (snapshot) => {
            allRecords = [];
            snapshot.forEach((doc) => {
                allRecords.push({ id: doc.id, ...doc.data() });
            });

            updateAssets();

            const date = document.getElementById('filterDate').value;
            const method = document.getElementById('filterMethod').value;
            const type = document.getElementById('filterType').value;
            const executor = document.getElementById('filterExecutor').value;
            renderHistory({ date, method, type, executor });

        }, (error) => {
            console.error('监听失败:', error);
            document.getElementById('historyList').innerHTML =
                `<div class="empty-message">⚠️ 加载失败: ${error.message}</div>`;
        });
    }

    listenToRecords();

    // ===== 筛选按钮 =====
    document.getElementById('applyFilterBtn').addEventListener('click', function() {
        const date = document.getElementById('filterDate').value;
        const method = document.getElementById('filterMethod').value;
        const type = document.getElementById('filterType').value;
        const executor = document.getElementById('filterExecutor').value;
        renderHistory({ date, method, type, executor });
    });

    document.getElementById('applyFilterBtn').addEventListener('dblclick', function() {
        document.getElementById('filterDate').value = '';
        document.getElementById('filterMethod').value = '';
        document.getElementById('filterType').value = '';
        document.getElementById('filterExecutor').value = '';
        renderHistory({});
    });

    // ===== 导航高亮 =====
    document.getElementById('navHome').classList.add('active');

    console.log('🔥 cmain 已连接 Firestore, 当前用户:', currentUser);
</script>

</body>
</html>
