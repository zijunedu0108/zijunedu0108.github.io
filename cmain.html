<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>情侣储蓄 · 主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #ffecf2;
            background-image: radial-gradient(circle at 20% 30%, #ffe2ed 0%, #ffd6e4 100%);
            padding: 16px 16px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 245, 248, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 48px 48px 32px 32px;
            padding: 20px 18px 30px;
            box-shadow: 0 20px 40px rgba(200, 80, 120, 0.15), 0 8px 20px rgba(255, 150, 180, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .profile-card {
            background: linear-gradient(145deg, #ffffff, #fff5f9);
            border-radius: 40px;
            padding: 20px 18px 18px;
            box-shadow: 0 12px 20px rgba(255, 120, 160, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            border: 2px solid #ffdae6;
            margin-bottom: 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #ffb0cb;
            box-shadow: 0 6px 0 #e89bb5, 0 8px 16px rgba(200, 80, 120, 0.15);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff5f9;
            flex-shrink: 0;
        }

        .avatar-frame img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }

        .profile-info {
            flex: 1;
            min-width: 120px;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            color: #822f4f;
            letter-spacing: 2px;
            line-height: 1.1;
            text-shadow: 2px 2px 0 #ffc1d4;
        }

        .profile-role {
            font-size: 1.1rem;
            font-weight: 600;
            color: #b35d7e;
            background: #ffeef4;
            padding: 2px 18px;
            border-radius: 40px;
            display: inline-block;
            border: 1.5px solid #ff9bbb;
            margin-top: 4px;
        }

        .profile-savings {
            margin-left: auto;
            background: #fee7f0;
            padding: 10px 18px 10px 20px;
            border-radius: 60px;
            border: 2px solid #ffb7cf;
            box-shadow: inset 0 2px 6px rgba(255, 200, 220, 0.5);
            font-weight: 700;
            font-size: 1.6rem;
            color: #6b2f47;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .profile-savings small {
            font-size: 1rem;
            font-weight: 500;
            color: #ae6a84;
        }

        .filter-bar {
            background: #fff2f7;
            border-radius: 60px;
            padding: 8px 12px;
            margin-bottom: 22px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 8px;
            border: 2px solid #ffc1d4;
            box-shadow: 0 4px 0 #e8aec2;
        }

        .filter-bar select,
        .filter-bar input {
            background: white;
            border: 1.5px solid #ffb7cf;
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #5e3649;
            outline: none;
            flex: 1 0 auto;
            min-width: 80px;
            box-shadow: 0 2px 4px rgba(255, 120, 160, 0.1);
            transition: 0.1s ease;
            touch-action: manipulation;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #f58eb0;
            box-shadow: 0 0 0 3px #ffd0e0;
        }

        .filter-bar .filter-btn {
            background: #ff9fbb;
            border: none;
            border-radius: 60px;
            padding: 8px 22px;
            font-weight: 700;
            color: #4e283b;
            font-size: 0.95rem;
            border-bottom: 5px solid #c96d8b;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 2px 6px rgba(200, 80, 120, 0.2);
            flex: 0 0 auto;
            touch-action: manipulation;
        }

        .filter-bar .filter-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .history-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #77445c;
            padding-left: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 10px;
        }

        .record-item {
            background: white;
            border-radius: 28px;
            padding: 14px 18px;
            box-shadow: 0 6px 0 #efb9cd, 0 8px 16px rgba(200, 80, 120, 0.12);
            border: 2px solid #ffdae6;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            transition: 0.1s ease;
        }

        .record-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .record-category {
            font-weight: 700;
            font-size: 1.1rem;
            color: #3f2432;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .record-category .badge {
            background: #fee1eb;
            border-radius: 40px;
            padding: 0 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #8f4b68;
            border: 1px solid #ffb7cf;
        }

        .record-note {
            font-size: 0.95rem;
            color: #694c5b;
            font-weight: 500;
        }

        .record-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            font-size: 0.8rem;
            color: #956d7e;
            font-weight: 500;
            margin-top: 4px;
        }

        .record-amount {
            font-weight: 800;
            font-size: 1.6rem;
            color: #992f57;
            background: #ffeeef;
            padding: 6px 18px;
            border-radius: 60px;
            border: 2px solid #ffb7cf;
            white-space: nowrap;
            margin-left: 6px;
        }

        .record-amount.negative {
            color: #c44f6a;
            background: #ffe3e9;
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            background: #fff2f7;
            border-radius: 60px;
            color: #aa748b;
            font-weight: 600;
            border: 2px dashed #ffb7cf;
        }

        .loading-message {
            text-align: center;
            padding: 30px 20px;
            color: #aa748b;
            font-weight: 600;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffecf2;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 3px solid #ffc1d4;
            display: flex;
            justify-content: space-around;
            padding: 12px 12px 18px;
            box-shadow: 0 -6px 20px rgba(255, 120, 160, 0.2);
            border-radius: 40px 40px 0 0;
            max-width: 440px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-item {
            text-decoration: none;
            font-weight: 700;
            color: #9d5b78;
            background: #ffe2ed;
            padding: 8px 24px;
            border-radius: 60px;
            border: 2px solid #ffb7cf;
            font-size: 1rem;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #d68ca8;
            display: inline-block;
            text-align: center;
            min-width: 70px;
            touch-action: manipulation;
        }

        .nav-item:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #d68ca8;
        }

        .nav-item.active {
            background: #ffb7cf;
            color: #582f40;
            border-color: #f58eb0;
            box-shadow: 0 4px 0 #b86f8a;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="profile-card">
        <div class="avatar-frame" id="avatarFrame">
            <img id="profileAvatar" src="/gento.png" alt="头像" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2270%22 height=%2270%22 viewBox=%220 0 70 70%22%3E%3Ccircle cx=%2235%22 cy=%2235%22 r=%2232%22 fill=%22%23f7b8d0%22/%3E%3Ctext x=%2218%22 y=%2248%22 font-size=%2232%22 fill=%22%23333%22 font-family=%22Arial%22%3E🐻%3C/text%3E%3C/svg%3E'">
        </div>
        <div class="profile-info">
            <div class="profile-name" id="profileName">MANTO</div>
            <div class="profile-role" id="profileRole">男朋友</div>
        </div>
        <div class="profile-savings" id="savingsDisplay">
            <small>RM</small> 0.00
        </div>
    </div>

    <div class="filter-bar">
        <input type="date" id="filterDate" placeholder="日期">
        <select id="filterMethod">
            <option value="">全部方式</option>
            <option value="现金">现金</option>
            <option value="Touch N Go eWallet">Touch N Go eWallet</option>
            <option value="BankCard">BankCard</option>
            <option value="储蓄罐">储蓄罐</option>
        </select>
        <select id="filterType">
            <option value="">进账/开销</option>
            <option value="进账">进账</option>
            <option value="开销">开销</option>
        </select>
        <select id="filterExecutor">
            <option value="">执行人</option>
            <option value="MANTO">MANTO</option>
            <option value="GENTO">GENTO</option>
        </select>
        <button class="filter-btn" id="applyFilterBtn" type="button">✨ 筛选</button>
    </div>

    <div class="history-title">
        <span>📋 共同记录</span>
        <span style="font-size: 0.9rem; font-weight: 500; color: #b16f89;" id="recordCount">(0)</span>
    </div>

    <div class="history-list" id="historyList">
        <div class="loading-message">⏳ 加载中...</div>
    </div>
</div>

<div class="bottom-nav">
    <a href="cmain.html" class="nav-item active" id="navHome">🏠 HOME</a>
    <a href="crecord.html" class="nav-item" id="navRecord">📝 RECORD</a>
    <a href="cprofile.html" class="nav-item" id="navProfile">👤 PROFILE</a>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js"
    }
}
</script>

<script type="module">
    import { initializeApp } from 'firebase/app';
    import { getFirestore, collection, query, orderBy, onSnapshot, getDocs, where } from 'firebase/firestore';

    const firebaseConfig = {
        apiKey: "AIzaSyD_aW8osSZupLNTmaFXrPjAOcroX_2D7YQ",
        authDomain: "dailylife-5ad94.firebaseapp.com",
        projectId: "dailylife-5ad94",
        storageBucket: "dailylife-5ad94.firebasestorage.app",
        messagingSenderId: "783888781810",
        appId: "1:783888781810:web:d9dc08ab862b9935f29b6b",
        measurementId: "G-3T4P3CY0JH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ROLE_KEY = 'couple_role';
    const NAME_KEY = 'couple_name';
    const ICON_KEY = 'couple_icon';

    const role = localStorage.getItem(ROLE_KEY) || 'boy';
    const displayName = localStorage.getItem(NAME_KEY) || (role === 'boy' ? 'MANTO' : 'GENTO');
    const iconPath = localStorage.getItem(ICON_KEY) || (role === 'boy' ? '/gento.png' : '/manto.png');

    document.getElementById('profileAvatar').src = iconPath;
    document.getElementById('profileName').textContent = displayName;
    document.getElementById('profileRole').textContent = role === 'boy' ? '男朋友' : '女朋友';

    let allRecords = [];
    let unsubscribe = null;

    function renderHistory(filterOptions = {}) {
        const { date, method, type, executor } = filterOptions;

        let filtered = allRecords.filter(r => {
            if (date && r.date !== date) return false;
            if (method && r.method !== method) return false;
            if (type && r.type !== type) return false;
            if (executor && r.executor !== executor) return false;
            return true;
        });

        filtered.sort((a, b) => (a.date < b.date ? 1 : -1));

        const container = document.getElementById('historyList');
        const countSpan = document.getElementById('recordCount');

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-message">🌸 没有匹配的记录 · 换个筛选吧</div>`;
            countSpan.textContent = '(0)';
            return;
        }

        countSpan.textContent = `(${filtered.length})`;
        let html = '';
        filtered.forEach(r => {
            const isNegative = r.type === '开销';
            const amountClass = isNegative ? 'record-amount negative' : 'record-amount';
            const sign = isNegative ? '-' : '+';
            const emoji = isNegative ? '💸' : '💰';
            html += `
                <div class="record-item">
                    <div class="record-left">
                        <div class="record-category">
                            <span>${emoji} ${r.type}</span>
                            <span class="badge">${r.method || '其他'}</span>
                        </div>
                        <div class="record-note">${r.note || '无备注'}</div>
                        <div class="record-meta">
                            <span>📅 ${r.date || '未知日期'}</span>
                            <span>👤 ${r.executor || '未知'}</span>
                        </div>
                    </div>
                    <div class="${amountClass}">${sign} RM ${parseFloat(r.amount).toFixed(2)}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function updateSavings() {
        let total = 0;
        allRecords.forEach(r => {
            const amt = parseFloat(r.amount) || 0;
            if (r.type === '进账') total += amt;
            else if (r.type === '开销') total -= amt;
        });
        document.getElementById('savingsDisplay').innerHTML = `<small>RM</small> ${total.toFixed(2)}`;
    }

    // 监听 Firestore 实时更新
    function listenToRecords() {
        const recordsRef = collection(db, 'records');
        const q = query(recordsRef, orderBy('date', 'desc'));

        unsubscribe = onSnapshot(q, (snapshot) => {
            allRecords = [];
            snapshot.forEach((doc) => {
                allRecords.push({ id: doc.id, ...doc.data() });
            });
            updateSavings();
            // 应用当前筛选
            const date = document.getElementById('filterDate').value;
            const method = document.getElementById('filterMethod').value;
            const type = document.getElementById('filterType').value;
            const executor = document.getElementById('filterExecutor').value;
            renderHistory({ date, method, type, executor });
        }, (error) => {
            console.error('监听失败:', error);
            document.getElementById('historyList').innerHTML = 
                `<div class="empty-message">⚠️ 加载失败: ${error.message}</div>`;
        });
    }

    listenToRecords();

    document.getElementById('applyFilterBtn').addEventListener('click', function() {
        const date = document.getElementById('filterDate').value;
        const method = document.getElementById('filterMethod').value;
        const type = document.getElementById('filterType').value;
        const executor = document.getElementById('filterExecutor').value;
        renderHistory({ date, method, type, executor });
    });

    document.getElementById('applyFilterBtn').addEventListener('dblclick', function() {
        document.getElementById('filterDate').value = '';
        document.getElementById('filterMethod').value = '';
        document.getElementById('filterType').value = '';
        document.getElementById('filterExecutor').value = '';
        renderHistory({});
    });

    // 导航高亮
    document.getElementById('navHome').classList.add('active');
    document.getElementById('navRecord').classList.remove('active');
    document.getElementById('navProfile').classList.remove('active');

    console.log('🔥 cmain 已连接 Firestore');
</script>

</body>
</html>
