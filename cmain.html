<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>情侣储蓄 · 主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #f8edf0;
            background-image: radial-gradient(circle at 20% 30%, #fce8ef 0%, #f5dce6 100%);
            padding: 12px 12px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 248, 250, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 16px 16px 24px;
            box-shadow: 0 8px 40px rgba(200, 80, 120, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(145deg, #ffffff, #fdf5f8);
            border-radius: 20px;
            padding: 16px 16px 14px;
            box-shadow: 0 4px 16px rgba(255, 120, 160, 0.10);
            border: 1px solid #fadce8;
            margin-bottom: 18px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .avatar-frame {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid #f5b8cc;
            box-shadow: 0 2px 8px rgba(200, 80, 120, 0.12);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff5f9;
            flex-shrink: 0;
        }

        .avatar-frame img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            display: block;
        }

        .profile-info {
            flex: 1;
            min-width: 100px;
        }

        .profile-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #7a3a54;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .profile-role {
            font-size: 0.9rem;
            font-weight: 500;
            color: #b35d7e;
            background: #fceef4;
            padding: 2px 16px;
            border-radius: 12px;
            display: inline-block;
            border: 1px solid #f5b8cc;
            margin-top: 2px;
        }

        .profile-savings {
            margin-left: auto;
            background: #fce8ef;
            padding: 8px 14px 8px 18px;
            border-radius: 20px;
            border: 1.5px solid #f5b8cc;
            font-weight: 700;
            font-size: 1.4rem;
            color: #6b2f47;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .profile-savings small {
            font-size: 0.85rem;
            font-weight: 500;
            color: #ae6a84;
        }

        /* Filter Bar */
        .filter-bar {
            background: #fcf2f6;
            border-radius: 16px;
            padding: 8px 10px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            border: 1px solid #f5c8d8;
        }

        .filter-bar select,
        .filter-bar input {
            background: white;
            border: 1.5px solid #f5b8cc;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #5e3649;
            outline: none;
            flex: 1 0 auto;
            min-width: 70px;
            box-shadow: 0 1px 4px rgba(255, 120, 160, 0.06);
            transition: 0.1s ease;
            touch-action: manipulation;
            appearance: auto;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #e89bb5;
            box-shadow: 0 0 0 3px rgba(232, 155, 181, 0.2);
        }

        .filter-bar .filter-btn {
            background: #f5a8c0;
            border: none;
            border-radius: 12px;
            padding: 6px 18px;
            font-weight: 600;
            color: #4e283b;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 2px 8px rgba(200, 80, 120, 0.12);
            flex: 0 0 auto;
            touch-action: manipulation;
            border: 1px solid #f598b5;
        }

        .filter-bar .filter-btn:active {
            transform: scale(0.96);
        }

        /* History */
        .history-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #77445c;
            padding-left: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 6px;
        }

        .record-item {
            background: white;
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(200, 80, 120, 0.06);
            border: 1px solid #f5dce6;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .record-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            min-width: 0;
        }

        .record-category {
            font-weight: 600;
            font-size: 0.95rem;
            color: #3f2432;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .record-category .badge {
            background: #fce8ef;
            border-radius: 10px;
            padding: 0 10px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #8f4b68;
            border: 1px solid #f5b8cc;
        }

        .record-note {
            font-size: 0.85rem;
            color: #694c5b;
            font-weight: 400;
        }

        .record-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            font-size: 0.7rem;
            color: #956d7e;
            font-weight: 400;
            margin-top: 2px;
        }

        .record-amount {
            font-weight: 700;
            font-size: 1.2rem;
            color: #992f57;
            background: #fce8ef;
            padding: 4px 14px;
            border-radius: 12px;
            border: 1px solid #f5b8cc;
            white-space: nowrap;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .record-amount.negative {
            color: #c44f6a;
            background: #fce8ef;
        }

        .empty-message {
            text-align: center;
            padding: 32px 16px;
            background: #fcf2f6;
            border-radius: 16px;
            color: #aa748b;
            font-weight: 500;
            border: 1px dashed #f5b8cc;
        }

        .loading-message {
            text-align: center;
            padding: 24px 16px;
            color: #aa748b;
            font-weight: 500;
        }

        /* iOS-style Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 248, 250, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(200, 80, 120, 0.15);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 10px;
            padding-bottom: env(safe-area-inset-bottom, 10px);
            box-shadow: 0 -2px 20px rgba(200, 80, 120, 0.06);
            max-width: 420px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            border-radius: 24px 24px 0 0;
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 16px;
            border-radius: 16px;
            transition: all 0.15s ease;
            touch-action: manipulation;
            min-width: 56px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .nav-item .nav-icon {
            font-size: 1.6rem;
            line-height: 1.4;
            color: #b88b9c;
            transition: color 0.15s ease;
        }

        .nav-item .nav-label {
            font-size: 0.6rem;
            font-weight: 600;
            color: #b88b9c;
            letter-spacing: 0.3px;
            transition: color 0.15s ease;
        }

        .nav-item.active .nav-icon {
            color: #c96d8b;
        }

        .nav-item.active .nav-label {
            color: #c96d8b;
        }

        .nav-item:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Profile Card -->
    <div class="profile-card">
        <div class="avatar-frame">
            <img id="profileAvatar" src="/gento.png" alt="头像" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2270%22 height=%2270%22 viewBox=%220 0 70 70%22%3E%3Ccircle cx=%2235%22 cy=%2235%22 r=%2232%22 fill=%22%23f7b8d0%22/%3E%3Ctext x=%2218%22 y=%2248%22 font-size=%2232%22 fill=%22%23333%22 font-family=%22Arial%22%3E🐻%3C/text%3E%3C/svg%3E'">
        </div>
        <div class="profile-info">
            <div class="profile-name" id="profileName">GENTO</div>
            <div class="profile-role" id="profileRole">男朋友</div>
        </div>
        <div class="profile-savings" id="savingsDisplay">
            <small>RM</small> 0.00
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <input type="date" id="filterDate">
        <select id="filterMethod">
            <option value="">全部方式</option>
            <option value="现金">现金</option>
            <option value="Touch N Go eWallet">Touch N Go</option>
            <option value="BankCard">BankCard</option>
            <option value="储蓄罐">储蓄罐</option>
        </select>
        <select id="filterType">
            <option value="">进账/开销</option>
            <option value="进账">进账</option>
            <option value="开销">开销</option>
        </select>
        <select id="filterExecutor">
            <option value="">执行人</option>
            <option value="GENTO">GENTO</option>
            <option value="MANTO">MANTO</option>
        </select>
        <button class="filter-btn" id="applyFilterBtn" type="button">筛选</button>
    </div>

    <!-- History -->
    <div class="history-title">
        <span>📋 共同记录</span>
        <span style="font-size: 0.8rem; font-weight: 500; color: #b16f89;" id="recordCount">(0)</span>
    </div>

    <div class="history-list" id="historyList">
        <div class="loading-message">⏳ 加载中...</div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <a href="cmain.html" class="nav-item active" id="navHome">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">主页</span>
    </a>
    <a href="crecord.html" class="nav-item" id="navRecord">
        <span class="nav-icon">📝</span>
        <span class="nav-label">记录</span>
    </a>
    <a href="cprofile.html" class="nav-item" id="navProfile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">我的</span>
    </a>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js"
    }
}
</script>

<script type="module">
    import { initializeApp } from 'firebase/app';
    import { getFirestore, collection, query, orderBy, onSnapshot } from 'firebase/firestore';

    const firebaseConfig = {
        apiKey: "AIzaSyD_aW8osSZupLNTmaFXrPjAOcroX_2D7YQ",
        authDomain: "dailylife-5ad94.firebaseapp.com",
        projectId: "dailylife-5ad94",
        storageBucket: "dailylife-5ad94.firebasestorage.app",
        messagingSenderId: "783888781810",
        appId: "1:783888781810:web:d9dc08ab862b9935f29b6b",
        measurementId: "G-3T4P3CY0JH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ROLE_KEY = 'couple_role';
    const NAME_KEY = 'couple_name';
    const ICON_KEY = 'couple_icon';

    const role = localStorage.getItem(ROLE_KEY) || 'boy';
    const displayName = localStorage.getItem(NAME_KEY) || (role === 'boy' ? 'GENTO' : 'MANTO');
    const iconPath = localStorage.getItem(ICON_KEY) || (role === 'boy' ? '/gento.png' : '/manto.png');

    document.getElementById('profileAvatar').src = iconPath;
    document.getElementById('profileName').textContent = displayName;
    document.getElementById('profileRole').textContent = role === 'boy' ? '男朋友' : '女朋友';

    // 设置日期默认值
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('filterDate').value = '';

    let allRecords = [];

    function renderHistory(filterOptions = {}) {
        const { date, method, type, executor } = filterOptions;

        let filtered = allRecords.filter(r => {
            if (date && r.date !== date) return false;
            if (method && r.method !== method) return false;
            if (type && r.type !== type) return false;
            if (executor && r.executor !== executor) return false;
            return true;
        });

        filtered.sort((a, b) => (a.date < b.date ? 1 : -1));

        const container = document.getElementById('historyList');
        const countSpan = document.getElementById('recordCount');

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-message">🌸 还没有记录，添加一笔吧</div>`;
            countSpan.textContent = '(0)';
            return;
        }

        countSpan.textContent = `(${filtered.length})`;
        let html = '';
        filtered.forEach(r => {
            const isNegative = r.type === '开销';
            const amountClass = isNegative ? 'record-amount negative' : 'record-amount';
            const sign = isNegative ? '-' : '+';
            const icon = isNegative ? '💸' : '💰';
            html += `
                <div class="record-item">
                    <div class="record-left">
                        <div class="record-category">
                            <span>${icon} ${r.type}</span>
                            <span class="badge">${r.method || '其他'}</span>
                        </div>
                        <div class="record-note">${r.note || '无备注'}</div>
                        <div class="record-meta">
                            <span>📅 ${r.date || '未知日期'}</span>
                            <span>👤 ${r.executor || '未知'}</span>
                        </div>
                    </div>
                    <div class="${amountClass}">${sign} RM ${parseFloat(r.amount).toFixed(2)}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function updateSavings() {
        let total = 0;
        allRecords.forEach(r => {
            const amt = parseFloat(r.amount) || 0;
            if (r.type === '进账') total += amt;
            else if (r.type === '开销') total -= amt;
        });
        document.getElementById('savingsDisplay').innerHTML = `<small>RM</small> ${total.toFixed(2)}`;
    }

    function listenToRecords() {
        const recordsRef = collection(db, 'records');
        const q = query(recordsRef, orderBy('date', 'desc'));

        onSnapshot(q, (snapshot) => {
            allRecords = [];
            snapshot.forEach((doc) => {
                allRecords.push({ id: doc.id, ...doc.data() });
            });
            updateSavings();
            const date = document.getElementById('filterDate').value;
            const method = document.getElementById('filterMethod').value;
            const type = document.getElementById('filterType').value;
            const executor = document.getElementById('filterExecutor').value;
            renderHistory({ date, method, type, executor });
        }, (error) => {
            document.getElementById('historyList').innerHTML = 
                `<div class="empty-message">⚠️ 加载失败: ${error.message}</div>`;
        });
    }

    listenToRecords();

    document.getElementById('applyFilterBtn').addEventListener('click', function() {
        const date = document.getElementById('filterDate').value;
        const method = document.getElementById('filterMethod').value;
        const type = document.getElementById('filterType').value;
        const executor = document.getElementById('filterExecutor').value;
        renderHistory({ date, method, type, executor });
    });

    document.getElementById('applyFilterBtn').addEventListener('dblclick', function() {
        document.getElementById('filterDate').value = '';
        document.getElementById('filterMethod').value = '';
        document.getElementById('filterType').value = '';
        document.getElementById('filterExecutor').value = '';
        renderHistory({});
    });

    // 导航高亮
    document.getElementById('navHome').classList.add('active');
</script>

</body>
</html>
