<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>情侣储蓄 · 主页</title>
    <style>
        /* 可爱风重置 & 全局 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #ffecf2;
            background-image: radial-gradient(circle at 20% 30%, #ffe2ed 0%, #ffd6e4 100%);
            padding: 16px 16px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主容器 — 仿手机卡片 */
        .app-container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 245, 248, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 48px 48px 32px 32px;
            padding: 20px 18px 30px;
            box-shadow: 0 20px 40px rgba(200, 80, 120, 0.15), 0 8px 20px rgba(255, 150, 180, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            position: relative;
        }

        /* ----- 卡片 (profile card) ----- */
        .profile-card {
            background: linear-gradient(145deg, #ffffff, #fff5f9);
            border-radius: 40px;
            padding: 20px 18px 18px;
            box-shadow: 0 12px 20px rgba(255, 120, 160, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            border: 2px solid #ffdae6;
            margin-bottom: 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            background: #ffdae6;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffb0cb;
            box-shadow: 0 6px 0 #e89bb5;
            flex-shrink: 0;
        }

        .avatar-frame img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(150, 50, 80, 0.2));
        }

        .profile-info {
            flex: 1;
            min-width: 140px;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            color: #822f4f;
            letter-spacing: 2px;
            line-height: 1.1;
            text-shadow: 2px 2px 0 #ffc1d4;
        }

        .profile-role {
            font-size: 1.1rem;
            font-weight: 600;
            color: #b35d7e;
            background: #ffeef4;
            padding: 2px 18px;
            border-radius: 40px;
            display: inline-block;
            border: 1.5px solid #ff9bbb;
            margin-top: 4px;
        }

        .profile-savings {
            margin-left: auto;
            background: #fee7f0;
            padding: 10px 18px 10px 20px;
            border-radius: 60px;
            border: 2px solid #ffb7cf;
            box-shadow: inset 0 2px 6px rgba(255, 200, 220, 0.5);
            font-weight: 700;
            font-size: 1.6rem;
            color: #6b2f47;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .profile-savings small {
            font-size: 1rem;
            font-weight: 500;
            color: #ae6a84;
        }

        /* ----- 筛选栏 (filter bar) ----- */
        .filter-bar {
            background: #fff2f7;
            border-radius: 60px;
            padding: 8px 12px;
            margin-bottom: 22px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 8px;
            border: 2px solid #ffc1d4;
            box-shadow: 0 4px 0 #e8aec2;
        }

        .filter-bar select, .filter-bar input {
            background: white;
            border: 1.5px solid #ffb7cf;
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #5e3649;
            outline: none;
            flex: 1 0 auto;
            min-width: 90px;
            box-shadow: 0 2px 4px rgba(255, 120, 160, 0.1);
            transition: 0.1s ease;
        }

        .filter-bar select:focus, .filter-bar input:focus {
            border-color: #f58eb0;
            box-shadow: 0 0 0 3px #ffd0e0;
        }

        .filter-bar .filter-btn {
            background: #ff9fbb;
            border: none;
            border-radius: 60px;
            padding: 8px 22px;
            font-weight: 700;
            color: #4e283b;
            font-size: 0.95rem;
            border-bottom: 5px solid #c96d8b;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 2px 6px rgba(200, 80, 120, 0.2);
            flex: 0 0 auto;
        }

        .filter-bar .filter-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* ----- 历史记录列表 ----- */
        .history-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #77445c;
            padding-left: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 10px;
        }

        /* 每个记录卡片 */
        .record-item {
            background: white;
            border-radius: 28px;
            padding: 14px 18px;
            box-shadow: 0 6px 0 #efb9cd, 0 8px 16px rgba(200, 80, 120, 0.12);
            border: 2px solid #ffdae6;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            transition: 0.1s ease;
        }

        .record-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .record-category {
            font-weight: 700;
            font-size: 1.1rem;
            color: #3f2432;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .record-category .badge {
            background: #fee1eb;
            border-radius: 40px;
            padding: 0 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #8f4b68;
            border: 1px solid #ffb7cf;
        }

        .record-note {
            font-size: 0.95rem;
            color: #694c5b;
            font-weight: 500;
        }

        .record-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            font-size: 0.8rem;
            color: #956d7e;
            font-weight: 500;
            margin-top: 4px;
        }

        .record-amount {
            font-weight: 800;
            font-size: 1.6rem;
            color: #992f57;
            background: #ffeeef;
            padding: 6px 18px;
            border-radius: 60px;
            border: 2px solid #ffb7cf;
            white-space: nowrap;
            margin-left: 6px;
        }

        .record-amount.negative {
            color: #c44f6a;
            background: #ffe3e9;
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            background: #fff2f7;
            border-radius: 60px;
            color: #aa748b;
            font-weight: 600;
            border: 2px dashed #ffb7cf;
        }

        /* ----- 底部导航栏 ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffecf2;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 3px solid #ffc1d4;
            display: flex;
            justify-content: space-around;
            padding: 12px 12px 18px;
            box-shadow: 0 -6px 20px rgba(255, 120, 160, 0.2);
            border-radius: 40px 40px 0 0;
            max-width: 440px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-item {
            text-decoration: none;
            font-weight: 700;
            color: #9d5b78;
            background: #ffe2ed;
            padding: 8px 24px;
            border-radius: 60px;
            border: 2px solid #ffb7cf;
            font-size: 1rem;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #d68ca8;
            display: inline-block;
            text-align: center;
            min-width: 70px;
        }

        .nav-item:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #d68ca8;
        }

        .nav-item.active {
            background: #ffb7cf;
            color: #582f40;
            border-color: #f58eb0;
            box-shadow: 0 4px 0 #b86f8a;
        }

        /* 辅助 */
        .flex-center { display: flex; align-items: center; gap: 4px; }
        .mt-1 { margin-top: 6px; }
        .w-full { width: 100%; }
    </style>
</head>
<body>

<div class="app-container" id="mainApp">
    <!-- 卡片区域 -->
    <div class="profile-card" id="profileCard">
        <div class="avatar-frame" id="avatarFrame">
            <img id="profileAvatar" src="/gento.png" alt="头像" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2270%22 height=%2270%22 viewBox=%220 0 70 70%22%3E%3Ccircle cx=%2235%22 cy=%2235%22 r=%2232%22 fill=%22%23f7b8d0%22/%3E%3Ctext x=%2218%22 y=%2248%22 font-size=%2232%22 fill=%22%23333%22 font-family=%22Arial%22%3E🐻%3C/text%3E%3C/svg%3E'">
        </div>
        <div class="profile-info">
            <div class="profile-name" id="profileName">MANTO</div>
            <div class="profile-role" id="profileRole">男朋友</div>
        </div>
        <div class="profile-savings" id="savingsDisplay">
            <small>RM</small> 0.00
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
        <input type="date" id="filterDate" placeholder="日期" title="筛选日期">
        <select id="filterMethod">
            <option value="">全部方式</option>
            <option value="现金">现金</option>
            <option value="Touch N Go eWallet">Touch N Go eWallet</option>
            <option value="BankCard">BankCard</option>
            <option value="储蓄罐">储蓄罐</option>
        </select>
        <select id="filterType">
            <option value="">进账/开销</option>
            <option value="进账">进账</option>
            <option value="开销">开销</option>
        </select>
        <select id="filterExecutor">
            <option value="">执行人</option>
            <option value="MANTO">MANTO</option>
            <option value="GENTO">GENTO</option>
        </select>
        <button class="filter-btn" id="applyFilterBtn">✨ 筛选</button>
    </div>

    <!-- 历史记录标题 -->
    <div class="history-title">
        <span>📋 共同记录</span>
        <span style="font-size: 0.9rem; font-weight: 500; color: #b16f89;" id="recordCount">(0)</span>
    </div>

    <!-- 历史列表容器 -->
    <div class="history-list" id="historyList">
        <!-- 动态渲染 -->
        <div class="empty-message">💭 还没有记录，添加一笔吧</div>
    </div>
</div>

<!-- 底部导航栏 -->
<div class="bottom-nav">
    <a href="cmain.html" class="nav-item active" id="navHome">🏠 HOME</a>
    <a href="crecord.html" class="nav-item" id="navRecord">📝 RECORD</a>
    <a href="cprofile.html" class="nav-item" id="navProfile">👤 PROFILE</a>
</div>

<script>
    (function() {
        // ---------- 读取本地存储 ----------
        const ROLE_KEY = 'couple_role';
        const NAME_KEY = 'couple_name';
        const ICON_KEY = 'couple_icon';
        const STORAGE_KEY = 'couple_records';  // 存储所有记录

        const role = localStorage.getItem(ROLE_KEY) || 'boy';
        const displayName = localStorage.getItem(NAME_KEY) || (role === 'boy' ? 'MANTO' : 'GENTO');
        let iconPath = localStorage.getItem(ICON_KEY) || (role === 'boy' ? '/gento.png' : '/manto.png');

        // 角色中文
        const roleChinese = role === 'boy' ? '男朋友' : '女朋友';

        // 头像、名字、角色
        document.getElementById('profileAvatar').src = iconPath;
        document.getElementById('profileName').textContent = displayName;
        document.getElementById('profileRole').textContent = roleChinese;

        // ---------- 模拟/存储记录 ----------
        // 若无记录则生成几条可爱的示例 (情侣共同)
        function getDefaultRecords() {
            return [
                { id: '1', type: '进账', note: '💖 一起存钱', amount: 200, method: '现金', executor: 'MANTO', date: '2026-07-01' },
                { id: '2', type: '开销', note: '🍜 晚餐约会', amount: 45, method: 'Touch N Go eWallet', executor: 'GENTO', date: '2026-07-02' },
                { id: '3', type: '进账', note: '🎁 奖励金', amount: 100, method: 'BankCard', executor: 'GENTO', date: '2026-07-03' },
                { id: '4', type: '开销', note: '🎬 电影票', amount: 35, method: '储蓄罐', executor: 'MANTO', date: '2026-07-04' },
            ];
        }

        let records = [];
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try { records = JSON.parse(stored); } catch(e) { records = getDefaultRecords(); }
        } else {
            records = getDefaultRecords();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        // 确保每条记录有 id (如果没有则补)
        records = records.map((r, idx) => ({ ...r, id: r.id || String(idx + 1) }));

        // 保存至localStorage
        function saveRecords() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        // ---------- 计算总储蓄 ----------
        function calcTotal() {
            let total = 0;
            records.forEach(r => {
                const amt = parseFloat(r.amount) || 0;
                if (r.type === '进账') total += amt;
                else if (r.type === '开销') total -= amt;
            });
            return total;
        }

        function updateSavings() {
            const total = calcTotal();
            document.getElementById('savingsDisplay').innerHTML = `<small>RM</small> ${total.toFixed(2)}`;
        }
        updateSavings();

        // ---------- 渲染历史记录 (带筛选) ----------
        function renderHistory(filterOptions = {}) {
            const { date, method, type, executor } = filterOptions;

            let filtered = records.filter(r => {
                // 日期筛选 (如果date有值)
                if (date && r.date !== date) return false;
                if (method && r.method !== method) return false;
                if (type && r.type !== type) return false;
                if (executor && r.executor !== executor) return false;
                return true;
            });

            // 按日期排序 (最新的在前)
            filtered.sort((a, b) => (a.date < b.date ? 1 : -1));

            const container = document.getElementById('historyList');
            const countSpan = document.getElementById('recordCount');

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-message">🌸 没有匹配的记录 · 换个筛选吧</div>`;
                countSpan.textContent = '(0)';
                return;
            }

            countSpan.textContent = `(${filtered.length})`;

            let html = '';
            filtered.forEach(r => {
                const isNegative = r.type === '开销';
                const amountClass = isNegative ? 'record-amount negative' : 'record-amount';
                const sign = isNegative ? '-' : '+';
                const emoji = isNegative ? '💸' : '💰';
                html += `
                    <div class="record-item">
                        <div class="record-left">
                            <div class="record-category">
                                <span>${emoji} ${r.type}</span>
                                <span class="badge">${r.method || '其他'}</span>
                            </div>
                            <div class="record-note">${r.note || '无备注'}</div>
                            <div class="record-meta">
                                <span>📅 ${r.date || '未知日期'}</span>
                                <span>👤 ${r.executor || '未知'}</span>
                            </div>
                        </div>
                        <div class="${amountClass}">${sign} RM ${parseFloat(r.amount).toFixed(2)}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 初次渲染 (无筛选)
        renderHistory();

        // ---------- 筛选按钮事件 ----------
        document.getElementById('applyFilterBtn').addEventListener('click', function() {
            const date = document.getElementById('filterDate').value;
            const method = document.getElementById('filterMethod').value;
            const type = document.getElementById('filterType').value;
            const executor = document.getElementById('filterExecutor').value;

            renderHistory({ date, method, type, executor });
        });

        // 清除筛选的简易方式: 点击时若有空值自动全部 (但保留默认)
        // 额外：重置筛选 (双击filter按钮 重置为全部)
        document.getElementById('applyFilterBtn').addEventListener('dblclick', function() {
            document.getElementById('filterDate').value = '';
            document.getElementById('filterMethod').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterExecutor').value = '';
            renderHistory();
        });

        // 存储更新函数暴露给其他页面? (不需要)
        console.log('💕 cmain 加载完成, 当前角色:', role, displayName);

        // 监听存储变化 (其他页面修改时刷新)
        window.addEventListener('storage', function(e) {
            if (e.key === STORAGE_KEY) {
                const newData = localStorage.getItem(STORAGE_KEY);
                if (newData) {
                    try { records = JSON.parse(newData); } catch(e) {}
                    updateSavings();
                    // 重新应用当前筛选 (保留筛选栏的值)
                    const date = document.getElementById('filterDate').value;
                    const method = document.getElementById('filterMethod').value;
                    const type = document.getElementById('filterType').value;
                    const executor = document.getElementById('filterExecutor').value;
                    renderHistory({ date, method, type, executor });
                }
            }
            // 如果角色变更 (很少发生)
            if (e.key === ROLE_KEY || e.key === NAME_KEY || e.key === ICON_KEY) {
                // 简单刷新头像名字
                const newRole = localStorage.getItem(ROLE_KEY) || 'boy';
                const newName = localStorage.getItem(NAME_KEY) || (newRole === 'boy' ? 'MANTO' : 'GENTO');
                const newIcon = localStorage.getItem(ICON_KEY) || (newRole === 'boy' ? '/gento.png' : '/manto.png');
                document.getElementById('profileAvatar').src = newIcon;
                document.getElementById('profileName').textContent = newName;
                document.getElementById('profileRole').textContent = newRole === 'boy' ? '男朋友' : '女朋友';
            }
        });

        // 导航高亮 (cmain 自身 active)
        document.getElementById('navHome').classList.add('active');
        document.getElementById('navRecord').classList.remove('active');
        document.getElementById('navProfile').classList.remove('active');
    })();
</script>
</body>
</html>
