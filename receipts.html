<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MXW01 Web Bluetooth 打印测试 (56字节标准包修正版)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    button { padding: 10px 16px; font-size: 14px; margin-right: 10px; cursor: pointer; }
    #log { background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 10px; height: 280px; overflow-y: auto; border-radius: 4px; }
    canvas { border: 1px dashed #aaa; margin-top: 10px; display: block; }
  </style>
</head>
<body>

  <h2>MXW01 热敏打印机 Web BLE 调试工具 (56字节标准包)</h2>

  <div class="card">
    <button id="btnConnect">1. 连接 MXW01 打印机</button>
    <button id="btnTestPrint" disabled>2. 发送测试打印</button>
    <p>状态: <span id="status" style="font-weight: bold; color: orange;">未连接</span></p>
  </div>

  <div class="card">
    <h3>打印画布预览 (宽度 384px)</h3>
    <canvas id="printCanvas" width="384" height="120"></canvas>
  </div>

  <div class="card">
    <h3>蓝牙日志</h3>
    <div id="log"></div>
  </div>

  <script>
    const PRINTER_SERVICE_UUID = '0000af30-0000-1000-8000-00805f9b34fb';
    const WRITE_CHAR_UUID     = '0000ae01-0000-1000-8000-00805f9b34fb';
    const NOTIFY_CHAR_UUID    = '0000ae02-0000-1000-8000-00805f9b34fb';

    let bluetoothDevice = null;
    let writeCharacteristic = null;
    let notifyCharacteristic = null;

    const btnConnect = document.getElementById('btnConnect');
    const btnTestPrint = document.getElementById('btnTestPrint');
    const statusText = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const canvas = document.getElementById('printCanvas');
    const ctx = canvas.getContext('2d');

    drawSamplePattern();

    function log(msg, type = 'info') {
      const color = type === 'err' ? '#ff5555' : type === 'reply' ? '#55ffff' : '#00ff00';
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function drawSamplePattern() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 24px monospace';
      ctx.fillText('MXW01 TEST PRINT', 20, 40);
      
      ctx.font = '16px sans-serif';
      ctx.fillText('Web Bluetooth OK! - ' + new Date().toLocaleDateString(), 20, 70);
      
      ctx.fillRect(20, 90, 344, 4);
    }

    // ----------------------------------------------------
    // 1. BLE 设备连接与 Notify 监听
    // ----------------------------------------------------
    btnConnect.addEventListener('click', async () => {
      try {
        log('正在扫描 BLE 设备...');
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [PRINTER_SERVICE_UUID, '0000ae30-0000-1000-8000-00805f9b34fb']
        });

        log(`建立 GATT 连接中: ${bluetoothDevice.name || 'MXW01'}...`);
        const server = await bluetoothDevice.gatt.connect();

        let service;
        try {
          service = await server.getPrimaryService(PRINTER_SERVICE_UUID);
        } catch (e) {
          service = await server.getPrimaryService('0000ae30-0000-1000-8000-00805f9b34fb');
        }

        writeCharacteristic = await service.getCharacteristic(WRITE_CHAR_UUID);
        notifyCharacteristic = await service.getCharacteristic(NOTIFY_CHAR_UUID);

        await notifyCharacteristic.startNotifications();
        notifyCharacteristic.addEventListener('characteristicvaluechanged', handleNotify);

        statusText.innerText = '✅ 已连接 (' + (bluetoothDevice.name || 'MXW01') + ')';
        statusText.style.color = 'green';
        btnTestPrint.disabled = false;
        log('✅ 打印机绑定完成，可以开始打印！');

      } catch (err) {
        log('连接失败: ' + err.message, 'err');
      }
    });

    function handleNotify(event) {
      const value = new Uint8Array(event.target.value.buffer);
      const hexStr = Array.from(value).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ');
      
      if (value[2] === 0xA1 || value[2] === 0xA3) {
        if (value[3] === 0x00) {
          log(`📩 收到 ACK (成功 0x00): ${hexStr}`, 'reply');
        } else if (value[3] === 0x03) {
          log(`⚠️ 收到 ACK (错误 0x03 - 参数异常): ${hexStr}`, 'err');
        } else {
          log(`📩 收到 ACK: ${hexStr}`, 'reply');
        }
      } else {
        log(`📩 收到系统回复: ${hexStr}`, 'reply');
      }
    }

    // ----------------------------------------------------
    // 2. 打印控制流程
    // ----------------------------------------------------
    btnTestPrint.addEventListener('click', async () => {
      if (!writeCharacteristic) return;

      try {
        btnTestPrint.disabled = true;
        log('▶️ 开始下发 MXW01 完整打印序列...');

        // Step 1: 查询打印机状态
        await sendCmd(new Uint8Array([0x22, 0x21, 0xA0, 0x00, 0x00, 0x00, 0xA0]));
        await delay(100);

        // Step 2: 发送开启任务指令 (Start Print Job - 0xA3)
        log('下发开始打印任务指令 (0xA3)...');
        await sendCmd(new Uint8Array([0x22, 0x21, 0xA3, 0x5F, 0x00, 0x00, 0xFC]));
        await delay(100);

        // Step 3: 构建并发送 56 字节标准 0xA1 位图点阵数据
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const packets = buildMXW01BitmapPackets(imgData);

        log(`下发位图像素包 (共 ${packets.length} 行)...`);
        for (let i = 0; i < packets.length; i++) {
          await sendCmd(packets[i]);
          await delay(25); // 25ms 延迟，给固件留出 FIFO 处理时间
        }

        // Step 4: 发送走纸与结束任务指令
        log('发送走纸收尾指令...');
        await sendCmd(buildFeedPacket(60));
        await delay(100);

        // 结束打印任务
        await sendCmd(new Uint8Array([0x22, 0x21, 0xA3, 0x00, 0x00, 0x00, 0xA3]));

        log('🎉 打印序列下发完毕！');

      } catch (err) {
        log('打印过程出错: ' + err.message, 'err');
      } finally {
        btnTestPrint.disabled = false;
      }
    });

    // ----------------------------------------------------
    // 3. 56字节标准包位图打包算法 (双字节 CRC16)
    // ----------------------------------------------------
    function buildMXW01BitmapPackets(imageData) {
      const width = imageData.width;   // 384px
      const height = imageData.height;
      const bytesPerLine = 48;         // 384 / 8 = 48 字节
      const pixels = imageData.data;
      const packets = [];

      for (let row = 0; row < height; row++) {
        const lineBytes = new Uint8Array(bytesPerLine);

        for (let col = 0; col < width; col++) {
          const idx = (row * width + col) * 4;
          const r = pixels[idx];
          const g = pixels[idx + 1];
          const b = pixels[idx + 2];
          const isBlack = (r * 0.299 + g * 0.587 + b * 0.114) < 128;

          if (isBlack) {
            const byteIdx = Math.floor(col / 8);
            const bitIdx = 7 - (col % 8);
            lineBytes[byteIdx] |= (1 << bitIdx);
          }
        }

        // 标准 56 字节包结构:
        // [0..1] Header (0x22, 0x21)
        // [2] Cmd (0xA1)
        // [3] Mode (0x00: 点阵透传模式)
        // [4..5] Data Length (0x30, 0x00 -> 48 字节)
        // [6..53] 48 字节位图点阵
        // [54..55] CRC16 Checksum
        const packet = new Uint8Array(56);
        
        packet[0] = 0x22;
        packet[1] = 0x21;
        packet[2] = 0xA1;
        packet[3] = 0x00; // 模式标志：0x00 (原始 Raw 点阵模式)
        
        packet[4] = 0x30; // 长度 LSB: 48 字节
        packet[5] = 0x00; // 长度 MSB

        // 填充 48 字节像素点阵
        packet.set(lineBytes, 6);

        // 计算 CRC16-CCITT (0x1021) 放置于包尾 [54..55]
        let crc = 0x0000;
        for (let i = 2; i < 54; i++) {
          crc ^= (packet[i] << 8);
          for (let j = 0; j < 8; j++) {
            if (crc & 0x8000) {
              crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
            } else {
              crc = (crc << 1) & 0xFFFF;
            }
          }
        }

        packet[54] = crc & 0xFF;        // CRC LSB
        packet[55] = (crc >> 8) & 0xFF; // CRC MSB

        packets.push(packet);
      }

      return packets;
    }

    function buildFeedPacket(distancePx) {
      const packet = new Uint8Array(8);
      packet[0] = 0x22;
      packet[1] = 0x21;
      packet[2] = 0xA1;
      packet[3] = 0x30; // Feed 指令 SubCmd
      packet[4] = distancePx & 0xFF;
      packet[5] = (distancePx >> 8) & 0xFF;
      packet[6] = 0x00;
      packet[7] = 0x1D; // 固定 Checksum
      return packet;
    }

    async function sendCmd(uint8Array) {
      if (!writeCharacteristic) return;
      await writeCharacteristic.writeValue(uint8Array);
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
