<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MXW01 打印机 Web 蓝牙直连测试</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    button { padding: 10px 16px; font-size: 14px; margin-right: 8px; margin-bottom: 8px; cursor: pointer; }
    #log { background: #1e1e1e; color: #00ff00; padding: 12px; font-family: monospace; height: 280px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>MXW01 蓝牙打印机测试</h2>
  
  <div>
    <button id="btnConnect">1. 连接蓝牙打印机</button>
    <button id="btnPrintDemo" disabled>2. 打印测试图案并走纸</button>
    <button id="btnFeed" disabled>3. 单独走纸 50 点</button>
  </div>

  <h4>通信日志：</h4>
  <div id="log">请使用 Chrome / Edge 浏览器，点击连接按钮...<br></div>

  <script>
    const SERVICE_UUID = 0xAE30;
    const WRITE_CHAR_UUID = 0xAE01;
    const NOTIFY_CHAR_UUID = 0xAE02;

    let device, writeCharacteristic, notifyCharacteristic;

    function log(msg, type = 'INFO') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `[${time}] [${type}] ${msg}\n`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // CRC8 计算
    function calcCRC8(data) {
      let crc = 0x00;
      for (let i = 0; i < data.length; i++) {
        crc ^= data[i];
        for (let j = 0; j < 8; j++) {
          if (crc & 0x80) {
            crc = ((crc << 1) ^ 0x07) & 0xFF;
          } else {
            crc = (crc << 1) & 0xFF;
          }
        }
      }
      return crc;
    }

    // 构造 V5C 数据包
    function makeV5CPacket(opcode, payload = new Uint8Array(0)) {
      const prefix = [0x22, 0x21];
      const payloadLen = payload.length;
      const packet = new Uint8Array(2 + 1 + 1 + 2 + payloadLen + 1);
      
      packet[0] = prefix[0];
      packet[1] = prefix[1];
      packet[2] = opcode;
      packet[3] = 0x00;
      
      packet[4] = payloadLen & 0xFF;
      packet[5] = (payloadLen >> 8) & 0xFF;
      
      packet.set(payload, 6);
      
      const bytesToCrc = packet.subarray(2, 6 + payloadLen);
      packet[6 + payloadLen] = calcCRC8(bytesToCrc);
      
      return packet;
    }

    // 延时辅助函数
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    // 1. 连接蓝牙
    document.getElementById('btnConnect').addEventListener('click', async () => {
      try {
        log('正在搜索蓝牙设备...');
        device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID, '0000ae30-0000-1000-8000-00805f9b34fb']
        });

        log(`已选择设备: ${device.name || 'MXW01'}`);
        const server = await device.gatt.connect();
        log('GATT 服务已连接');

        let service;
        try {
          service = await server.getPrimaryService(SERVICE_UUID);
        } catch {
          service = await server.getPrimaryService('0000ae30-0000-1000-8000-00805f9b34fb');
        }

        writeCharacteristic = await service.getCharacteristic(WRITE_CHAR_UUID);
        
        try {
          notifyCharacteristic = await service.getCharacteristic(NOTIFY_CHAR_UUID);
          await notifyCharacteristic.startNotifications();
          notifyCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
            const val = new Uint8Array(e.target.value.buffer);
            const hexStr = Array.from(val).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ');
            log(`<< 收到返回: ${hexStr}`, 'RECV');
          });
        } catch (e) {}

        document.getElementById('btnPrintDemo').disabled = false;
        document.getElementById('btnFeed').disabled = false;
        log('蓝牙准备就绪！', 'SUCCESS');

      } catch (err) {
        log(`连接失败: ${err.message}`, 'ERROR');
      }
    });

    // 2. 发送打印位图 + 自动走纸指令
    document.getElementById('btnPrintDemo').addEventListener('click', async () => {
      try {
        log('--- 开始发送打印任务 ---');
        
        // A. 准备 20 行测试位图 (交叉黑白线)
        for (let lineIndex = 0; lineIndex < 20; lineIndex++) {
          const lineData = new Uint8Array(48);
          lineData.fill(lineIndex % 2 === 0 ? 0xFF : 0x00); // 实线与空白交替
          
          const payload = new Uint8Array(2 + 48);
          payload[0] = lineIndex & 0xFF;
          payload[1] = (lineIndex >> 8) & 0xFF;
          payload.set(lineData, 2);

          const packet = makeV5CPacket(0xA1, payload);
          await writeCharacteristic.writeValue(packet);
          await sleep(10); // 短暂延时防 Ble 缓冲区溢出
        }
        log('>> 20 行位图数据已下发');

        // B. 发送走纸指令 (0xA3) 吐纸 60 个点阵高度
        const feedPayload = new Uint8Array([0x3C, 0x00]); // 60 dot
        const feedPacket = makeV5CPacket(0xA3, feedPayload);
        await writeCharacteristic.writeValue(feedPacket);
        log('>> 发送走纸指令 (0xA3)');

      } catch (err) {
        log(`打印出错: ${err.message}`, 'ERROR');
      }
    });

    // 3. 单独走纸
    document.getElementById('btnFeed').addEventListener('click', async () => {
      const feedPayload = new Uint8Array([0x50, 0x00]); // 80 dot
      const feedPacket = makeV5CPacket(0xA3, feedPayload);
      await writeCharacteristic.writeValue(feedPacket);
      log('>> 手动发送走纸指令 (0xA3)');
    });
  </script>
</body>
</html>
