<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>情侣储蓄 · 选择身份</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ffe9f4 0%, #ffd9e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 248, 250, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(255, 120, 160, 0.25);
            padding: 40px 28px 48px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #a64d79;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .sub {
            font-size: 1rem;
            color: #b35d7e;
            background: #ffeef4;
            display: inline-block;
            padding: 6px 24px;
            border-radius: 20px;
            font-weight: 500;
            margin-bottom: 32px;
            border: 1px solid #ffb6cd;
        }

        .choice-grid {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 24px;
            margin: 24px 0 20px;
            flex-wrap: wrap;
        }

        .choice-btn {
            background: white;
            border: none;
            border-radius: 24px;
            padding: 20px 20px 24px;
            width: 130px;
            box-shadow: 0 4px 16px rgba(255, 80, 120, 0.15);
            transition: all 0.15s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #ffe2ed;
            touch-action: manipulation;
        }

        .choice-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(255, 80, 120, 0.2);
        }

        .choice-btn .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #ffb0cc;
            box-shadow: 0 4px 12px rgba(200, 80, 120, 0.15);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff5f9;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .choice-btn .avatar-circle img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            display: block;
        }

        .choice-label {
            font-size: 1.4rem;
            font-weight: 700;
            color: #853e5c;
            background: #ffeef4;
            padding: 4px 20px;
            border-radius: 16px;
            border: 1.5px solid #ffb0cc;
        }

        .hint {
            margin-top: 28px;
            color: #9f5b78;
            font-weight: 500;
            background: #ffdce9;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            border: 1px dashed #ff8db2;
        }

        .hint span {
            display: inline-block;
            background: #ffb7cf;
            color: #582f40;
            border-radius: 12px;
            padding: 0 10px;
            font-weight: 600;
        }

        .heart-emoji {
            font-size: 1.4rem;
            display: inline-block;
            margin: 0 4px;
        }

        .footer-text {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #b16f89;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>💞 情侣储蓄</h1>
    <div class="sub">初次见面 · 选择身份</div>

    <div class="choice-grid">
        <!-- 男朋友 = GENTO -->
        <button class="choice-btn" id="boyBtn" data-role="boy" type="button">
            <div class="avatar-circle">
                <img src="/gento.png" alt="男朋友" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22 viewBox=%220 0 80 80%22%3E%3Ccircle cx=%2240%22 cy=%2240%22 r=%2236%22 fill=%22%23aad6f0%22/%3E%3Ctext x=%2218%22 y=%2252%22 font-size=%2236%22 fill=%22%23333%22 font-family=%22Arial%22%3E👦%3C/text%3E%3C/svg%3E'">
            </div>
            <span class="choice-label">GENTO</span>
        </button>

        <!-- 女朋友 = MANTO -->
        <button class="choice-btn" id="girlBtn" data-role="girl" type="button">
            <div class="avatar-circle">
                <img src="/manto.png" alt="女朋友" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22 viewBox=%220 0 80 80%22%3E%3Ccircle cx=%2240%22 cy=%2240%22 r=%2236%22 fill=%22%23f7b8d0%22/%3E%3Ctext x=%2218%22 y=%2252%22 font-size=%2236%22 fill=%22%23333%22 font-family=%22Arial%22%3E👧%3C/text%3E%3C/svg%3E'">
            </div>
            <span class="choice-label">MANTO</span>
        </button>
    </div>

    <div class="hint">
        <span class="heart-emoji">💖</span> 选择后自动保存，下次直接进入 <span class="heart-emoji">✨</span>
    </div>
    <div class="footer-text">可爱储蓄 · 只属于你们</div>
</div>

<script>
    (function() {
        const ROLE_KEY = 'couple_role';
        const NAME_KEY = 'couple_name';
        const ICON_KEY = 'couple_icon';

        const savedRole = localStorage.getItem(ROLE_KEY);
        if (savedRole === 'boy' || savedRole === 'girl') {
            window.location.href = 'cmain.html';
            return;
        }

        const boyBtn = document.getElementById('boyBtn');
        const girlBtn = document.getElementById('girlBtn');

        function setRoleAndNavigate(role) {
            if (role === 'boy') {
                localStorage.setItem(ROLE_KEY, 'boy');
                localStorage.setItem(NAME_KEY, 'GENTO');
                localStorage.setItem(ICON_KEY, '/gento.png');
            } else if (role === 'girl') {
                localStorage.setItem(ROLE_KEY, 'girl');
                localStorage.setItem(NAME_KEY, 'MANTO');
                localStorage.setItem(ICON_KEY, '/manto.png');
            }
            window.location.href = 'cmain.html';
        }

        boyBtn.addEventListener('click', function(e) {
            e.preventDefault();
            setRoleAndNavigate('boy');
        });

        girlBtn.addEventListener('click', function(e) {
            e.preventDefault();
            setRoleAndNavigate('girl');
        });

        const allBtns = document.querySelectorAll('.choice-btn');
        allBtns.forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.96)';
            }, { passive: true });
            btn.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            }, { passive: true });
        });
    })();
</script>

</body>
</html>
